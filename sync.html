<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronizzazione Cloud</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
        .container { width: 100%; max-width: 600px; background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; font-size: 0.9em; }
        input[type="text"], input[type="url"], input[type="email"], input[type="password"] { /* Aggiunto input email e password */
            width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em;
        }
        button { width: 100%; background-color: #1976d2; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 1.1em; font-weight: 600; transition: background-color 0.3s; margin-bottom: 10px; }
        button:hover { opacity: 0.9; }
        #btn-upload { background-color: #2e7d32; }
        #btn-download { background-color: #d32f2f; }
        #btn-sign-out { background-color: #607d8b; } /* Nuovo colore per Esci */
        .auth-buttons { display: flex; gap: 10px; } /* Per affiancare Registrati/Accedi */
        .auth-buttons button { width: 50%; } /* Distribuzione equa */

        #firebase-status { padding: 10px; margin-top: 10px; border-radius: 6px; text-align: center; font-weight: 600; }
        .status-connected { background-color: #e8f5e9; color: #2e7d32; }
        .status-disconnected { background-color: #ffebee; color: #c62828; }
        .sync-actions.disabled { opacity: 0.5; pointer-events: none; }
        .warning { background-color: #fff3e0; border: 1px solid #ffcc80; padding: 15px; border-radius: 6px; font-size: 0.9em; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" style="text-decoration: none; color: #555;">&larr; Torna al Tracker</a>
        <h1>Sincronizzazione Cloud</h1>
        
        <div id="firebase-config">
            <h2>Configurazione Firebase</h2>
            <div><label for="fb-api-key">API Key</label><input type="text" id="fb-api-key"></div>
            <div><label for="fb-project-id">Project ID</label><input type="text" id="fb-project-id"></div>
            <div><label for="fb-database-url">Database URL</label><input type="url" id="fb-database-url"></div>
            <button id="btn-connect">Connetti</button>
            <div id="firebase-status" class="status-disconnected">Disconnesso</div>
        </div>

        <hr style="margin: 30px 0;">

        <div id="auth-section">
            <h2>Autenticazione Utente</h2>
            <div><label for="user-email">Email</label><input type="email" id="user-email"></div>
            <div><label for="user-password">Password</label><input type="password" id="user-password"></div>
            <div class="auth-buttons">
                <button id="btn-register">Registrati</button>
                <button id="btn-login">Accedi</button>
            </div>
            <button id="btn-sign-out" style="display: none;">Esci</button>
            <p id="auth-status" style="text-align: center; font-weight: 600; margin-top: 15px;"></p>
        </div>
        
        <hr style="margin: 30px 0;">

        <div id="sync-actions" class="sync-actions disabled">
            <h2>Azioni</h2>
            <button id="btn-upload">⬆️ Carica Dati Locali su Cloud</button>
            <button id="btn-download">⬇️ Scarica Dati dal Cloud (Sovrascrive i Locali)</button>
            <div class="warning">
                <strong>Attenzione:</strong><br>
                - <strong>Carica:</strong> Sostituisce i dati sul cloud con quelli che hai sul computer.<br>
                - <strong>Scarica:</strong> Sostituisce i dati su questo computer con quelli salvati sul cloud.
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js" type="module"></script> 
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";
        // Nuovo: Import Firebase Auth functions
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

        let db;
        let auth; // Declare auth variable
        let firebaseApp; // To store the initialized Firebase app

        const fbApiKeyInput = document.getElementById('fb-api-key');
        const fbProjectIdInput = document.getElementById('fb-project-id');
        const fbDatabaseUrlInput = document.getElementById('fb-database-url');
        const btnConnect = document.getElementById('btn-connect');
        const firebaseStatusDiv = document.getElementById('firebase-status');
        const syncActionsDiv = document.getElementById('sync-actions');
        const btnUpload = document.getElementById('btn-upload');
        const btnDownload = document.getElementById('btn-download');

        // New Auth DOM elements
        const userEmailInput = document.getElementById('user-email');
        const userPasswordInput = document.getElementById('user-password');
        const btnRegister = document.getElementById('btn-register');
        const btnLogin = document.getElementById('btn-login');
        const btnSignOut = document.getElementById('btn-sign-out');
        const authStatusP = document.getElementById('auth-status');
        const authButtonsDiv = document.querySelector('.auth-buttons');


        // IMPORTANT: These keys refer to the structure of your localStorage.
        // If you migrate trackerStorico to individual day keys (e.g., trackerStorico_YYYY-MM-DD),
        // this list will need to be dynamically generated or adjusted for cloud sync.
        // For now, it assumes the original single 'trackerStorico' key and other direct keys.
        const LOCAL_STORAGE_KEYS = ['trackerGiornoCorrente', 'trackerStorico', 'trackerFoodDatabase', 'trackerPesate', 'trackerMealType'];

        document.addEventListener('DOMContentLoaded', () => {
            const savedConfig = localStorage.getItem('firebaseSyncConfig');
            if (savedConfig) {
                try {
                    const config = JSON.parse(savedConfig);
                    fbApiKeyInput.value = config.apiKey || '';
                    fbProjectIdInput.value = config.projectId || '';
                    fbDatabaseUrlInput.value = config.databaseURL || '';
                    initFirebase(config);
                } catch(e) { console.error("Errore config salvata:", e); }
            }
            btnConnect.addEventListener('click', handleConnectClick);
            
            // New Auth Event Listeners
            btnRegister.addEventListener('click', handleRegister);
            btnLogin.addEventListener('click', handleLogin);
            btnSignOut.addEventListener('click', handleSignOut);

            btnUpload.addEventListener('click', handleUpload);
            btnDownload.addEventListener('click', handleDownload);
        });

        function handleConnectClick() {
            const config = {
                apiKey: fbApiKeyInput.value.trim(),
                projectId: fbProjectIdInput.value.trim(),
                databaseURL: fbDatabaseUrlInput.value.trim(),
            };
            if (!config.apiKey || !config.projectId || !config.databaseURL) {
                alert("Compila tutti i campi di configurazione.");
                return;
            }
            initFirebase(config);
            localStorage.setItem('firebaseSyncConfig', JSON.stringify(config));
        }

        function initFirebase(config) {
            try {
                // Ensure only one app instance is created or retrieved
                if (!getApps().some(app => app.name === "syncApp")) {
                    firebaseApp = initializeApp(config, "syncApp");
                } else {
                    firebaseApp = getApp("syncApp");
                }
                
                db = getDatabase(firebaseApp);
                auth = getAuth(firebaseApp); // Initialize auth here

                firebaseStatusDiv.textContent = "Connesso";
                firebaseStatusDiv.className = 'status-connected';
                // Sync actions initially disabled until user logs in
                // syncActionsDiv.classList.remove('disabled'); // Removed, handled by onAuthStateChanged

                // Listen for auth state changes
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        authStatusP.textContent = `Autenticato come: ${user.email}`;
                        authButtonsDiv.style.display = 'none'; // Hide login/register buttons
                        btnSignOut.style.display = 'block'; // Show sign out button
                        syncActionsDiv.classList.remove('disabled'); // Enable sync actions
                        userPasswordInput.value = ''; // Clear password field on successful login
                    } else {
                        authStatusP.textContent = "Non autenticato";
                        authButtonsDiv.style.display = 'flex'; // Show login/register buttons
                        btnSignOut.style.display = 'none'; // Hide sign out button
                        syncActionsDiv.classList.add('disabled'); // Disable sync actions
                    }
                });

            } catch (error) {
                firebaseStatusDiv.textContent = `Errore Connessione: ${error.message}`;
                firebaseStatusDiv.className = 'status-disconnected';
                syncActionsDiv.classList.add('disabled');
                authStatusP.textContent = "Errore di connessione Firebase. Autenticazione non disponibile.";
            }
        }

        async function handleRegister() {
            const email = userEmailInput.value.trim();
            const password = userPasswordInput.value.trim();
            if (!email || !password) {
                alert("Inserisci email e password per registrarti.");
                return;
            }
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert("Registrazione completata e accesso effettuato!");
                // onAuthStateChanged will handle UI update
            } catch (error) {
                alert(`Errore di registrazione: ${error.message}`);
            }
        }

        async function handleLogin() {
            const email = userEmailInput.value.trim();
            const password = userPasswordInput.value.trim();
            if (!email || !password) {
                alert("Inserisci email e password per accedere.");
                return;
            }
            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert("Accesso effettuato con successo!");
                // onAuthStateChanged will handle UI update
            } catch (error) {
                alert(`Errore di accesso: ${error.message}`);
            }
        }

        async function handleSignOut() {
            try {
                await signOut(auth);
                alert("Disconnessione avvenuta.");
                // onAuthStateChanged will handle UI update
            } catch (error) {
                alert(`Errore durante la disconnessione: ${error.message}`);
            }
        }

        function getUserDataRef() {
            if (auth && auth.currentUser) {
                // IMPORTANT: This path determines where your data is stored for each user.
                // For now, it points to a common root for all LOCAL_STORAGE_KEYS,
                // which might need refinement if you have many dates in trackerStorico.
                // A more robust approach would be to iterate through trackerStorico_YYYY-MM-DD
                // keys and save them under /users/<UID>/storico/YYYY-MM-DD
                return ref(db, 'users/' + auth.currentUser.uid + '/all_local_data/');
            }
            alert("Devi essere autenticato per sincronizzare i dati.");
            return null;
        }

        async function handleUpload() {
            const dataRef = getUserDataRef();
            if (!dataRef) return;

            if (!confirm("Sei sicuro di voler sovrascrivere i dati sul cloud con quelli locali?")) return;
            
            const localData = {};
            // Iterate through all localStorage items that start with 'trackerStorico_'
            // and include other specific LOCAL_STORAGE_KEYS.
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('trackerStorico_') || LOCAL_STORAGE_KEYS.includes(key)) {
                    try {
                        localData[key] = JSON.parse(localStorage.getItem(key));
                    } catch (e) {
                        console.warn(`Skipping invalid JSON for key ${key}:`, e);
                    }
                }
            }
            
            try {
                await set(dataRef, localData);
                alert("Caricamento completato con successo!");
            } catch(err) {
                alert(`Errore durante il caricamento: ${err.message}`);
            }
        }

        async function handleDownload() {
            const dataRef = getUserDataRef();
            if (!dataRef) return;

            if (!confirm("ATTENZIONE: i dati locali verranno sovrascritti. Continuare?")) return;

            try {
                const snapshot = await get(dataRef);
                if (snapshot.exists()) {
                    const cloudData = snapshot.val();
                    // Clear only relevant localStorage keys before downloading
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key.startsWith('trackerStorico_') || LOCAL_STORAGE_KEYS.includes(key)) {
                            localStorage.removeItem(key);
                        }
                    }

                    // Populate localStorage with cloud data
                    for (const key in cloudData) {
                        if (Object.prototype.hasOwnProperty.call(cloudData, key)) {
                            localStorage.setItem(key, JSON.stringify(cloudData[key]));
                        }
                    }
                    alert("Download completato! Ricarica la pagina del tracker per vedere le modifiche.");
                } else {
                    alert("Nessun dato trovato sul cloud per questo utente.");
                }
            } catch(err) {
                alert(`Errore durante il download: ${err.message}`);
            }
        }
    </script>
</body>
</html>
