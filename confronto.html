<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confronto Mensile</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 900px; background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; vertical-align: middle; }
        th { background-color: #f2f2f2; font-weight: 600; }
        #link-indietro { display: block; text-align: center; margin-bottom: 20px; padding: 10px; background-color: #607d8b; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
        .positivo { color: #2e7d32; font-weight: bold; }
        .negativo { color: #c62828; font-weight: bold; }
        .neutro { color: #546e7a; }
        .delete-btn { background-color: transparent; border: none; color: #d32f2f; font-size: 1.3em; font-weight: bold; cursor: pointer; padding: 0 8px; border-radius: 50%; line-height: 1; }
        .delete-btn:hover { background-color: #ffebee; color: #b71c1c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Confronto Mensile Progressi</h1>
        <a href="index.html" id="link-indietro">⬅️ Torna al Tracker Giornaliero</a>

        <div class="sezione">
            <h2>Tabella di Confronto</h2>
            <p>Questa tabella mostra l'evoluzione della tua composizione corporea nel tempo.</p>
            <table id="confronto-table">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Peso (kg)</th>
                        <th>Variazione Peso</th>
                        <th>Grasso (%)</th>
                        <th>Variazione Grasso</th>
                        <th>Massa Muscolare (kg)</th>
                        <th>Variazione Muscolo</th>
                        <th>Azione</th>
                    </tr>
                </thead>
                <tbody id="confronto-body">
                    </tbody>
            </table>
        </div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const confrontoBody = document.getElementById('confronto-body');

        function caricaDati() {
            const storicoPesate = JSON.parse(localStorage.getItem('trackerPesate')) || [];
            confrontoBody.innerHTML = ''; // Pulisce la tabella prima di ricaricarla

            if (storicoPesate.length === 0) {
                confrontoBody.innerHTML = `<tr><td colspan="8">Nessuna pesata registrata.</td></tr>`;
                return;
            }

            storicoPesate.sort((a, b) => new Date(a.data) - new Date(b.data));

            let pesataPrecedente = null;

            storicoPesate.forEach(pesata => {
                const [year, month, day] = pesata.data.split('-');
                const dataFormattata = `${day}/${month}/${year.slice(2)}`;
                const massaMuscolareKg = (pesata.peso * (pesata.muscolo / 100)).toFixed(2);

                let varPesoHtml = '<span class="neutro">-</span>';
                let varGrassoHtml = '<span class="neutro">-</span>';
                let varMuscoloHtml = '<span class="neutro">-</span>';

                if (pesataPrecedente) {
                    const varPeso = (pesata.peso - pesataPrecedente.peso).toFixed(2);
                    const varGrasso = (pesata.grasso - pesataPrecedente.grasso).toFixed(2);
                    const varMuscolo = (massaMuscolareKg - (pesataPrecedente.peso * (pesataPrecedente.muscolo / 100))).toFixed(2);

                    varPesoHtml = `<span class="${varPeso >= 0 ? 'negativo' : 'positivo'}">${varPeso > 0 ? '+' : ''}${varPeso} kg</span>`;
                    varGrassoHtml = `<span class="${varGrasso >= 0 ? 'negativo' : 'positivo'}">${varGrasso > 0 ? '+' : ''}${varGrasso}%</span>`;
                    varMuscoloHtml = `<span class="${varMuscolo >= 0 ? 'positivo' : 'negativo'}">${varMuscolo > 0 ? '+' : ''}${varMuscolo} kg</span>`;
                }

                const riga = confrontoBody.insertRow();
                riga.innerHTML = `
                    <td><strong>${dataFormattata}</strong></td>
                    <td>${pesata.peso}</td>
                    <td>${varPesoHtml}</td>
                    <td>${pesata.grasso}%</td>
                    <td>${varGrassoHtml}</td>
                    <td>${massaMuscolareKg}</td>
                    <td>${varMuscoloHtml}</td>
                    <td><button class="delete-btn" data-data-pesata="${pesata.data}" title="Cancella questa pesata">&times;</button></td>
                `;

                pesataPrecedente = pesata;
            });
        }

        function cancellaPesata(dataDaCancellare) {
            if (!confirm(`Sei sicuro di voler cancellare la pesata del ${dataDaCancellare}? L'operazione è irreversibile.`)) {
                return;
            }
            let storicoPesate = JSON.parse(localStorage.getItem('trackerPesate')) || [];
            const nuovoStorico = storicoPesate.filter(pesata => pesata.data !== dataDaCancellare);
            localStorage.setItem('trackerPesate', JSON.stringify(nuovoStorico));
            
            // Ricarica la tabella per mostrare le modifiche
            caricaDati();
        }

        confrontoBody.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn')) {
                const dataPesata = e.target.dataset.dataPesata;
                if(dataPesata) {
                    cancellaPesata(dataPesata);
                }
            }
        });

        // Caricamento iniziale
        caricaDati();
    });
</script>
</body>
</html>
