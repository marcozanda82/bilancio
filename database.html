<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizzatore Database Alimenti</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 2rem;
            background-color: #f4f7f9;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .table-container {
            width: 100%;
            overflow-x: auto; /* Permette lo scorrimento orizzontale su schermi piccoli */
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
            white-space: nowrap; /* Evita che il testo vada a capo */
        }
        thead th {
            background-color: #34495e;
            color: #ffffff;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tbody tr:nth-of-type(even) {
            background-color: #f8f9fa;
        }
        tbody tr:hover {
            background-color: #e9ecef;
        }
        .error {
            text-align: center;
            padding: 2rem;
            color: #c0392b;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <h1>Database Alimenti</h1>

    <div class="table-container">
        <table>
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
    
    <div id="error-container" class="error"></div>


    <script>
        // --- CONFIGURAZIONE ---
        const jsonFileName = 'foodDatabase_backup.json';

        // Funzione principale per caricare e visualizzare i dati
        async function loadAndDisplayData() {
            try {
                const response = await fetch(jsonFileName);
                if (!response.ok) {
                    throw new Error(`Impossibile trovare il file: ${jsonFileName}. Assicurati che sia nella stessa cartella di questo file HTML.`);
                }
                const data = await response.json();

                // --- QUESTA È LA PARTE IMPORTANTE ---
                // Trasforma l'oggetto JSON in una lista (array) che la tabella può usare.
                // Questo permette di mantenere il file JSON originale nel suo formato a oggetto.
                const dataArray = Object.entries(data).map(([name, values]) => {
                    return {
                        nome_alimento: name, // Aggiunge il nome dell'alimento come prima colonna
                        ...values           // Copia tutti gli altri dati (kcal, prot, etc.)
                    };
                });
                
                if (dataArray.length === 0) {
                    throw new Error("Il file JSON è vuoto o non contiene dati validi.");
                }

                // Popola la tabella con i dati trasformati
                populateTable(dataArray);

            } catch (error) {
                // Mostra un messaggio di errore se qualcosa va storto
                document.getElementById('error-container').textContent = `ERRORE: ${error.message}`;
            }
        }

        // Funzione per creare la tabella nel documento HTML
        function populateTable(data) {
            const tableHead = document.getElementById('table-head');
            const tableBody = document.getElementById('table-body');
            
            // Pulisce la tabella precedente
            tableHead.innerHTML = '';
            tableBody.innerHTML = '';

            // --- Creazione Intestazioni (Header) ---
            // Raccoglie tutte le possibili colonne da tutti gli alimenti
            const headerSet = new Set();
            data.forEach(item => {
                Object.keys(item).forEach(key => headerSet.add(key));
            });
            
            // Converte il Set in un array e mette 'nome_alimento' per primo
            let headers = Array.from(headerSet);
            headers = headers.filter(h => h !== 'nome_alimento');
            headers.unshift('nome_alimento');
            
            const headerRow = document.createElement('tr');
            headers.forEach(headerText => {
                const th = document.createElement('th');
                th.textContent = headerText.replace(/_/g, ' '); // Rende i nomi più leggibili
                headerRow.appendChild(th);
            });
            tableHead.appendChild(headerRow);

            // --- Creazione Righe Dati ---
            data.forEach(item => {
                const row = document.createElement('tr');
                headers.forEach(header => {
                    const cell = document.createElement('td');
                    // Usa il valore della cella se esiste, altrimenti mette un trattino
                    const cellValue = item[header] !== null && item[header] !== undefined ? item[header] : '-';
                    cell.textContent = cellValue;
                    row.appendChild(cell);
                });
                tableBody.appendChild(row);
            });
        }

        // Avvia il processo quando la pagina viene caricata
        document.addEventListener('DOMContentLoaded', loadAndDisplayData);
    </script>

</body>
</html>
