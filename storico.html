<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storico Nutrizionale</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 900px; background-color: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9em; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f2f2f2; font-weight: 600; }
        tr:hover { background-color: #f5f5f5; }
        .nav-link { display: inline-block; margin-bottom: 20px; padding: 10px 15px; background-color: #607d8b; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
        .deficit { color: #d32f2f; font-weight: bold; }
        .surplus { color: #2e7d32; font-weight: bold; }
        #summary { margin-top: 20px; padding: 15px; background-color: #e3f2fd; border: 1px solid #90caf9; border-radius: 8px; }
        #summary h2 { margin-top: 0; font-size: 1.2em; border-bottom: 1px solid #ccc; }
        #summary p { margin: 8px 0; font-size: 1.1em; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="nav-link">⬅️ Torna al Tracker</a>
        <h1>Storico Nutrizionale</h1>

        <div id="summary">
            <h2>Riepilogo Totale</h2>
            <p>Deficit/Surplus Complessivo: <span id="somma-deficit" class="deficit">0</span> kcal</p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Tipo Giornata</th>
                    <th>Obiettivo (kcal)</th>
                    <th>Consumo (kcal)</th>
                    <th>Proteine (g)</th>
                    <th>Deficit/Surplus (kcal)</th>
                </tr>
            </thead>
            <tbody id="storico-body">
                </tbody>
        </table>
    </div>

    <script>
        const PIANO_SETTIMANALE = {
            0: { tipo: '💧 Riposo (Deficit)', cal_base: 2300 }, // Domenica
            1: { tipo: '🔥 Forza (Surplus)', cal_base: 2300 }, // Lunedì
            2: { tipo: '💪 Forza (Surplus)', cal_base: 2300 }, // Martedì
            3: { tipo: '🏃 Cardio (Deficit)', cal_base: 2300 }, // Mercoledì
            4: { tipo: '🏋️ Forza (Surplus)', cal_base: 2300 }, // Giovedì
            5: { tipo: '🏃 Cardio (Surplus)', cal_base: 2300 }, // Venerdì
            6: { tipo: '🥗 Mantenimento (Deficit)', cal_base: 2300 }  // Sabato
        };

        const DEFICIT_PREIMPOSTATO_SETTIMANALE = { 0: -250, 1: +300, 2: +300, 3: -250, 4: +300, 5: +300, 6: -250 };

        document.addEventListener('DOMContentLoaded', () => {
            const storicoBody = document.getElementById('storico-body');
            const sommaDeficitEl = document.getElementById('somma-deficit');
            let sommaDeficit = 0;
            const datiStorico = [];

            // Carica tutti i dati dalla localStorage
            for (const key in localStorage) {
                if (key.startsWith('trackerStorico_')) {
                    try {
                        const giorno = JSON.parse(localStorage.getItem(key));
                        if (giorno && giorno.data) {
                            datiStorico.push(giorno);
                        }
                    } catch (e) {
                        console.error(`Errore nel parsing del dato per la chiave ${key}:`, e);
                    }
                }
            }

            // Ordina i dati per data, dal più recente al più vecchio
            datiStorico.sort((a, b) => new Date(b.data) - new Date(a.data));

            // Processa e visualizza ogni giorno
            datiStorico.forEach(giorno => {
                if (!giorno.log || giorno.log.length === 0) {
                    return; // Salta i giorni vuoti
                }

                // *** BLOCCO DI CODICE CORRETTO ***
                // Calcola correttamente il consumo calorico e le proteine, anche per i pasti
                let consumoCalorie = 0;
                let proteineTotali = 0;
                giorno.log.forEach(entry => {
                    if (entry.type !== 'workout') {
                        if (entry.type === 'meal') {
                            // Se è un pasto, scorri i suoi elementi interni
                            entry.items.forEach(item => {
                                consumoCalorie += (item.kcal || item.cal || 0);
                                proteineTotali += item.prot || 0;
                            });
                        } else {
                            // Altrimenti, è un alimento singolo
                            consumoCalorie += (entry.kcal || entry.cal || 0);
                            proteineTotali += (entry.prot || 0);
                        }
                    }
                });


                if (consumoCalorie === 0) return; // Salta i giorni in cui non si è mangiato nulla

                const dataGiorno = new Date(giorno.data);
                const giornoSettimana = dataGiorno.getDay();
                const pianoDelGiorno = PIANO_SETTIMANALE[giornoSettimana] || PIANO_SETTIMANALE[0];
                
                const adjustment = giorno.calorieAdjustment !== undefined 
                    ? giorno.calorieAdjustment 
                    : (DEFICIT_PREIMPOSTATO_SETTIMANALE[giornoSettimana] || 0);

                const obiettivoCalorie = pianoDelGiorno.cal_base + adjustment;
                const differenza = consumoCalorie - obiettivoCalorie;
                sommaDeficit += differenza;

                const riga = storicoBody.insertRow();
                riga.innerHTML = `
                    <td>${dataGiorno.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' })}</td>
                    <td>${pianoDelGiorno.tipo}</td>
                    <td>${obiettivoCalorie.toFixed(0)}</td>
                    <td>${consumoCalorie.toFixed(0)}</td>
                    <td>${proteineTotali.toFixed(1)}</td>
                    <td class="${differenza < 0 ? 'deficit' : 'surplus'}">${differenza >= 0 ? '+' : ''}${differenza.toFixed(0)}</td>
                `;
            });

            // Aggiorna il riepilogo totale
            sommaDeficitEl.textContent = `${sommaDeficit >= 0 ? '+' : ''}${sommaDeficit.toFixed(0)}`;
            sommaDeficitEl.className = sommaDeficit < 0 ? 'deficit' : 'surplus';
        });
    </script>
</body>
</html>
