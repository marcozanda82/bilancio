<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storico Dettagliato</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; }
        .giorno-storico { background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h1, h2, h3 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; }
        h2 { font-size: 1.6em; }
        h3 { font-size: 1.2em; border-bottom: none; margin-top: 20px; }
        .nav-links a { display: inline-block; margin-top: 10px; padding: 10px 15px; background-color: #607d8b; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.8em; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; vertical-align: middle; }
        th { background-color: #f2f2f2; font-weight: 600; }
        .riepilogo-giorno { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; background-color: #fafafa; padding: 15px; border-radius: 8px; margin-top: 15px; }
        .riepilogo-giorno p { margin: 0; font-size: 1em; }
        .riepilogo-giorno span { font-weight: 600; }
        /* Stili per raggruppamento */
        .meal-group-row { background-color: #f0f4f8; font-weight: bold; }
        .expand-arrow { cursor: pointer; display: inline-block; width: 20px; text-align: center; }
        .sub-item-row td { padding-left: 25px !important; background-color: #fff; font-style: italic; color: #555; border-bottom: 1px dotted #ccc; }
        .sub-item-row td:first-child { border-left: 3px solid #1976d2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Storico Giornaliero</h1>
        <div class="nav-links">
            <a href="index.html">⬅️ Torna al Tracker</a>
        </div>
        <div id="storico-container">
            <p>Nessun dato storico trovato.</p>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const storicoContainer = document.getElementById('storico-container');
    let storico = JSON.parse(localStorage.getItem('trackerStorico')) || [];

    function renderStorico() {
        if (storico.length === 0) {
            storicoContainer.innerHTML = '<p>Nessun dato storico trovato.</p>';
            return;
        }

        storicoContainer.innerHTML = '';
        
        // Ordina i giorni dal più recente al più vecchio
        storico.sort((a, b) => new Date(b.data) - new Date(a.data));

        storico.forEach((giorno, giornoIndex) => {
            const giornoDiv = document.createElement('div');
            giornoDiv.className = 'giorno-storico';

            const dataFormatted = new Date(giorno.data).toLocaleDateString('it-IT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            let html = `<h2>${dataFormatted}</h2>`;
            
            // Riepilogo
            html += `
                <div class="riepilogo-giorno">
                    <p>Calorie: <span>${giorno.totali.calorie.toFixed(0)} kcal</span></p>
                    <p>Proteine: <span>${giorno.totali.proteine.toFixed(1)} g</span></p>
                    <p>Workout: <span>${giorno.totali.workoutCalorie} kcal</span></p>
                    <p>Deficit: <span>${giorno.deficit} kcal</span></p>
                </div>`;
            
            // Tabella Diario
            html += `<h3>Diario Alimentare</h3>`;
            if (giorno.log && giorno.log.length > 0) {
                html += `
                    <table>
                        <thead>
                            <tr>
                                <th>Descrizione</th><th>(g)</th><th>Prot</th>
                                <th>Kcal</th><th>Mg</th><th>K</th><th>Vit.C</th><th>Ca</th>
                            </tr>
                        </thead>
                        <tbody>`;
                
                giorno.log.forEach((entry, pastoIndex) => {
                    if (entry.type === 'meal') {
                        const arrow = entry.isExpanded ? '&#9652;' : '&#9662;';
                        html += `
                            <tr class="meal-group-row">
                                <td style="text-align:left; padding-left:5px;">
                                    <span class="expand-arrow" data-giorno-index="${giornoIndex}" data-pasto-index="${pastoIndex}">${arrow}</span> ${entry.desc}
                                </td>
                                <td>${entry.items.reduce((sum, i) => sum + i.qta, 0)}g</td>
                                <td>${entry.prot.toFixed(1)}</td><td>${entry.cal.toFixed(0)}</td>
                                <td>${(entry.mg || 0).toFixed(1)}</td><td>${(entry.k || 0).toFixed(0)}</td>
                                <td>${(entry.vitc || 0).toFixed(1)}</td><td>${(entry.ca || 0).toFixed(1)}</td>
                            </tr>`;
                        if (entry.isExpanded) {
                            entry.items.forEach(item => {
                                html += `
                                    <tr class="sub-item-row">
                                        <td>${item.desc}</td><td>${item.qta}g</td>
                                        <td>${item.prot.toFixed(1)}</td><td>${item.cal.toFixed(0)}</td>
                                        <td>${(item.mg || 0).toFixed(1)}</td><td>${(item.k || 0).toFixed(0)}</td>
                                        <td>${(item.vitc || 0).toFixed(1)}</td><td>${(item.ca || 0).toFixed(1)}</td>
                                    </tr>`;
                            });
                        }
                    } else { // Voce singola
                        html += `
                            <tr>
                                <td>${entry.desc}</td><td>${entry.qta}g</td>
                                <td>${entry.prot.toFixed(1)}</td><td>${entry.cal.toFixed(0)}</td>
                                <td>${(entry.mg || 0).toFixed(1)}</td><td>${(entry.k || 0).toFixed(0)}</td>
                                <td>${(entry.vitc || 0).toFixed(1)}</td><td>${(entry.ca || 0).toFixed(1)}</td>
                            </tr>`;
                    }
                });
                html += `</tbody></table>`;
            } else {
                html += `<p>Nessun dato alimentare registrato per questo giorno.</p>`;
            }
            giornoDiv.innerHTML = html;
            storicoContainer.appendChild(giornoDiv);
        });
    }

    storicoContainer.addEventListener('click', (e) => {
        if (e.target.classList.contains('expand-arrow')) {
            const giornoIndex = parseInt(e.target.dataset.giornoIndex, 10);
            const pastoIndex = parseInt(e.target.dataset.pastoIndex, 10);
            
            const pasto = storico[giornoIndex]?.log[pastoIndex];
            if (pasto && pasto.type === 'meal') {
                pasto.isExpanded = !pasto.isExpanded;
                // Salva lo stato espanso/compresso nello storico
                localStorage.setItem('trackerStorico', JSON.stringify(storico));
                // Ridisegna l'interfaccia
                renderStorico();
            }
        }
    });

    // Prima visualizzazione
    renderStorico();
});
</script>
</body>
</html>
