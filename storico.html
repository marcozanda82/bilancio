<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storico Dettagliato - Tabella Trend</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
        .container { width: 100%; max-width: 950px; }
        h1 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; margin-bottom: 20px;}
        .nav-links a { display: inline-block; margin-bottom: 25px; padding: 10px 15px; background-color: #607d8b; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }

        .storico-table { width: 100%; border-collapse: collapse; background-color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden;}
        th, td { padding: 12px 15px; text-align: left; vertical-align: middle; }
        th { background-color: #e8eaf6; font-weight: 600; color: #3f51b5; }
        
        /* Stili per le righe giornaliere */
        .day-summary-row {
            border-bottom: 1px solid #e0e0e0; /* Bordi più sottili per i giorni */
            cursor: pointer;
            transition: background-color 0.2s;
            background-color: #fcfcfc; /* Leggermente più chiaro */
        }
        .day-summary-row:hover { background-color: #f0f0f5; }
        .day-summary-row.expanded { background-color: #e6e9f0; } /* Colore leggermente più scuro quando espanso */
        
        .day-detail-row { display: none; }
        .day-detail-row.expanded { display: table-row; }
        .detail-cell { padding: 20px !important; background-color: #fafafa; }
        .detail-cell h4 { margin-top: 0; }
        .detail-cell table { width: 100%; box-shadow: none; border-radius: 0; font-size: 0.9em; }
        
        .expand-arrow { display: inline-block; transition: transform 0.2s; font-size: 0.8em; }
        .day-summary-row.expanded .expand-arrow { transform: rotate(90deg); }

        .meal-group-row { background-color: #f5f5f5; font-weight: bold; cursor: pointer; }
        .meal-expand-arrow { display: inline-block; width: 20px; transition: transform 0.2s; }
        .meal-group-row.expanded .meal-expand-arrow { transform: rotate(90deg); }
        .sub-item-row { display: none; }
        .meal-group-row.expanded + .sub-item-row { display: table-row; } 
        .meal-group-row.expanded ~ .sub-item-row.meal-active { display: table-row; }

        .trend-muscle { font-size: 1.5em; font-weight: bold; }
        .trend-up { color: #4caf50; }
        .trend-down { color: #f44336; }
        .trend-neutral { color: #9e9e9e; }

        /* NUOVI STILI PER LE RIGHE SETTIMANALI */
        .week-summary-row {
            background-color: #d8e2f0; /* Un colore distinto per le settimane */
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            border-top: 3px solid #8e9cc1; /* Bordo superiore più spesso */
            border-bottom: 3px solid #8e9cc1; /* Bordo inferiore più spesso */
        }
        .week-summary-row:hover {
            background-color: #cdd5e0;
        }
        .week-summary-row.expanded {
            background-color: #bcc5d4;
        }
        .week-summary-row td {
            padding: 15px 15px; /* Più padding per le righe settimanali */
            color: #2c3e50; /* Colore testo più scuro */
        }
        .week-detail-row {
            display: none;
            background-color: #eff3f7; /* Sfondo leggermente diverso per i dettagli settimanali */
        }
        .week-detail-row.expanded {
            display: table-row;
        }
        .week-detail-cell {
            padding: 0 !important; /* Rimuovi padding sulla cella contenitore dei dettagli settimanali */
        }
        .week-detail-inner-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 0; /* Nessun margine per non creare spazi extra */
            background-color: transparent; /* Permetti al background della cella esterna di trasparire */
            box-shadow: none; /* Rimuovi ombre superflue */
        }
        .week-detail-inner-table th, .week-detail-inner-table td {
            padding: 8px 15px; /* Padding interno più piccolo per i giorni nella settimana */
            border-bottom: 1px dashed #e0e0e0; /* Bordo tratteggiato tra i giorni */
        }
        .week-detail-inner-table thead th {
             background-color: #e3eaf2; /* Sfondo leggermente diverso per l'header dei giorni nella settimana */
             color: #4a6785;
        }
        .week-detail-inner-table tbody tr:last-child td {
            border-bottom: none; /* Nessun bordo inferiore per l'ultimo giorno della settimana */
        }

        /* Stili per i riepiloghi settimanali */
        .weekly-summary-trend { font-size: 1.2em; font-weight: bold; }
        .weekly-fat-change { color: #8d6e63; } /* Marrone per il grasso */
        .weekly-muscle-trend { color: #009688; } /* Verde acqua per i muscoli */
        .weekly-weight-change { color: #673ab7; } /* Viola per il peso */

        /* Allineamento icone nei thead */
        .storico-table th i { margin-right: 5px; }

    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Storico e Trend Giornalieri</h1>
        <div class="nav-links">
            <a href="index.html">⬅️ Torna al Tracker</a>
        </div>
        <div class="storico-table-container">
            <table class="storico-table">
                <thead>
                    <tr>
                        <th>Data <i class="fas fa-calendar-alt"></i></th>
                        <th>Proteine <i class="fas fa-egg"></i></th>
                        <th>Calorie <i class="fas fa-fire"></i></th>
                        <th>Workout <i class="fas fa-running"></i></th>
                        <th>Bilancio Kcal <i class="fas fa-balance-scale"></i></th>
                        <th>Grasso (g) <i class="fas fa-apple-alt"></i></th>
                        <th>Massa Musc. <i class="fas fa-dumbbell"></i></th>
                        <th>Peso (kg) <i class="fas fa-weight"></i></th> </tr>
                </thead>
                <tbody id="storico-body"></tbody>
            </table>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const storicoBody = document.getElementById('storico-body');

    // Funzione per recuperare tutti i dati dallo storico LocalStorage
    function caricaTuttoLoStorico() {
        const storicoDati = [];
        const dateViste = new Set(); 

        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith('trackerStorico_')) {
                try {
                    const dataString = key.replace('trackerStorico_', '');
                    
                    if (dateViste.has(dataString)) {
                        console.warn(`Saltando potenziale duplicato per la data: ${dataString}`);
                        continue; 
                    }

                    const datiGiorno = JSON.parse(localStorage.getItem(key));
                    
                    if (datiGiorno) {
                        // Assicurati che l'oggetto del giorno abbia sempre una proprietà 'data'
                        // preferibilmente quella dalla chiave per consistenza
                        if (!datiGiorno.data || datiGiorno.data !== dataString) {
                            datiGiorno.data = dataString; // Forza la data dalla chiave per consistenza
                        }
                        storicoDati.push(datiGiorno);
                        dateViste.add(dataString);
                    }

                } catch (e) {
                    console.error("Errore nel parsing dei dati storici per la chiave:", key, e);
                }
            }
        }

        // Ordina i dati dal più recente al più vecchio
        storicoDati.sort((a, b) => new Date(b.data) - new Date(a.data));
        return storicoDati;
    }

    // Costanti per il piano settimanale (COPIA ESATTAMENTE DA INDEX.HTML PER CONSISTENZA)
    const PIANO_SETTIMANALE = {
        0: { tipo: '💧 Riposo (Deficit)', cal_base: 2300, prot: 140 }, // Domenica
        1: { tipo: '🔥 Forza (Mantenimento)', cal_base: 2300, prot: 140 }, // Lunedì
        2: { tipo: '💪 Forza (Mantenimento)', cal_base: 2300, prot: 140 }, // Martedì
        3: { tipo: '🏃 Cardio (Deficit)', cal_base: 2300, prot: 140 }, // Mercoledì
        4: { tipo: '🏋️ Forza (Mantenimento)', cal_base: 2300, prot: 140 }, // Giovedì
        5: { tipo: '🏃 Cardio (Deficit)', cal_base: 2300, prot: 140 }, // Venerdì
        6: { tipo: '🥗 Mantenimento (Free)', cal_base: 2300, prot: 140 }  // Sabato
    };

    // NUOVA COSTANTE: Deficit/Surplus preimpostato per giorno della settimana (COPIA DA INDEX.HTML)
    const DEFICIT_PREIMPOSTATO_SETTIMANALE = {
        0: -500, // Domenica
        1: -150, // Lunedì
        2: -150, // Martedì
        3: -150, // Mercoledì
        4: -150, // Giovedì
        5: -150, // Venerdì
        6: -500  // Sabato
    };


    // Funzione per raggruppare i dati per settimana
    // La settimana inizia di Lunedì (ISO standard)
    function raggruppaPerSettimana(datiGiornalieri) {
        const settimane = {}; // Chiave: 'YYYY-WW' (anno-settimana)
        
        // Ordina i dati dal più vecchio al più recente per una corretta aggregazione settimanale
        // (temporaneo, l'ordinamento finale sarà dal più recente al più vecchio per la visualizzazione)
        const datiOrdinati = [...datiGiornalieri].sort((a, b) => new Date(a.data) - new Date(b.data));

        datiOrdinati.forEach(giorno => {
            const data = new Date(giorno.data + 'T00:00:00'); // Aggiungi T00:00:00 per evitare problemi di fuso orario
            const anno = data.getFullYear();
            const primoGiornoAnno = new Date(anno, 0, 1);
            
            // Calcola il numero della settimana (ISO 8601, Lunedì come primo giorno)
            const dayNum = data.getDay() || 7; // getDay() restituisce 0 per domenica, vogliamo 7
            data.setDate(data.getDate() + 4 - dayNum); // Ajusta a Giovedì della settimana ISO
            const weekNumber = Math.ceil((((data - primoGiornoAnno) / 86400000) + 1) / 7);

            const settimanaKey = `${anno}-${String(weekNumber).padStart(2, '0')}`; // Correzione qui: settimanaKey

            if (!settimane[settimanaKey]) { // Correzione qui: settimanaKey
                const startOfWeek = new Date(data.getFullYear(), data.getMonth(), data.getDate());
                startOfWeek.setDate(startOfWeek.getDate() - (startOfWeek.getDay() + 6) % 7); // Torna al Lunedì della settimana
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6); // Vai alla Domenica della settimana

                settimane[settimanaKey] = { // Correzione qui: settimanaKey
                    data_inizio: startOfWeek.toISOString().split('T')[0],
                    data_fine: endOfWeek.toISOString().split('T')[0],
                    giorni: [],
                    totaleGrassoG: 0,
                    totaleBilancioCalorico: 0,
                    scoreMuscoloAccumulato: 0,
                    conteggioGiorniConDatiMuscolo: 0,
                    totaleWorkoutCalorie: 0, 
                    totaleProteine: 0,
                    totaleCalorieConsumate: 0
                };
            }
            settimane[settimanaKey].giorni.push(giorno); // Correzione qui: settimanaKey

            // Aggrega i valori per la settimana
            settimane[settimanaKey].totaleGrassoG += giorno.variazioneGrassoG || 0; // Correzione qui: settimanaKey
            settimane[settimanaKey].totaleBilancioCalorico += giorno.bilancioCalorico || 0; // Correzione qui: settimanaKey
            
            if (typeof giorno.scoreMuscolo === 'number') {
                settimane[settimanaKey].scoreMuscoloAccumulato += giorno.scoreMuscolo; // Correzione qui: settimanaKey
                settimane[settimanaKey].conteggioGiorniConDatiMuscolo++; // Correzione qui: settimanaKey
            }
            settimane[settimanaKey].totaleWorkoutCalorie += giorno.workoutCalorie || 0; // Correzione qui: settimanaKey
            settimane[settimanaKey].totaleProteine += giorno.proteine || 0; // Correzione qui: settimanaKey
            settimane[settimanaKey].totaleCalorieConsumate += giorno.calorie || 0; // Correzione qui: settimanaKey

            // Assicurati che i giorni all'interno della settimana siano ordinati dal più recente al più vecchio
            settimane[settimanaKey].giorni.sort((a, b) => new Date(b.data) - new Date(a.data)); // Correzione qui: settimanaKey
        });

        // Converti l'oggetto in array e ordina le settimane dalla più recente alla più vecchia
        const settimaneArray = Object.values(settimane).sort((a, b) => new Date(b.data_inizio) - new Date(a.data_inizio));
        return settimaneArray;
    }


    function renderStorico() {
        const storicoCompleto = caricaTuttoLoStorico();

        if (storicoCompleto.length === 0) {
            storicoBody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 20px;">Nessun dato storico trovato.</td></tr>';
            return;
        }

        storicoBody.innerHTML = ''; // Pulisci la tabella prima di ripopolarla

        const settimaneRaggruppate = raggruppaPerSettimana(storicoCompleto);

        settimaneRaggruppate.forEach((settimana, weekIndex) => {
            // Calcola il trend muscolare settimanale
            let trendMuscoloSettimanaleHtml = '<span class="trend-neutral weekly-summary-trend">―</span>';
            if (settimana.conteggioGiorniConDatiMuscolo > 0) {
                const avgScoreMuscolo = settimana.scoreMuscoloAccumulato / settimana.conteggioGiorniConDatiMuscolo;
                if (avgScoreMuscolo > 0.2) { // Soglia per considerare un aumento significativo
                    trendMuscoloSettimanaleHtml = '<span class="trend-up weekly-summary-trend">▲ Aumento</span>';
                } else if (avgScoreMuscolo < -0.2) { // Soglia per considerare una diminuzione significativa
                    trendMuscoloSettimanaleHtml = '<span class="trend-down weekly-summary-trend">▼ Diminuzione</span>';
                } else {
                    trendMuscoloSettimanaleHtml = '<span class="trend-neutral weekly-summary-trend">― Mantenimento</span>';
                }
            }

            // Calcolo variazione peso settimanale (stimata dal bilancio calorico aggregato)
            const variazionePesoStimataKg = settimana.totaleBilancioCalorico / 7700; // 7700 kcal per 1kg di peso
            let testoVariazionePesoSettimanale = '';
            if (variazionePesoStimataKg < 0) {
                testoVariazionePesoSettimanale = `<span class="trend-down weekly-summary-trend">${variazionePesoStimataKg.toFixed(2)} kg (Perso)</span>`;
            } else if (variazionePesoStimataKg > 0) {
                testoVariazionePesoSettimanale = `<span class="trend-up weekly-summary-trend">+${variazionePesoStimataKg.toFixed(2)} kg (Guadagnato)</span>`;
            } else {
                testoVariazionePesoSettimanale = `<span class="trend-neutral weekly-summary-trend">0.00 kg</span>`;
            }


            const weekSummaryRow = document.createElement('tr');
            weekSummaryRow.className = 'week-summary-row';
            weekSummaryRow.dataset.weekIndex = weekIndex;
            weekSummaryRow.innerHTML = `
                <td colspan="2">
                    <span class="expand-arrow">▶</span> Settimana: ${new Date(settimana.data_inizio).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' })} - ${new Date(settimana.data_fine).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' })}
                </td>
                <td>Tot. Prot: ${settimana.totaleProteine.toFixed(0)} g</td>
                <td>Tot. Kcal: ${settimana.totaleCalorieConsumate.toFixed(0)}</td>
                <td>Var. Kcal: ${settimana.totaleBilancioCalorico > 0 ? '+' : ''}${settimana.totaleBilancioCalorico.toFixed(0)}</td>
                <td class="weekly-fat-change">${settimana.totaleGrassoG > 0 ? '+' : ''}${settimana.totaleGrassoG.toFixed(1)} g</td>
                <td class="weekly-muscle-trend">${trendMuscoloSettimanaleHtml}</td>
                <td class="weekly-weight-change">${testoVariazionePesoSettimanale}</td>
            `;
            storicoBody.appendChild(weekSummaryRow);

            const weekDetailRow = document.createElement('tr');
            weekDetailRow.className = 'week-detail-row';
            const weekDetailCell = document.createElement('td');
            weekDetailCell.colSpan = 8; // Esteso per coprire tutte le colonne
            weekDetailCell.className = 'week-detail-cell';
            
            // Tabella interna per i giorni della settimana
            let innerTableHtml = `
                <table class="week-detail-inner-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Proteine</th>
                            <th>Calorie</th>
                            <th>Workout</th>
                            <th>Bilancio Kcal</th>
                            <th>Grasso (g)</th>
                            <th>Massa Musc.</th>
                            <th>Peso (kg)</th> </tr>
                    </thead>
                    <tbody>
            `;

            settimana.giorni.forEach(giorno => {
                // Questo è il rendering del singolo giorno all'interno della settimana espansa
                // Ricrea le stesse logiche di formattazione del giorno singolo che avevi prima

                const dataDelGiorno = new Date(giorno.data);
                const giornoSettimana = dataDelGiorno.getDay();
                const pianoDelGiorno = PIANO_SETTIMANALE[giornoSettimana] || PIANO_SETTIMANALE[1];

                const workoutCalories = giorno.workoutCalorie || 0;
                const calorieAdjustment = giorno.calorieAdjustment || 0;
                
                // Si assume che 'giorno.bilancioCalorico', 'giorno.variazioneGrassoG', 'giorno.scoreMuscolo'
                // siano ora salvati e disponibili nell'oggetto 'giorno'
                const deficitArrotondato = giorno.bilancioCalorico || 0;
                const variazioneGrasso = giorno.variazioneGrassoG || 0;
                const scoreMuscolo = giorno.scoreMuscolo || 0;

                // Formattazione per la variazione di grasso
                let testoVariazioneGrasso = '';
                if (variazioneGrasso < 0) {
                    testoVariazioneGrasso = `${variazioneGrasso.toFixed(1)} g`; // Es: -10.5 g
                } else if (variazioneGrasso > 0) {
                    testoVariazioneGrasso = `+${variazioneGrasso.toFixed(1)} g`; // Es: +5.2 g
                } else {
                    testoVariazioneGrasso = `0.0 g`;
                }

                // Formattazione per il bilancio calorico
                let deficitSurplusText = '';
                if (deficitArrotondato < 0) {
                    deficitSurplusText = `${deficitArrotondato} kcal`; 
                } else if (deficitArrotondato > 0) {
                    deficitSurplusText = `+${deficitArrotondato} kcal`; 
                } else {
                    deficitSurplusText = `0 kcal`;
                }

                // Formattazione per il trend muscolare
                let trendMuscoloHtml = '<span class="trend-neutral">―</span>';
                if(scoreMuscolo > 0) {
                    trendMuscoloHtml = '<span class="trend-up">▲</span>';
                } else if (scoreMuscolo < 0) {
                    trendMuscoloHtml = '<span class="trend-down">▼</span>';
                }

                innerTableHtml += `
                    <tr class="day-summary-row">
                        <td>${dataDelGiorno.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' })}</td>
                        <td>${(giorno.proteine || 0).toFixed(1)} g</td>
                        <td>${(giorno.calorie || 0).toFixed(0)}</td>
                        <td>${workoutCalories} kcal</td>
                        <td>${deficitSurplusText}</td>
                        <td>${testoVariazioneGrasso}</td>
                        <td>${trendMuscoloHtml}</td>
                        <td>${(giorno.peso || 0).toFixed(2)} kg</td> </tr>
                `;
            });

            innerTableHtml += `</tbody></table>`;
            weekDetailCell.innerHTML = innerTableHtml;
            weekDetailRow.appendChild(weekDetailCell);
            storicoBody.appendChild(weekDetailRow);
        });
    }

    // Event listener per espandere/collassare i dettagli del giorno E delle settimane
    storicoBody.addEventListener('click', (e) => {
        // Gestione espansione/collasso settimanale
        const weekSummaryRow = e.target.closest('.week-summary-row');
        if (weekSummaryRow) {
            weekSummaryRow.classList.toggle('expanded');
            const weekDetail = weekSummaryRow.nextElementSibling;
            if (weekDetail && weekDetail.classList.contains('week-detail-row')) {
                weekDetail.classList.toggle('expanded');
            }
            return; // Esci per non triggerare la logica giornaliera
        }

        // Gestione espansione/collasso giornaliera (all'interno della settimana espansa)
        // Nota: questa logica è stata mantenuta ma non è più strettamente necessaria se mostriamo tutti i dettagli del giorno.
        // Se vuoi dettagli specifici per il giorno all'interno della settimana (tipo pasti espandibili),
        // allora dovrai implementare la logica di espansione per le righe .day-summary-row ALL'INTERNO della .week-detail-inner-table.
        // Al momento, ho semplificato per mostrare direttamente i dettagli del giorno.
        // Potresti voler rimuovere completamente il click listener per .day-summary-row se i dettagli sono sempre visibili.
        
        // La logica per i pasti espandibili all'interno di un giorno (se mai la reintrodurrai)
        const mealRow = e.target.closest('.meal-group-row');
        if (mealRow) {
            mealRow.classList.toggle('expanded');
            let sibling = mealRow.nextElementSibling;
            while(sibling && sibling.classList.contains('sub-item-row')) {
                sibling.style.display = mealRow.classList.contains('expanded') ? 'table-row' : 'none';
                sibling = sibling.nextElementSibling;
            }
        }
    });

    // Inizializza il rendering dello storico al caricamento della pagina
    renderStorico();
});
</script>
</body>
</html>
