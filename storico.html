<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storico Dettagliato - Nuovo Layout</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; }
        h1 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; margin-bottom: 20px;}
        .nav-links a { display: inline-block; margin-bottom: 25px; padding: 10px 15px; background-color: #607d8b; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }

        .giorno-storico { background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; overflow: hidden; }
        .giorno-header { padding: 20px 25px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid transparent; transition: background-color 0.2s; }
        .giorno-header:hover { background-color: #f7f9fc; }
        .giorno-header h2 { margin: 0; font-size: 1.2em; color: #333; border: none; }
        .giorno-header .trend-icon { font-size: 1.5em; }
        
        /* Stili per i trend */
        .trend-ok { border-left-color: #4caf50; }
        .trend-attenzione { border-left-color: #ff9800; }
        .trend-pericolo { border-left-color: #f44336; }
        
        .giorno-content { max-height: 0; transition: max-height 0.5s ease-out, padding 0.5s ease-out; padding: 0 25px; }
        .giorno-content.expanded { max-height: 2000px; /* Valore alto per contenere tutto */ padding: 20px 25px; border-top: 1px solid #e0e0e0;}

        .riepilogo-giorno { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .riepilogo-giorno p { margin: 0; font-size: 1em; background-color: #fafafa; padding: 10px; border-radius: 6px; }
        .riepilogo-giorno span { font-weight: 600; color: #1976d2; }

        table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f2f2f2; }
        
        .meal-group-row { background-color: #f5f5f5; font-weight: bold; cursor: pointer; }
        .expand-arrow { display: inline-block; width: 20px; text-align: center; transition: transform 0.2s; }
        .meal-group-row.expanded .expand-arrow { transform: rotate(90deg); }
        .sub-item-row { display: none; }
        .meal-group-row.expanded + .sub-item-row { display: table-row; }
        .sub-item-row > td { padding-left: 30px !important; background-color: #fff; font-style: italic; color: #555; border-bottom: 1px dotted #ccc;}
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Storico Giornaliero</h1>
        <div class="nav-links">
            <a href="index.html">⬅️ Torna al Tracker</a>
        </div>
        <div id="storico-container">
            <p>Nessun dato storico trovato.</p>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const storicoContainer = document.getElementById('storico-container');
    const storico = JSON.parse(localStorage.getItem('trackerStorico')) || [];

    if (storico.length === 0) {
        storicoContainer.innerHTML = '<p>Nessun dato storico trovato.</p>';
        return;
    }

    storicoContainer.innerHTML = '';
    storico.sort((a, b) => new Date(b.data) - new Date(a.data));

    storico.forEach((giorno, giornoIndex) => {
        const giornoDiv = document.createElement('div');
        giornoDiv.className = 'giorno-storico';

        const dataFormatted = new Date(giorno.data).toLocaleDateString('it-IT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        
        // Header del Giorno
        const headerDiv = document.createElement('div');
        headerDiv.className = `giorno-header trend-${giorno.trend || 'ok'}`;
        headerDiv.dataset.index = giornoIndex;
        
        let trendIcon = '🔥';
        if (giorno.trend === 'pericolo' || giorno.trend === 'attenzione') trendIcon = '⚠️';
        if (new Date(giorno.data).getDay() === 0 || new Date(giorno.data).getDay() === 6) trendIcon = '💧';

        headerDiv.innerHTML = `
            <h2>${dataFormatted}</h2>
            <span class="trend-icon">${trendIcon}</span>
        `;
        giornoDiv.appendChild(headerDiv);

        // Contenuto espandibile del Giorno
        const contentDiv = document.createElement('div');
        contentDiv.className = 'giorno-content';
        
        let contentHtml = `
            <div class="riepilogo-giorno">
                <p>Calorie: <span>${giorno.totali.calorie.toFixed(0)} kcal</span></p>
                <p>Proteine: <span>${giorno.totali.proteine.toFixed(1)} g</span></p>
                <p>Workout: <span>${(giorno.totali.workoutCalorie || 0)} kcal</span></p>
                <p>Deficit: <span>${giorno.deficit} kcal</span></p>
            </div>
            <table>
                <thead>
                    <tr><th>Descrizione</th><th>Quantità</th><th>Proteine</th><th>Kcal</th></tr>
                </thead>
                <tbody>`;

        if (giorno.log && giorno.log.length > 0) {
            giorno.log.forEach((entry, pastoIndex) => {
                if (entry.type === 'meal') {
                    contentHtml += `
                        <tr class="meal-group-row" data-giorno="${giornoIndex}" data-pasto="${pastoIndex}">
                            <td><span class="expand-arrow">▶</span> ${entry.desc}</td>
                            <td>${entry.items.reduce((s, i) => s + i.qta, 0)} g</td>
                            <td>${entry.prot.toFixed(1)} g</td>
                            <td>${entry.cal.toFixed(0)}</td>
                        </tr>`;
                    entry.items.forEach(item => {
                        contentHtml += `
                            <tr class="sub-item-row">
                                <td style="padding-left: 40px;">${item.desc}</td>
                                <td>${item.qta} g</td>
                                <td>${item.prot.toFixed(1)} g</td>
                                <td>${item.cal.toFixed(0)}</td>
                            </tr>`;
                    });
                } else {
                    contentHtml += `
                        <tr>
                            <td>${entry.desc}</td>
                            <td>${entry.qta} g</td>
                            <td>${entry.prot.toFixed(1)} g</td>
                            <td>${entry.cal.toFixed(0)}</td>
                        </tr>`;
                }
            });
        } else {
            contentHtml += `<tr><td colspan="4">Nessun dato alimentare registrato.</td></tr>`;
        }
        contentHtml += `</tbody></table>`;
        contentDiv.innerHTML = contentHtml;
        giornoDiv.appendChild(contentDiv);
        storicoContainer.appendChild(giornoDiv);
    });

    storicoContainer.addEventListener('click', (e) => {
        // Espandi/Comprimi Giorno
        const header = e.target.closest('.giorno-header');
        if (header) {
            header.nextElementSibling.classList.toggle('expanded');
            return;
        }

        // Espandi/Comprimi Pasto
        const mealRow = e.target.closest('.meal-group-row');
        if (mealRow) {
            mealRow.classList.toggle('expanded');
            let sibling = mealRow.nextElementSibling;
            while(sibling && sibling.classList.contains('sub-item-row')) {
                sibling.style.display = mealRow.classList.contains('expanded') ? 'table-row' : 'none';
                sibling = sibling.nextElementSibling;
            }
        }
    });
});
</script>
</body>
</html>
