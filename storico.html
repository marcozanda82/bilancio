<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storico Dettagliato - Tabella Trend</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 950px; }
        h1 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; margin-bottom: 20px;}
        .nav-links a { display: inline-block; margin-bottom: 25px; padding: 10px 15px; background-color: #607d8b; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }

        .storico-table { width: 100%; border-collapse: collapse; background-color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden;}
        th, td { padding: 12px 15px; text-align: left; vertical-align: middle; }
        th { background-color: #e8eaf6; font-weight: 600; color: #3f51b5; }
        .day-summary-row { border-bottom: 2px solid #e0e0e0; cursor: pointer; transition: background-color 0.2s; }
        .day-summary-row:hover { background-color: #f9f9fc; }
        .day-summary-row.expanded { background-color: #f1f3f9; }
        
        .day-detail-row { display: none; }
        .day-detail-row.expanded { display: table-row; }
        .detail-cell { padding: 20px !important; background-color: #fafafa; }
        .detail-cell h4 { margin-top: 0; }
        .detail-cell table { width: 100%; box-shadow: none; border-radius: 0; font-size: 0.9em; }
        
        .expand-arrow { display: inline-block; transition: transform 0.2s; font-size: 0.8em; }
        .day-summary-row.expanded .expand-arrow { transform: rotate(90deg); }

        .meal-group-row { background-color: #f5f5f5; font-weight: bold; cursor: pointer; }
        .meal-expand-arrow { display: inline-block; width: 20px; transition: transform 0.2s; }
        .meal-group-row.expanded .meal-expand-arrow { transform: rotate(90deg); }
        .sub-item-row { display: none; }
        /* Modificato per mostrare solo i sub-item successivi al pasto espanso */
        .meal-group-row.expanded + .sub-item-row { display: table-row; } 
        /* Regola per mostrare tutti i sub-item di un pasto espanso */
        .meal-group-row.expanded ~ .sub-item-row.meal-active { display: table-row; }

        .trend-muscle { font-size: 1.5em; font-weight: bold; }
        .trend-up { color: #4caf50; }
        .trend-down { color: #f44336; }
        .trend-neutral { color: #9e9e9e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Storico e Trend Giornalieri</h1>
        <div class="nav-links">
            <a href="index.html">⬅️ Torna al Tracker</a>
        </div>
        <div class="storico-table-container">
            <table class="storico-table">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Proteine</th>
                        <th>Calorie</th>
                        <th>Workout</th>
                        <th>Deficit</th>
                        <th>Grasso (g)</th>
                        <th>Massa Musc.</th>
                    </tr>
                </thead>
                <tbody id="storico-body"></tbody>
            </table>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const storicoBody = document.getElementById('storico-body');

    // Funzione per recuperare tutti i dati dallo storico LocalStorage
    function caricaTuttoLoStorico() {
        const storicoDati = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            // Filtra le chiavi che iniziano con 'trackerStorico_' o 'trackerGiornoCorrente'
            if (key.startsWith('trackerStorico_')) {
                try {
                    const dataString = key.replace('trackerStorico_', '');
                    const datiGiorno = JSON.parse(localStorage.getItem(key));
                    storicoDati.push({ data: dataString, ...datiGiorno });
                } catch (e) {
                    console.error("Errore nel parsing dei dati storici per la chiave:", key, e);
                }
            } else if (key === 'trackerGiornoCorrente') {
                try {
                    const salvataggioCorrente = JSON.parse(localStorage.getItem(key));
                    // Assicurati che non sia già stato salvato come trackerStorico_
                    // o che non sia una data duplicata se già presente
                    if (salvataggioCorrente && salvataggioCorrente.data) {
                        const isDuplicate = storicoDati.some(item => item.data === salvataggioCorrente.data);
                        if (!isDuplicate) {
                           storicoDati.push({ data: salvataggioCorrente.data, ...salvataggioCorrente.dati });
                        }
                    }
                } catch (e) {
                    console.error("Errore nel parsing del giorno corrente:", key, e);
                }
            }
        }
        // Ordina i dati dal più recente al più vecchio
        storicoDati.sort((a, b) => new Date(b.data) - new Date(a.data));
        return storicoDati;
    }

    // Costanti per il piano settimanale (copiate da index.html per coerenza)
    const PIANO_SETTIMANALE = {
        0: { tipo: '💧 Riposo (Deficit)', cal: 1700, prot: 110 }, // Domenica
        1: { tipo: '🔥 Forza (Mantenimento)', cal: 2400, prot: 140 }, // Lunedì
        2: { tipo: '💪 Forza (Mantenimento)', cal: 2400, prot: 140 }, // Martedì
        3: { tipo: '🏃 Hiit (Deficit)', cal: 1900, prot: 120 }, // Mercoledì
        4: { tipo: '🏋️ Forza (Mantenimento)', cal: 2400, prot: 140 }, // Giovedì
        5: { tipo: '🏃 Forza (Mantenimento)', cal: 2400, prot: 140 }, // Venerdì
        6: { tipo: '🥗 Mantenimento (Deficit)', cal: 1700, prot: 110 }  // Sabato
    };

    function renderStorico() {
        const storico = caricaTuttoLoStorico();

        if (storico.length === 0) {
            storicoBody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px;">Nessun dato storico trovato.</td></tr>';
            return;
        }

        storicoBody.innerHTML = ''; // Pulisci la tabella prima di ripopolarla

        storico.forEach((giorno, giornoIndex) => {
            // Calcola i totali per il giorno se non già presenti (retrocompatibilità)
            let totaliGiorno = { proteine: 0, calorie: 0, mg: 0, k: 0, vitc: 0, ca: 0, workoutCalorie: giorno.workoutCalorie || 0 };
            (giorno.log || []).forEach(entry => {
                if (entry.type === 'meal' && entry.items) {
                    entry.items.forEach(item => {
                        totaliGiorno.proteine += item.prot || 0;
                        totaliGiorno.calorie += item.cal || 0;
                    });
                } else {
                    totaliGiorno.proteine += entry.prot || 0;
                    totaliGiorno.calorie += entry.cal || 0;
                }
            });

            // Recupera gli obiettivi dal PIANO_SETTIMANALE
            const dataDelGiorno = new Date(giorno.data);
            const giornoSettimana = dataDelGiorno.getDay(); // 0 = Domenica, 6 = Sabato
            const pianoDelGiorno = PIANO_SETTIMANALE[giornoSettimana] || PIANO_SETTIMANALE[1]; // Fallback al Lunedì se non trovato
            
            // Assicurati che obiettiviCalorici sia un numero intero
            const obiettiviCalorici = Math.round(pianoDelGiorno.cal); // Arrotonda l'obiettivo dal piano

            // Calcolo del deficit
            const deficit = totaliGiorno.calorie - obiettiviCalorici;
            const deficitArrotondato = Math.round(deficit); // Arrotonda all'intero più vicino
            
            // Nuovo calcolo della variazione di grasso
            let variazioneGrasso = 0; // In grammi
            let testoVariazioneGrasso = '';

            // 7700 kcal per 1kg (1000g) di grasso, quindi 1g di grasso = 7.7 kcal
            if (deficitArrotondato < 0) { // Se sei in deficit (valore negativo), stai perdendo grasso
                variazioneGrasso = (Math.abs(deficitArrotondato) / 7.7); // Variazione positiva per la quantità di grasso persa
                testoVariazioneGrasso = '-' + variazioneGrasso.toFixed(1) + ' g';
            } else if (deficitArrotondato > 0) { // Se sei in surplus (valore positivo), stai guadagnando grasso
                variazioneGrasso = (deficitArrotondato / 7.7); // Variazione positiva per la quantità di grasso guadagnata
                testoVariazioneGrasso = '+' + variazioneGrasso.toFixed(1) + ' g';
            } else { // DeficitArrotondato è 0
                testoVariazioneGrasso = '0.0 g';
            }
            
            // Logica per il trend muscolare (come già presente)
            let trendMuscoloHtml = '<span class="trend-neutral trend-muscle">―</span>';
            let scoreMuscolo = 0;
            if(totaliGiorno.proteine >= (pianoDelGiorno.prot * 0.95)) scoreMuscolo++;
            else scoreMuscolo--;
            if(pianoDelGiorno.tipo.includes('Forza')) scoreMuscolo++;
            if(deficitArrotondato > 500 && pianoDelGiorno.tipo.includes('Forza')) scoreMuscolo--;
            
            if(scoreMuscolo > 0) trendMuscoloHtml = '<span class="trend-up trend-muscle">▲</span>';
            if(scoreMuscolo < 0) trendMuscoloHtml = '<span class="trend-down trend-muscle">▼</span>';

            const summaryRow = document.createElement('tr');
            summaryRow.className = 'day-summary-row';
            summaryRow.dataset.giornoIndex = giornoIndex;
            const dataFormatted = dataDelGiorno.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
            
            summaryRow.innerHTML = `
                <td><span class="expand-arrow">▶</span> ${dataFormatted}</td>
                <td>${totaliGiorno.proteine.toFixed(1)} g</td>
                <td>${totaliGiorno.calorie.toFixed(0)}</td>
                <td>${totaliGiorno.workoutCalorie} kcal</td>
                <td>${deficitArrotondato} kcal</td>
                <td>${testoVariazioneGrasso}</td> <td>${trendMuscoloHtml}</td>
            `;
            storicoBody.appendChild(summaryRow);

            const detailRow = document.createElement('tr');
            detailRow.className = 'day-detail-row';
            const detailCell = document.createElement('td');
            detailCell.colSpan = 7;
            detailCell.className = 'detail-cell';
            
            let detailHtml = `<h4>Dettaglio Pasti e Alimenti</h4>`;

            if ((giorno.log || []).length > 0) {
                detailHtml += `<table><tbody>`;

                giorno.log.forEach((entry, pastoIndex) => {
                    if (entry.type === 'meal') {
                        // Calcola i totali specifici per il pasto raggruppato
                        const totaliPastoCorrente = (entry.items || []).reduce((acc, item) => {
                            acc.prot += item.prot || 0;
                            acc.cal += item.cal || 0;
                            return acc;
                        }, { prot: 0, cal: 0 });

                        detailHtml += `
                            <tr class="meal-group-row" data-giorno-index="${giornoIndex}" data-pasto-index="${pastoIndex}">
                                <td colspan="4"><span class="meal-expand-arrow">▶</span> <strong>${entry.desc}</strong> (Tot: ${totaliPastoCorrente.prot.toFixed(1)}g Prot, ${totaliPastoCorrente.cal.toFixed(0)} Kcal)</td>
                            </tr>`;
                        (entry.items || []).forEach(item => {
                            detailHtml += `<tr class="sub-item-row meal-active" style="display: none;">
                                            <td style="padding-left: 40px;">${item.desc}</td>
                                            <td>${item.qta} g</td>
                                            <td>${(item.prot || 0).toFixed(1)} g</td>
                                            <td>${(item.cal || 0).toFixed(0)} Kcal</td>
                                          </tr>`;
                        });
                    } else { // Alimento singolo
                        detailHtml += `<tr><td>${entry.desc}</td><td>${entry.qta} g</td><td>${(entry.prot || 0).toFixed(1)} g</td><td>${(entry.cal || 0).toFixed(0)} Kcal</td></tr>`;
                    }
                });
                detailHtml += `</tbody></table>`;
            } else {
                detailHtml += '<p>Nessun dettaglio alimentare disponibile per questo giorno.</p>';
            }

            detailCell.innerHTML = detailHtml;
            detailRow.appendChild(detailCell);
            storicoBody.appendChild(detailRow);
        });
    }

    // Event listener per espandere/collassare i dettagli del giorno e dei pasti
    storicoBody.addEventListener('click', (e) => {
        const summaryRow = e.target.closest('.day-summary-row');
        if (summaryRow) {
            summaryRow.classList.toggle('expanded');
            summaryRow.nextElementSibling.classList.toggle('expanded');
            return;
        }

        const mealRow = e.target.closest('.meal-group-row');
        if (mealRow) {
            mealRow.classList.toggle('expanded');
            let sibling = mealRow.nextElementSibling;
            while(sibling && sibling.classList.contains('sub-item-row')) {
                sibling.style.display = mealRow.classList.contains('expanded') ? 'table-row' : 'none';
                sibling = sibling.nextElementSibling;
            }
        }
    });

    // Inizializza il rendering dello storico al caricamento della pagina
    renderStorico();
});
</script>
</body>
</html>
