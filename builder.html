<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costruttore Pasti AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        /* Copia qui gli stili CSS rilevanti dal tuo file index.html */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; }
        h2 { font-size: 1.4em; margin-top: 30px; }
        .nav-links { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-links a { flex-grow: 1; text-align: center; padding: 10px; background-color: #607d8b; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
        .sezione { margin-bottom: 25px; padding: 20px; background-color: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; border-left-width: 5px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="text"], input[type="number"], input[type="date"], select {
            width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em;
        }
        button { background-color: #1976d2; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: 600; transition: background-color 0.3s; }
        button:hover { background-color: #1565c0; }
        .builder-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
        .button-group { display: flex; gap: 10px; margin-top: 15px; }
        #btn-costruisci-pasto { background-color: #ff8f00; }
        #btn-aggiungi-singolo { background-color: #5c6bc0; }
        #meal-builder-sezione[data-visible="false"] { display: none; }
        #meal-builder-sezione[data-visible="true"] { display: block; }
        #meal-builder-sezione { border-left-color: #ff8f00; }
        #btn-salva-pasto { background-color: #2e7d32; width: 100%; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.8em; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; vertical-align: middle; }
        th { background-color: #f2f2f2; font-weight: 600; }
        .action-buttons { display: flex; justify-content: center; align-items: center; gap: 8px; }
        .action-buttons button { background: none; border: none; padding: 4px; font-size: 1.3em; line-height: 1; cursor: pointer; }
        .delete-btn { color: #d32f2f; }
        
        /* Stili per il riepilogo del costruttore pasti (copia da index.html) */
        #meal-builder-summary {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #e3f2fd;
            border: 1px solid #90caf9;
            border-radius: 8px;
        }
        #meal-builder-summary p {
            margin: 5px 0;
            font-weight: 600;
            color: #1e88e5;
        }
        #meal-builder-summary .progress-container {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        #meal-builder-summary .progress-item {
            flex: 1;
        }
        #meal-builder-summary .progress-item p {
            font-size: 0.9em;
            margin-bottom: 5px;
            color: #3f51b5;
        }
        #meal-builder-summary .progress-item progress {
            height: 18px;
            border-radius: 4px;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Costruttore Pasti AI</h1>
        <div class="nav-links">
            <a href="index.html">⬅️ Torna al Tracker</a>
        </div>
        
        <div id="food-adder" class="sezione">
            <h2>Aggiungi Alimento</h2>
            <div class="builder-grid">
                <div><label>Alimento</label><input type="text" id="builder-desc"></div>
                <div><label>Quantità (g)</label><input type="number" id="builder-qta" min="0"></div>
                <div><label>Proteine/100g</label><input type="number" id="builder-prot" step="0.1"></div>
                <div><label>Kcal/100g</label><input type="number" id="builder-kcal" min="0"></div>
            </div>
            <div class="builder-grid" style="margin-top: 10px;">
                <div><label>Grassi/100g</label><input type="number" id="builder-fat" min="0"></div>
                <div><label>Fibre/100g</label><input type="number" id="builder-fiber" min="0"></div>
                <div><label>Magnesio (mg)/100g</label><input type="number" id="builder-mg" min="0"></div>
                <div><label>Potassio (mg)/100g</label><input type="number" id="builder-k" min="0"></div>
                <div><label>Vit. C (mg)/100g</label><input type="number" id="builder-vitc" min="0"></div>
                <div><label>Calcio (mg)/100g</label><input type="number" id="builder-ca" min="0"></div>
            </div>
            <p style="font-size: 0.9em; color: #555; margin-top: 15px;">
                Scrivi il nome dell'alimento e la quantità, poi clicca su "Compila AI" per ottenere i valori nutrizionali.
            </p>
            <div class="button-group">
                <button id="btn-compila-ai" style="background-color: #0d47a1;">Compila AI</button>
                <button id="btn-costruisci-pasto">Aggiungi a Pasto</button>
                <button id="btn-aggiungi-singolo">Aggiungi al Diario</button>
            </div>
        </div>

        <div id="meal-builder-sezione" class="sezione" data-visible="false">
            <h2>Pasto in Costruzione</h2>
            <div id="meal-builder-summary">
                <p>Pasto Selezionato: <span id="current-meal-type-display"></span></p>
                <div class="progress-container">
                    <div class="progress-item">
                        <p>Proteine: <span id="meal-prot-current">0</span> / <span id="meal-prot-target"></span> g (<span id="meal-prot-remaining"></span>)</p>
                        <progress id="meal-progress-prot" value="0"></progress>
                    </div>
                    <div class="progress-item">
                        <p>Calorie: <span id="meal-cal-current">0</span> / <span id="meal-cal-target"></span> kcal (<span id="meal-cal-remaining"></span>)</p>
                        <progress id="meal-progress-cal" value="0"></progress>
                    </div>
                </div>
            </div>
            <select id="meal-type-selector">
                <option value="merenda1">Merenda AM</option>
                <option value="pranzo">Pranzo</option>
                <option value="merenda2">Merenda PM</option>
                <option value="cena">Cena</option>
            </select>
            <table id="log-pasto-builder">
                <thead><tr><th>Descrizione</th><th>(g)</th><th>Prot</th><th>Kcal</th><th>Azione</th></tr></thead>
                <tbody id="log-pasto-builder-body"></tbody>
            </table>
            <button id="btn-salva-pasto">Salva Pasto nel Diario</button>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

        // ************************************************************
        // INSERISCI QUI I TUOI PARAMETRI DI CONFIGURAZIONE FIREBASE
        // ************************************************************
        const firebaseConfig = {
            apiKey: "AIzaSyA5pSzpfq1aGZ1wjNV5-eXnIqWL6brl424",
            authDomain: "mio-tracker.firebaseapp.com",
            databaseURL: "https://mio-tracker-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "mio-tracker",
            storageBucket: "mio-tracker.firebasestorage.app",
            messagingSenderId: "382993217593",
            appId: "1:382993217593:web:f0780aa061c23f9503f5e8"
        };
        // ************************************************************
        // FINE CONFIGURAZIONE FIREBASE
        // ************************************************************

        // ************************************************************
        // CONFIGURAZIONE API GEMINI
        // INSERISCI LA TUA CHIAVE API QUI
        // ************************************************************
        const API_KEY_AI = "AIzaSyA5pSzpfq1aGZ1wjNV5-eXnIqWL6brl424"; // Sostituisci questo placeholder

        // --- ELEMENTI DEL DOM ---
        const builderDesc = document.getElementById('builder-desc'), builderQta = document.getElementById('builder-qta');
        const builderProt = document.getElementById('builder-prot'), builderKcal = document.getElementById('builder-kcal');
        const builderFat = document.getElementById('builder-fat'), builderFiber = document.getElementById('builder-fiber');
        const builderMg = document.getElementById('builder-mg'), builderK = document.getElementById('builder-k'), builderVitC = document.getElementById('builder-vitc'), builderCa = document.getElementById('builder-ca');
        const btnCompilaAI = document.getElementById('btn-compila-ai');
        const btnAggiungiSingolo = document.getElementById('btn-aggiungi-singolo'), btnCostruisciPasto = document.getElementById('btn-costruisci-pasto');
        const mealBuilderSezione = document.getElementById('meal-builder-sezione'), logPastoBuilderBody = document.getElementById('log-pasto-builder-body');
        const btnSalvaPasto = document.getElementById('btn-salva-pasto');
        const mealTypeSelector = document.getElementById('meal-type-selector');
        const currentMealTypeDisplay = document.getElementById('current-meal-type-display');
        const mealProtCurrent = document.getElementById('meal-prot-current'), mealProtTarget = document.getElementById('meal-prot-target'), mealProtRemaining = document.getElementById('meal-prot-remaining');
        const mealCalCurrent = document.getElementById('meal-cal-current'), mealCalTarget = document.getElementById('meal-cal-target'), mealCalRemaining = document.getElementById('meal-cal-remaining');
        const mealProgressProt = document.getElementById('meal-progress-prot'), mealProgressCal = document.getElementById('meal-progress-cal');

        // --- STATO E COSTANTI ---
        let pastoInCostruzione = [];
        let db;
        let auth;
        let firebaseApp;
        let currentUserUID = null;
        let giornoVisualizzato = getTodayString('ymd');

        const PIANO_SETTIMANALE = {
            0: { tipo: '💧 Riposo (Deficit)', cal_base: 2300, prot: 140 },
            1: { tipo: '🔥 Forza (Mantenimento)', cal_base: 2300, prot: 140 },
            2: { tipo: '💪 Forza (Mantenimento)', cal_base: 2300, prot: 140 },
            3: { tipo: '🏃 Cardio (Deficit)', cal_base: 2300, prot: 140 },
            4: { tipo: '🏋️ Forza (Mantenimento)', cal_base: 2300, prot: 140 },
            5: { tipo: '🏃 Cardio (Deficit)', cal_base: 2300, prot: 140 },
            6: { tipo: '🥗 Mantenimento (Free)', cal_base: 2300, prot: 140 }
        };

        const OBIETTIVI_MACRO_PASTO_BASE_FORZA = {
            merenda1: { prot: 30, cal_perc: 0.20 },
            pranzo: { prot: 40, cal_perc: 0.35 },
            merenda2: { prot: 30, cal_perc: 0.15 },
            cena: { prot: 40, cal_perc: 0.30 }
        };

        const MEAL_TYPE_SEQUENCE = ['merenda1', 'pranzo', 'merenda2', 'cena'];

        // Funzione di utilità per la data
        function getTodayString(format = 'ymd') { return new Date().toISOString().split('T')[0]; }

        // Funzione per salvare il pasto in costruzione nel localStorage
        function salvaPastoInCostruzione() {
            localStorage.setItem('trackerPastoInCostruzione', JSON.stringify(pastoInCostruzione));
        }

        // Funzione per salvare i dati di un giorno nel localStorage
        function salvaGiorno(dataDaSalvare, datiDaSalvare) {
            localStorage.setItem(`trackerStorico_${dataDaSalvare}`, JSON.stringify(datiDaSalvare));
        }

        // Funzione per caricare i dati di un giorno
        function caricaGiorno(data) {
            const rawData = localStorage.getItem(`trackerStorico_${data}`);
            return rawData ? JSON.parse(rawData) : null;
        }

        // Funzione per creare un alimento basato sui campi di input
        function creaAlimentoDaInput(isSingle = false) {
            const desc = builderDesc.value.trim();
            const qta = parseFloat(builderQta.value);
            
            if (!desc || isNaN(qta) || qta <= 0) { 
                alert('Inserisci nome e quantità valide.'); 
                return null; 
            }

            const p100 = parseFloat(builderProt.value) || 0;
            const k100 = parseFloat(builderKcal.value) || 0;
            const fat100 = parseFloat(builderFat.value) || 0;
            const fiber100 = parseFloat(builderFiber.value) || 0;
            const mg100 = parseFloat(builderMg.value) || 0;
            const k100_mg = parseFloat(builderK.value) || 0;
            const vitc100 = parseFloat(builderVitC.value) || 0;
            const ca100 = parseFloat(builderCa.value) || 0;

            const foodItem = { 
                desc: desc.charAt(0).toUpperCase() + desc.slice(1), 
                qta, 
                prot: (p100 / 100) * qta, 
                cal: (k100 / 100) * qta, 
                fat: (fat100 / 100) * qta, 
                fiber: (fiber100 / 100) * qta, 
                mg: (mg100 / 100) * qta, 
                k: (k100_mg / 100) * qta, 
                vitc: (vitc100 / 100) * qta, 
                ca: (ca100 / 100) * qta 
            };
            if (isSingle) { foodItem.type = 'single'; } else { foodItem.selezionato = true; }
            return foodItem;
        }

        // Funzione per resettare i campi di input
        function resetInputAlimento() { 
            [builderDesc, builderQta, builderProt, builderKcal, builderFat, builderFiber, builderMg, builderK, builderVitC, builderCa].forEach(el => el.value = ''); 
            builderDesc.focus(); 
        }

        // Funzione per calcolare gli obiettivi del pasto (copiata e adattata da index.html)
        function calcolaObiettiviPasto(mealType, giornoCorrenteString) {
            const datiGiornalieri = caricaGiorno(giornoCorrenteString);
            if (!datiGiornalieri) return null;

            const dataVisualizzata = new Date(giornoCorrenteString);
            const giornoSettimana = dataVisualizzata.getDay();
            const pianoDelGiorno = PIANO_SETTIMANALE[giornoSettimana] || PIANO_SETTIMANALE[1];

            const obiettivoCalTotaleGiornaliero = pianoDelGiorno.cal_base + (datiGiornalieri.workoutCalorie || 0) + (datiGiornalieri.calorieAdjustment || 0);
            const obiettivoProtTotaleGiornaliero = pianoDelGiorno.prot;

            let obiettivoPastoProt = 0;
            let obiettivoPastoCal = 0;

            const calRatio = OBIETTIVI_MACRO_PASTO_BASE_FORZA[mealType] ? OBIETTIVI_MACRO_PASTO_BASE_FORZA[mealType].cal_perc : 0;
            const protRatio = OBIETTIVI_MACRO_PASTO_BASE_FORZA[mealType] ? OBIETTIVI_MACRO_PASTO_BASE_FORZA[mealType].prot_perc : 0;

            if (mealType === 'cena') {
                let consumatoProtAltriPasti = 0;
                let consumatoCalAltriPasti = 0;

                (datiGiornalieri.log || []).forEach(entry => {
                    if (entry.type === 'meal' && entry.mealId && entry.mealId !== 'cena') {
                        entry.items.forEach(item => {
                            consumatoProtAltriPasti += item.prot || 0;
                            consumatoCalAltriPasti += item.cal || 0;
                        });
                    } else if (entry.type === 'single' && entry.mealId !== 'cena') { 
                        consumatoProtAltriPasti += entry.prot || 0;
                        consumatoCalAltriPasti += entry.cal || 0;
                    }
                });

                obiettivoPastoProt = Math.round(obiettivoProtTotaleGiornaliero - consumatoProtAltriPasti);
                obiettivoPastoCal = Math.round(obiettivoCalTotaleGiornaliero - consumatoCalAltriPasti);

                if (obiettivoPastoProt < 0) obiettivoPastoProt = 0;
                if (obiettivoPastoCal < 0) obiettivoPastoCal = 0;

            } else {
                obiettivoPastoProt = Math.round(obiettivoProtTotaleGiornaliero * protRatio);
                obiettivoPastoCal = Math.round(obiettivoCalTotaleGiornaliero * calRatio);
            }
            
            const totaliPastoInCostruzione = pastoInCostruzione.reduce((acc, item) => {
                acc.prot += item.prot || 0;
                acc.cal += item.cal || 0;
                return acc;
            }, { prot: 0, cal: 0 });

            return {
                currentProt: totaliPastoInCostruzione.prot,
                targetProt: obiettivoPastoProt,
                remainingProt: obiettivoPastoProt - totaliPastoInCostruzione.prot,
                
                currentCal: totaliPastoInCostruzione.cal,
                targetCal: obiettivoPastoCal,
                remainingCal: obiettivoPastoCal - totaliPastoInCostruzione.cal
            };
        }

        // Funzione per renderizzare l'interfaccia del builder
        function renderMealBuilder() {
            mealBuilderSezione.dataset.visible = pastoInCostruzione.length > 0;
            logPastoBuilderBody.innerHTML = '';
            
            const selectedMealType = mealTypeSelector.value;
            const selectedMealTypeText = mealTypeSelector.options[mealTypeSelector.selectedIndex].text;
            const obiettiviPasto = calcolaObiettiviPasto(selectedMealType, giornoVisualizzato);

            if (obiettiviPasto) {
                currentMealTypeDisplay.textContent = selectedMealTypeText;
                
                mealProtCurrent.textContent = obiettiviPasto.currentProt.toFixed(1);
                mealProtTarget.textContent = obiettiviPasto.targetProt.toFixed(0);
                mealProtRemaining.textContent = `${(obiettiviPasto.remainingProt).toFixed(1)} g`;
                mealProgressProt.max = obiettiviPasto.targetProt;
                mealProgressProt.value = obiettiviPasto.currentProt;

                mealCalCurrent.textContent = obiettiviPasto.currentCal.toFixed(0);
                mealCalTarget.textContent = obiettiviPasto.targetCal.toFixed(0);
                mealCalRemaining.textContent = `${(obiettiviPasto.remainingCal).toFixed(0)} kcal`;
                mealProgressCal.max = obiettiviPasto.targetCal;
                mealProgressCal.value = obiettiviPasto.currentCal;
            }

            pastoInCostruzione.forEach((item, index) => { 
                const riga = logPastoBuilderBody.insertRow(); 
                riga.innerHTML = `<td>${item.desc}</td><td>${item.qta}g</td><td>${item.prot.toFixed(1)}</td><td>${item.cal.toFixed(0)}</td><td class="action-buttons"><button class="delete-btn" data-type="builder" data-index="${index}">&times;</button></td>`; 
            });
        }

        // --- FUNZIONI DI INTEGRAZIONE CON L'IA ---

        async function fetchNutrientData(foodName) {
            const geminiEndpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY_AI}`;

            const prompt = `Fornisci i valori nutrizionali per 100g di "${foodName}" in formato JSON. Includi i seguenti campi: "proteine", "calorie", "grassi", "fibre", "magnesio", "potassio", "vitaminaC" e "calcio". Restituisci SOLO l'oggetto JSON, senza testo aggiuntivo o formattazione markdown. Esempio di formato: {"proteine": 20, "calorie": 165, "grassi": 3.5, "fibre": 0.1, "magnesio": 27, "potassio": 256, "vitaminaC": 0, "calcio": 11}.`;

            try {
                const response = await fetch(geminiEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        "contents": [{
                            "parts": [{ "text": prompt }]
                        }]
                    })
                });

                if (!response.ok) {
                    throw new Error(`Errore di rete: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                const jsonText = data.candidates[0].content.parts[0].text;
                
                // Pulisce e analizza la stringa JSON
                const parsedData = JSON.parse(jsonText.replace(/```json|```/g, '').trim()); 
                return parsedData;

            } catch (error) {
                console.error("Errore durante il recupero dei dati nutrizionali da Gemini:", error);
                alert("Errore durante il recupero dati. Controlla la console per i dettagli.");
                return null;
            }
        }

        // Gestore del pulsante "Compila AI"
        btnCompilaAI.addEventListener('click', async () => {
            const foodName = builderDesc.value.trim();
            if (!foodName) {
                alert("Inserisci il nome dell'alimento per la compilazione AI.");
                return;
            }

            btnCompilaAI.disabled = true;
            btnCompilaAI.textContent = "Caricamento...";

            const nutrientData = await fetchNutrientData(foodName);

            if (nutrientData) {
                builderProt.value = nutrientData.proteine || '';
                builderKcal.value = nutrientData.calorie || '';
                builderFat.value = nutrientData.grassi || '';
                builderFiber.value = nutrientData.fibre || '';
                builderMg.value = nutrientData.magnesio || '';
                builderK.value = nutrientData.potassio || '';
                builderVitC.value = nutrientData.vitaminaC || '';
                builderCa.value = nutrientData.calcio || '';
                alert("Dati nutrizionali compilati dall'AI!");
            } else {
                alert("Nessun dato trovato per questo alimento.");
            }
            
            btnCompilaAI.disabled = false;
            btnCompilaAI.textContent = "Compila AI";
        });

        // --- GESTIONE EVENTI (adattata per builder.html) ---

        btnAggiungiSingolo.addEventListener('click', () => {
            const item = creaAlimentoDaInput(true);
            if (item) {
                const datiGiornalieri = caricaGiorno(giornoVisualizzato) || { log: [], workoutCalorie: 0, calorieAdjustment: 0 };
                datiGiornalieri.log.push(item);
                salvaGiorno(giornoVisualizzato, datiGiornalieri);
                resetInputAlimento();
                alert("Alimento aggiunto al diario giornaliero!");
            }
        });

        btnCostruisciPasto.addEventListener('click', () => {
            const item = creaAlimentoDaInput(false);
            if (item) {
                pastoInCostruzione.push(item);
                salvaPastoInCostruzione();
                renderMealBuilder();
                resetInputAlimento();
                mealBuilderSezione.scrollIntoView({ behavior: 'smooth' });
            }
        });

        mealBuilderSezione.addEventListener('click', (e) => {
            const target = e.target;
            if (target.closest('.delete-btn')) {
                const index = parseInt(target.closest('.delete-btn').dataset.index, 10);
                if (!confirm('Cancellare la voce dal pasto in costruzione?')) return;
                pastoInCostruzione.splice(index, 1);
                salvaPastoInCostruzione();
                renderMealBuilder();
            }
        });

        btnSalvaPasto.addEventListener('click', () => {
            if (pastoInCostruzione.length === 0) {
                alert("Nessun alimento nel pasto da salvare.");
                return;
            }
            
            const mealName = mealTypeSelector.options[mealTypeSelector.selectedIndex].text;
            const mealId = mealTypeSelector.value;
            const totaliPasto = pastoInCostruzione.reduce((acc, item) => {
                acc.prot += item.prot || 0; acc.cal += item.cal || 0; acc.fat += item.fat || 0; acc.fiber += item.fiber || 0;
                acc.mg += item.mg || 0; acc.k += item.k || 0; acc.vitc += item.vitc || 0; acc.ca += item.ca || 0;
                return acc;
            }, {prot: 0, cal: 0, fat: 0, fiber: 0, mg: 0, k: 0, vitc: 0, ca: 0});

            const newMeal = { type: 'meal', desc: mealName, mealId: mealId, isExpanded: false, items: pastoInCostruzione, ...totaliPasto };
            
            const datiGiornalieri = caricaGiorno(giornoVisualizzato) || { log: [], workoutCalorie: 0, calorieAdjustment: 0 };
            datiGiornalieri.log.push(newMeal);
            
            salvaGiorno(giornoVisualizzato, datiGiornalieri);

            pastoInCostruzione = []; 
            salvaPastoInCostruzione(); 
            
            renderMealBuilder(); 
            
            // Passa al pasto successivo
            const currentIndex = MEAL_TYPE_SEQUENCE.indexOf(mealId);
            if (currentIndex !== -1 && currentIndex < MEAL_TYPE_SEQUENCE.length - 1) {
                mealTypeSelector.value = MEAL_TYPE_SEQUENCE[currentIndex + 1];
            } else {
                mealTypeSelector.value = MEAL_TYPE_SEQUENCE[0];
            }
            alert("Pasto salvato nel diario giornaliero!");
        });

        // Funzione di inizializzazione
        function initBuilderApp() {
            pastoInCostruzione = JSON.parse(localStorage.getItem('trackerPastoInCostruzione')) || [];
            renderMealBuilder();
            const lastMealTypeSelected = localStorage.getItem('lastMealTypeSelected_' + getTodayString());
            if (lastMealTypeSelected && MEAL_TYPE_SEQUENCE.includes(lastMealTypeSelected)) {
                mealTypeSelector.value = lastMealTypeSelected;
            } else {
                mealTypeSelector.value = MEAL_TYPE_SEQUENCE[0];
            }
        }

        // Inizializza Firebase per assicurare la connettività e la condivisione dei dati
        try {
            if (!getApps().some(app => app.name === "builderApp")) {
                firebaseApp = initializeApp(firebaseConfig, "builderApp");
            } else {
                firebaseApp = getApp("builderApp");
            }
            db = getDatabase(firebaseApp);
            auth = getAuth(firebaseApp);
            console.log("Firebase inizializzato per il builder.");
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUserUID = user.uid;
                } else {
                    currentUserUID = null;
                }
            });
        } catch (error) {
            console.error("Errore durante l'inizializzazione di Firebase:", error);
        }

        document.addEventListener('DOMContentLoaded', initBuilderApp);

        mealTypeSelector.addEventListener('change', renderMealBuilder);

    </script>
</body>
</html>
