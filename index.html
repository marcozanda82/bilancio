<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Definitivo - Con Modifica</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; }
        .sezione { margin-bottom: 25px; padding: 20px; background-color: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; border-left-width: 5px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input, select, button { font-size: 1em; }
        button { background-color: #1976d2; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background-color 0.3s; }
        button:hover { background-color: #1565c0; }
        .sync-button-container { text-align: right; margin-bottom: 15px; }
        .sync-button { display: inline-block; background-color: #ff8f00; color: white; padding: 10px 15px; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 0.9em; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9em; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        .delete-btn { background-color: transparent; border: none; color: #d32f2f; font-size: 1.4em; cursor: pointer; }
        #caricamento-manuale div { display: flex; gap: 10px; align-items: center; margin-top:15px}
        #caricamento-manuale input { flex-grow: 1; margin: 0; }
        #caricamento-manuale button { flex-grow: 0; width: auto; margin: 0; background-color: #673ab7; }
        
        /* NUOVO STILE: Rende le righe del diario cliccabili */
        #log-body tr { cursor: pointer; }
        #log-body tr:hover { background-color: #e3f2fd; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sync-button-container">
            <a href="sync.html" class="sync-button">☁️ Sincronizza con il Cloud</a>
        </div>
        
        <h1>Tracker Nutrizionale</h1>
        <h2 id="titolo-giornata"></h2>
        
        <div id="food-adder" class="sezione">
            <h2>Aggiungi o Modifica Alimento</h2>
            <div class="builder-grid" style="grid-template-columns: 2fr 1fr; gap: 15px;">
                 <div><label>Alimento</label><input type="text" id="builder-desc" placeholder="es. Pollo" list="food-database-list"></div>
                 <div><label>Quantità (g)</label><input type="number" id="builder-qta" min="0"></div>
            </div>
             <details>
                <summary style="cursor:pointer; color: #555; margin-bottom:15px;">Valori Nutrizionali (per 100g)</summary>
                <div class="builder-grid" style="grid-template-columns: 1fr 1fr; gap: 10px 15px;">
                    <div><label>Proteine</label><input type="number" id="builder-prot" min="0" step="0.1"></div>
                    <div><label>Kcal</label><input type="number" id="builder-kcal" min="0"></div>
                    <div><label>Magnesio (mg)</label><input type="number" id="builder-mg" min="0"></div>
                    <div><label>Potassio (mg)</label><input type="number" id="builder-k" min="0"></div>
                    <div><label>Vit. C (mg)</label><input type="number" id="builder-vitc" min="0"></div>
                    <div><label>Calcio (mg)</label><input type="number" id="builder-ca" min="0"></div>
                </div>
            </details>
            <datalist id="food-database-list"></datalist>
            <button id="btn-aggiungi-singolo" style="width:100%; margin-top: 15px;">Aggiungi / Aggiorna Voce nel Diario</button>
        </div>

        <div class="sezione">
            <h2>Diario Giornaliero</h2>
            <p>Clicca su una riga per modificarla.</p>
            <table id="log-pasti">
                <thead><tr><th>Descrizione</th><th>(g)</th><th>Prot</th><th>Kcal</th><th>Azione</th></tr></thead>
                <tbody id="log-body"></tbody>
            </table>
            <div id="caricamento-manuale">
                <h3>Carica un Giorno Specifico</h3>
                <div>
                    <input type="date" id="data-caricamento">
                    <button id="btn-carica-giorno">Carica</button>
                </div>
            </div>
        </div>

        <div id="riepilogo" class="sezione">
             </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- STATO E COSTANTI ---
    let giornoVisualizzato = getTodayString('ymd');
    let datiGiornalieri = {};
    let foodDatabase = {};
    
    // --- ELEMENTI DEL DOM ---
    const titoloGiornataEl = document.getElementById('titolo-giornata');
    const logBody = document.getElementById('log-body');
    const builderDesc = document.getElementById('builder-desc'), builderQta = document.getElementById('builder-qta');
    const builderProt = document.getElementById('builder-prot'), builderKcal = document.getElementById('builder-kcal');
    const builderMg = document.getElementById('builder-mg'), builderK = document.getElementById('builder-k'), builderVitC = document.getElementById('builder-vitc'), builderCa = document.getElementById('builder-ca');
    const foodDatalist = document.getElementById('food-database-list');
    const btnAggiungiSingolo = document.getElementById('btn-aggiungi-singolo');
    const btnCaricaGiorno = document.getElementById('btn-carica-giorno');
    const dataCaricamentoInput = document.getElementById('data-caricamento');

    // --- FUNZIONI DI GESTIONE DATI ---
    function getTodayString(format = 'ymd') { const today = new Date(); if (format === 'ymd') return today.toISOString().split('T')[0]; return `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}`; }
    
    function salvaGiornoAttuale() {
        // Ricalcola i totali prima di salvare
        let totali = (datiGiornalieri.log || []).reduce((acc, entry) => {
            Object.keys(acc).forEach(key => acc[key] += entry[key] || 0);
            return acc;
        }, { proteine: 0, calorie: 0, mg: 0, k: 0, vitc: 0, ca: 0 });
        datiGiornalieri = {...datiGiornalieri, ...totali};

        const oggi = getTodayString('ymd');
        if (giornoVisualizzato === oggi) {
            localStorage.setItem('trackerGiornoCorrente', JSON.stringify({ data: giornoVisualizzato, dati: datiGiornalieri }));
        } else {
            // Logica per aggiornare lo storico
        }
    }

    function caricaGiorno(data) {
        giornoVisualizzato = data;
        dataCaricamentoInput.value = data;
        const oggi = getTodayString('ymd');
        let datiTrovati = null;
        if (data === oggi) {
            const giornoCorrenteSalvataggio = JSON.parse(localStorage.getItem('trackerGiornoCorrente'));
            if (giornoCorrenteSalvataggio) datiTrovati = giornoCorrenteSalvataggio.dati;
        } else {
            const storico = JSON.parse(localStorage.getItem('trackerStorico')) || [];
            const recordStorico = storico.find(item => item.data === data);
            if (recordStorico) datiTrovati = { ...recordStorico.totali, log: recordStorico.log || [] };
        }
        datiGiornalieri = datiTrovati || { log: [] };
        aggiornaUI();
    }
    
    function gestisciAvvioApp() {
        caricaGiorno(getTodayString('ymd'));
        const dbSalvato = localStorage.getItem('trackerFoodDatabase');
        if (dbSalvato) {
            foodDatabase = JSON.parse(dbSalvato);
            aggiornaDatalist();
        }
    }

    // --- FUNZIONI DI AGGIORNAMENTO UI ---
    function aggiornaUI() {
        const dataVisualizzata = new Date(giornoVisualizzato);
        titoloGiornataEl.textContent = `Diario del ${dataVisualizzata.toLocaleDateString('it-IT', {day: 'numeric', month: 'long', year: 'numeric'})}`;
        
        logBody.innerHTML = ''; 
        (datiGiornalieri.log || []).forEach((entry, index) => {
            const riga = logBody.insertRow();
            riga.className = 'log-item-row'; // Aggiunge una classe per l'evento click
            riga.dataset.index = index;    // Salva l'indice per un facile recupero
            riga.innerHTML = `
                <td>${entry.desc}</td>
                <td>${entry.qta}g</td>
                <td>${(entry.prot||0).toFixed(1)}</td>
                <td>${(entry.cal||0).toFixed(0)}</td>
                <td><button class="delete-btn" data-index="${index}">&times;</button></td>
            `;
        });
    }
    
    function aggiornaDatalist() {
        foodDatalist.innerHTML = '';
        for (const foodName in foodDatabase) {
            const option = document.createElement('option');
            option.value = foodName.charAt(0).toUpperCase() + foodName.slice(1);
            foodDatalist.appendChild(option);
        }
    }
    
    function resetInputAlimento() { [builderDesc, builderQta, builderProt, builderKcal, builderMg, builderK, builderVitC, builderCa].forEach(el => el.value = ''); builderDesc.focus(); }

    // --- EVENT LISTENERS ---
    btnCaricaGiorno.addEventListener('click', () => { if (dataCaricamentoInput.value) caricaGiorno(dataCaricamentoInput.value); });
    
    btnAggiungiSingolo.addEventListener('click', () => {
        const desc = builderDesc.value.trim(); const qta = parseFloat(builderQta.value) || 0;
        if (!desc || qta <= 0) { alert('Inserisci nome e quantità.'); return; }
        const p100 = parseFloat(builderProt.value) || 0, k100 = parseFloat(builderKcal.value) || 0;
        const mg100 = parseFloat(builderMg.value) || 0, k100_mg = parseFloat(builderK.value) || 0;
        const vitc100 = parseFloat(builderVitC.value) || 0, ca100 = parseFloat(builderCa.value) || 0;
        
        if (p100 > 0 || k100 > 0) { 
            foodDatabase[desc.toLowerCase()] = { prot: p100, kcal: k100, mg: mg100, k: k100_mg, vitc: vitc100, ca: ca100 }; 
            localStorage.setItem('trackerFoodDatabase', JSON.stringify(foodDatabase));
            aggiornaDatalist();
        }
        
        const item = { desc, qta, prot: (p100 / 100) * qta, cal: (k100 / 100) * qta, mg: (mg100 / 100) * qta, k: (k100_mg / 100) * qta, vitc: (vitc100 / 100) * qta, ca: (ca100 / 100) * qta };
        datiGiornalieri.log.push(item);
        salvaGiornoAttuale();
        aggiornaUI();
        resetInputAlimento();
    });

    builderDesc.addEventListener('input', (e) => {
        const foodName = e.target.value.toLowerCase();
        if (foodDatabase[foodName]) {
            const foodData = foodDatabase[foodName];
            builderProt.value = foodData.prot || ''; builderKcal.value = foodData.kcal || '';
            builderMg.value = foodData.mg || ''; builderK.value = foodData.k || '';
            builderVitC.value = foodData.vitc || ''; builderCa.value = foodData.ca || '';
        }
    });

    // NUOVO EVENTO: Gestisce il click sulle righe del diario per la modifica
    logBody.addEventListener('click', (e) => {
        const deleteBtn = e.target.closest('.delete-btn');
        if (deleteBtn) { // L'utente ha cliccato sul cestino
            e.stopPropagation(); // Ferma la propagazione per non attivare il click sulla riga
            const index = parseInt(deleteBtn.dataset.index, 10);
            if (confirm('Cancellare la voce?')) {
                datiGiornalieri.log.splice(index, 1);
                salvaGiornoAttuale();
                aggiornaUI();
            }
            return;
        }

        const row = e.target.closest('.log-item-row');
        if (row) { // L'utente ha cliccato su una riga
            if (!confirm('Vuoi modificare questa voce? Verrà rimossa dal diario e caricata nel modulo in alto.')) return;
            
            const index = parseInt(row.dataset.index, 10);
            const itemToEdit = datiGiornalieri.log[index];
            if (!itemToEdit) return;

            // Popola il form con i dati dell'elemento da modificare
            builderDesc.value = itemToEdit.desc;
            builderQta.value = itemToEdit.qta;

            // Cerca i valori per 100g nel database, se non li trova li ricalcola
            const foodData = foodDatabase[itemToEdit.desc.toLowerCase()];
            if(foodData){
                builderProt.value = foodData.prot || ''; builderKcal.value = foodData.kcal || '';
                builderMg.value = foodData.mg || ''; builderK.value = foodData.k || '';
                builderVitC.value = foodData.vitc || ''; builderCa.value = foodData.ca || '';
            } else {
                 builderProt.value = (itemToEdit.prot / itemToEdit.qta * 100).toFixed(1);
                 builderKcal.value = (itemToEdit.cal / itemToEdit.qta * 100).toFixed(0);
                 builderMg.value = (itemToEdit.mg / itemToEdit.qta * 100).toFixed(1);
                 builderK.value = (itemToEdit.k / itemToEdit.qta * 100).toFixed(0);
                 builderVitC.value = (itemToEdit.vitc / itemToEdit.qta * 100).toFixed(1);
                 builderCa.value = (itemToEdit.ca / itemToEdit.qta * 100).toFixed(1);
            }

            // Rimuovi l'elemento dal log
            datiGiornalieri.log.splice(index, 1);
            salvaGiornoAttuale();
            aggiornaUI();
            
            // Porta l'utente in cima alla pagina
            document.getElementById('food-adder').scrollIntoView({ behavior: 'smooth' });
        }
    });

    // AVVIO APPLICAZIONE
    gestisciAvvioApp();
});
</script>
</body>
</html>
