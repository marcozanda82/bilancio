<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Nutrizionale - Versione Finale</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; }
        h2 { font-size: 1.4em; margin-top: 30px; }
        h3 { font-size: 1.1em; color: #333; border-bottom: 1px solid #eee; margin-top: 20px; }
        #titolo-giornata { text-align: center; color: #d84315; font-weight: 600; margin-bottom: 20px; padding: 10px; background-color: #fff3e0; border-radius: 8px; border: 1px solid #ffe0b2;}
        .sezione { margin-bottom: 25px; padding: 20px; background-color: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; border-left-width: 5px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
        input[type="checkbox"] { width: auto; transform: scale(1.2); }
        button { background-color: #1976d2; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: 600; transition: background-color 0.3s; }
        button:hover { background-color: #1565c0; }
        .nav-links { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-links a { flex-grow: 1; text-align: center; padding: 10px; background-color: #607d8b; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
        #riepilogo p { margin: 8px 0; }
        progress { width: 100%; height: 15px; margin-top: 2px; }
        progress.macro-progress { height: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85em; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; vertical-align: middle; }
        .action-btn { background:0; border:0; font-size:1.3em; cursor:pointer; padding: 0 5px; }
        .delete-btn { color:#d32f2f; }
        .builder-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .button-group { display: flex; gap: 10px; margin-top: 15px; }
        #btn-costruisci-pasto { background-color: #ff8f00; }
        #btn-aggiungi-singolo { background-color: #5c6bc0; }
        #meal-builder-sezione[data-visible="false"] { display: none; }
        #btn-salva-pasto { background-color: #2e7d32; width: 100%; margin-top: 15px; }
        #btn-archivia { width: 100%; margin-top: 20px; background-color: #c62828; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tracker Nutrizionale</h1>
        <h2 id="titolo-giornata"></h2>
        <div class="nav-links"><a href="storico.html">📊 Storico</a></div>
        
        <div id="riepilogo" class="sezione">
            <h2>Riepilogo di Oggi</h2>
            <p>Proteine: <span id="totale-proteine">0</span> / <span id="obiettivo-proteine"></span> g</p>
            <progress id="progress-proteine" class="macro-progress" value="0"></progress>
            <p>Calorie: <span id="totale-calorie">0</span> / <span id="obiettivo-calorie"></span> kcal</p>
            <progress id="progress-calorie" class="macro-progress" value="0"></progress>
        </div>

        <div id="food-adder" class="sezione">
            <h2>Aggiungi Alimento</h2>
            <div class="builder-grid">
                <div><label>Alimento</label><input type="text" id="builder-desc" list="food-database-list"></div>
                <div><label>Quantità (g)</label><input type="number" id="builder-qta" min="0"></div>
                <div><label>Proteine/100g</label><input type="number" id="builder-prot" min="0" step="0.1"></div>
                <div><label>Kcal/100g</label><input type="number" id="builder-kcal" min="0"></div>
            </div>
            <datalist id="food-database-list"></datalist>
            <div class="button-group">
                <button id="btn-costruisci-pasto">Aggiungi a Pasto</button>
                <button id="btn-aggiungi-singolo">Aggiungi Diretto</button>
            </div>
        </div>
        
        <div id="meal-builder-sezione" class="sezione" data-visible="false">
             <h2>Costruttore Pasto</h2>
            <table id="log-pasto-builder">
                <thead><tr><th>Descrizione</th><th>(g)</th><th>Prot</th><th>Kcal</th><th>Azione</th></tr></thead>
                <tbody id="log-pasto-builder-body"></tbody>
            </table>
            <button id="btn-salva-pasto">Aggiungi Pasto al Diario</button>
        </div>

        <div class="sezione">
            <h2>Diario Giornaliero</h2>
            <table id="log-pasti"><thead><tr><th>Descrizione</th><th>(g)</th><th>Prot</th><th>Kcal</th><th>Azione</th></tr></thead><tbody id="log-body"></tbody></table>
            <button id="btn-archivia">Archivia e Chiudi Giornata</button>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const PIANO_SETTIMANALE = { 0:{tipo:'💧 Riposo', cal:1700, prot:110}, 1:{tipo:'🔥 Forza', cal:2400, prot:140}, 2:{tipo:'🔥 Forza', cal:2400, prot:140}, 3:{tipo:'🔥 HIIT', cal:2400, prot:140}, 4:{tipo:'🔥 Forza', cal:2400, prot:140}, 5:{tipo:'🔥 Forza', cal:2400, prot:140}, 6:{tipo:'💧 Cardio', cal:1700, prot:110} };
    let datiGiornalieri, foodDatabase, pastoInCostruzione;

    const dom = {};
    const ids = ['titolo-giornata', 'totale-proteine', 'obiettivo-proteine', 'progress-proteine', 'totale-calorie', 'obiettivo-calorie', 'progress-calorie', 'builder-desc', 'builder-qta', 'builder-prot', 'builder-kcal', 'food-database-list', 'log-body', 'btn-aggiungi-singolo', 'btn-costruisci-pasto', 'btn-salva-pasto', 'btn-archivia', 'meal-builder-sezione', 'log-pasto-builder-body'];
    ids.forEach(id => { if (document.getElementById(id)) dom[id.replace(/-/g,'_')] = document.getElementById(id); });
    
    const getTodayString = () => new Date().toISOString().split('T')[0];

    function salvaStato() {
        localStorage.setItem('trackerGiornoCorrente', JSON.stringify({ data: getTodayString(), dati: datiGiornalieri }));
        localStorage.setItem('trackerFoodDatabase', JSON.stringify(foodDatabase));
        localStorage.setItem('trackerPastoInCostruzione', JSON.stringify(pastoInCostruzione));
    }

    function aggiornaUI() {
        const dataAttuale = new Date();
        const pianoOggi = PIANO_SETTIMANALE[dataAttuale.getDay()];
        dom.titolo_giornata.textContent = pianoOggi.tipo;
        dom.obiettivo_proteine.textContent = pianoOggi.prot;
        dom.obiettivo_calorie.textContent = pianoOggi.cal;
        dom.progress_proteine.max = pianoOggi.prot;
        dom.progress_calorie.max = pianoOggi.cal;
        
        const totali = (datiGiornalieri.log || []).reduce((acc, item) => {
            acc.proteine += item.prot || 0;
            acc.calorie += item.cal || 0;
            return acc;
        }, { proteine: 0, calorie: 0 });
        
        dom.totale_proteine.textContent = totali.proteine.toFixed(1);
        dom.progress_proteine.value = totali.proteine;
        dom.totale_calorie.textContent = totali.calorie.toFixed(0);
        dom.progress_calorie.value = totali.calorie;

        dom.log_body.innerHTML = '';
        (datiGiornalieri.log || []).forEach((item, index) => {
            const riga = dom.log_body.insertRow();
            riga.innerHTML = `<td>${item.desc}</td><td>${item.qta}g</td><td>${item.prot.toFixed(1)}</td><td>${item.cal.toFixed(0)}</td><td><button class="delete-btn" data-type="log" data-index="${index}">&times;</button></td>`;
        });
        
        dom.food_database_list.innerHTML = Object.keys(foodDatabase).map(key => `<option value="${key.charAt(0).toUpperCase() + key.slice(1)}">`).join('');
    }
    
    function initApp() {
        foodDatabase = JSON.parse(localStorage.getItem('trackerFoodDatabase')) || {};
        pastoInCostruzione = JSON.parse(localStorage.getItem('trackerPastoInCostruzione')) || [];
        const giornoCorrenteData = JSON.parse(localStorage.getItem('trackerGiornoCorrente'));
        if (giornoCorrenteData && giornoCorrenteData.data === getTodayString()) {
            datiGiornalieri = giornoCorrenteData.dati;
        } else {
            datiGiornalieri = { log: [], workoutLog: [] };
        }
        aggiornaUI();
        renderMealBuilder();
    }

    function creaAlimentoDaInput() {
        const desc = dom.builder_desc.value.trim(); const qta = parseFloat(dom.builder_qta.value) || 0;
        if (!desc || qta <= 0) { alert('Inserisci nome e quantità.'); return null; }
        const p100 = parseFloat(dom.builder_prot.value)||0, k100 = parseFloat(dom.builder_kcal.value)||0;
        if (p100 > 0 || k100 > 0) foodDatabase[desc.toLowerCase()] = { prot: p100, kcal: k100 };
        return { desc, qta, prot: (p100/100)*qta, cal: Math.round((k100/100)*qta) };
    }

    function renderMealBuilder() { 
        if(!dom.meal_builder_sezione) return;
        dom.meal_builder_sezione.dataset.visible = pastoInCostruzione.length > 0;
        if (pastoInCostruzione.length === 0) return;
        dom.log_pasto_builder_body.innerHTML = '';
        pastoInCostruzione.forEach((item, index) => {
            const riga = dom.log_pasto_builder_body.insertRow();
            riga.innerHTML = `<td>${item.desc}</td><td>${item.qta}g</td><td>${item.prot.toFixed(1)}</td><td>${item.cal.toFixed(0)}</td><td><button class="delete-btn" data-type="builder" data-index="${index}">&times;</button></td>`;
        });
    }
    
    function resetInputAlimento() {
        ['builder_desc', 'builder_qta', 'builder_prot', 'builder_kcal'].forEach(id => dom[id].value = '');
        dom.builder_desc.focus();
    }

    dom.btn_aggiungi_singolo.addEventListener('click', () => { 
        const item = creaAlimentoDaInput(); 
        if(item) { datiGiornalieri.log.push(item); salvaStato(); aggiornaUI(); resetInputAlimento(); }
    });

    dom.btn_costruisci_pasto.addEventListener('click', () => { 
        const item = creaAlimentoDaInput(); 
        if(item) { pastoInCostruzione.push(item); salvaStato(); renderMealBuilder(); resetInputAlimento(); }
    });
    
    dom.btn_salva_pasto.addEventListener('click', () => {
        if (pastoInCostruzione.length === 0) return alert("Nessun alimento nel costruttore.");
        pastoInCostruzione.forEach(item => datiGiornalieri.log.push(item));
        pastoInCostruzione = [];
        salvaStato();
        aggiornaUI();
        renderMealBuilder();
    });

    dom.builder_desc.addEventListener('input', (e) => {
        const foodData = foodDatabase[e.target.value.toLowerCase()];
        if(foodData) {
            dom.builder_prot.value = foodData.prot || '';
            dom.builder_kcal.value = foodData.kcal || '';
        }
    });

    document.querySelector('.container').addEventListener('click', (e) => {
        const target = e.target.closest('.delete-btn');
        if (target) {
            const index = target.dataset.index;
            if (target.closest('#log-pasti')) {
                datiGiornalieri.log.splice(index, 1);
            } else if (target.closest('#log-pasto-builder')) {
                pastoInCostruzione.splice(index, 1);
                renderMealBuilder();
            }
            salvaStato();
            aggiornaUI();
        }
    });
    
    dom.btn_archivia.addEventListener('click', () => {
        const giornoCorrente = JSON.parse(localStorage.getItem('trackerGiornoCorrente'));
        if (!giornoCorrente || !giornoCorrente.dati || (giornoCorrente.dati.log || []).length === 0) return alert("Nessun dato da archiviare.");
        if (!confirm(`Sei sicuro di voler chiudere e archiviare la giornata del ${new Date(giornoCorrente.data).toLocaleDateString()}?`)) return;
        const storico = JSON.parse(localStorage.getItem('trackerStorico')) || [];
        const nuovoStorico = storico.filter(item => item.data !== giornoCorrente.data);
        nuovoStorico.push({ data: giornoCorrente.data, ...giornoCorrente.dati });
        localStorage.setItem('trackerStorico', JSON.stringify(nuovoStorico));
        
        datiGiornalieri = { log: [], workoutLog: [] };
        pastoInCostruzione = [];
        salvaStato();
        alert(`Giornata archiviata!`);
        aggiornaUI();
        renderMealBuilder();
    });

    initApp();
});
</script>
</body>
</html>
