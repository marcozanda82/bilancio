<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Definitivo - Corretto</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; }
        h2 { font-size: 1.4em; margin-top: 30px; }
        h3 { font-size: 1.1em; color: #333; border-bottom: 1px solid #eee; margin-top: 20px; }
        #titolo-giornata { text-align: center; color: #d84315; font-weight: 600; margin-bottom: 20px; padding: 10px; background-color: #fff3e0; border-radius: 8px; border: 1px solid #ffe0b2;}
        .sezione { margin-bottom: 25px; padding: 20px; background-color: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; border-left-width: 5px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="text"], input[type="number"], input[type="date"], select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
        input[type="checkbox"] { transform: scale(1.2); cursor: pointer; }
        button { background-color: #1976d2; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: 600; transition: background-color 0.3s; }
        button:hover { background-color: #1565c0; }
        .nav-links { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-links a { flex-grow: 1; text-align: center; padding: 10px; background-color: #607d8b; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
        .sync-button-container { text-align: right; margin-bottom: 15px; }
        .sync-button { display: inline-block; background-color: #ff8f00; color: white; padding: 10px 15px; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 0.9em; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.8em; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; vertical-align: middle; }
        th { background-color: #f2f2f2; font-weight: 600; }
        .builder-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
        .button-group { display: flex; gap: 10px; margin-top: 15px; }
        #meal-builder-sezione[data-visible="false"] { display: none; }
        #meal-builder-sezione { border-left-color: #ff8f00; }
        #btn-salva-pasto { background-color: #2e7d32; width: 100%; margin-top: 15px; }
        #caricamento-manuale { margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee; border-left-color: #673ab7;}
        #caricamento-manuale div { display: flex; gap: 10px; align-items: center; }
        #caricamento-manuale input { flex-grow: 1; margin-bottom: 0; }
        #caricamento-manuale button { flex-grow: 0; width: auto; margin-bottom: 0; background-color: #673ab7; }
        .action-buttons { display: flex; justify-content: center; align-items: center; gap: 8px; }
        .action-buttons button { background: none; border: none; padding: 4px; font-size: 1.3em; line-height: 1; cursor: pointer; }
        .edit-btn { color: #1976d2; }
        .delete-btn { color: #d32f2f; }
        .meal-group-row { background-color: #f0f4f8; font-weight: bold; }
        .expand-arrow { cursor: pointer; display: inline-block; width: 20px; text-align: center; }
        .sub-item-row td { padding-left: 30px !important; background-color: #fff; font-style: italic; color: #555; border-bottom: 1px dotted #ccc; }
        .sub-item-row td:last-child { visibility: hidden; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sync-button-container">
            <a href="sync.html" class="sync-button">☁️ Sincronizza con il Cloud</a>
        </div>
        
        <h1>Tracker Nutrizionale</h1>
        <h2 id="titolo-giornata"></h2>
        
        <div id="food-adder" class="sezione">
            <h2>Aggiungi Alimento</h2>
            <div class="builder-grid" style="grid-template-columns: 2fr 1fr; gap: 15px;">
                 <div><label>Alimento</label><input type="text" id="builder-desc" placeholder="es. Pollo" list="food-database-list"></div>
                 <div><label>Quantità (g)</label><input type="number" id="builder-qta" min="0"></div>
            </div>
             <details>
                <summary style="cursor:pointer; color: #555; margin-bottom:15px;">Valori Nutrizionali (per 100g)</summary>
                <div class="builder-grid" style="grid-template-columns: 1fr 1fr; gap: 10px 15px;">
                    <div><label>Proteine</label><input type="number" id="builder-prot" min="0" step="0.1"></div>
                    <div><label>Kcal</label><input type="number" id="builder-kcal" min="0"></div>
                </div>
            </details>
            <datalist id="food-database-list"></datalist>
            <div class="button-group">
                <button id="btn-costruisci-pasto">Aggiungi a Pasto</button>
                <button id="btn-aggiungi-singolo">Aggiungi al Diario</button>
            </div>
        </div>

        <div id="meal-builder-sezione" class="sezione" data-visible="false">
            <h2>Costruttore Pasto</h2>
            <select id="meal-type-selector">
                <option value="merenda1">Merenda AM</option>
                <option value="pranzo">Pranzo</option>
                <option value="merenda2">Merenda PM</option>
                <option value="cena">Cena</option>
            </select>
            <table id="log-pasto-builder">
                <thead><tr><th>Sel.</th><th>Descrizione</th><th>(g)</th><th>Prot</th><th>Kcal</th><th>Azione</th></tr></thead>
                <tbody id="log-pasto-builder-body"></tbody>
            </table>
            <button id="btn-salva-pasto">Salva Pasto nel Diario</button>
        </div>

        <div class="sezione">
            <h2>Diario Giornaliero</h2>
            <table id="log-pasti">
                <thead><tr><th>Descrizione</th><th>(g)</th><th>Prot</th><th>Kcal</th><th>Azione</th></tr></thead>
                <tbody id="log-body"></tbody>
            </table>
            <div id="caricamento-manuale" class="sezione" style="padding:15px; margin-top:20px; border-width:1px;">
                <h3 style="margin:0 0 10px 0; font-size:1em;">Carica Giorno Specifico</h3>
                <div>
                    <input type="date" id="data-caricamento">
                    <button id="btn-carica-giorno">Carica</button>
                </div>
            </div>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- STATO E COSTANTI ---
    let giornoVisualizzato = getTodayString('ymd');
    let datiGiornalieri = {};
    let foodDatabase = {};
    let pastoInCostruzione = []; 

    // --- ELEMENTI DEL DOM ---
    const titoloGiornataEl = document.getElementById('titolo-giornata');
    const logBody = document.getElementById('log-body');
    const builderDesc = document.getElementById('builder-desc'), builderQta = document.getElementById('builder-qta');
    const builderProt = document.getElementById('builder-prot'), builderKcal = document.getElementById('builder-kcal');
    const foodDatalist = document.getElementById('food-database-list');
    const btnAggiungiSingolo = document.getElementById('btn-aggiungi-singolo'), btnCostruisciPasto = document.getElementById('btn-costruisci-pasto');
    const mealBuilderSezione = document.getElementById('meal-builder-sezione'), logPastoBuilderBody = document.getElementById('log-pasto-builder-body');
    const btnSalvaPasto = document.getElementById('btn-salva-pasto'), mealTypeSelector = document.getElementById('meal-type-selector');
    const btnCaricaGiorno = document.getElementById('btn-carica-giorno'), dataCaricamentoInput = document.getElementById('data-caricamento');
    
    // --- FUNZIONI DI GESTIONE DATI ---
    function getTodayString() { return new Date().toISOString().split('T')[0]; }
    function salvaFoodDatabase() { localStorage.setItem('trackerFoodDatabase', JSON.stringify(foodDatabase)); }
    function salvaPastoInCostruzione() { localStorage.setItem('trackerPastoInCostruzione', JSON.stringify(pastoInCostruzione)); }

    function salvaGiornoAttuale() {
        let totali = (datiGiornalieri.log || []).reduce((acc, entry) => {
            acc.proteine += entry.prot || 0; acc.calorie += entry.cal || 0;
            return acc;
        }, { proteine: 0, calorie: 0 });
        datiGiornalieri = {...datiGiornalieri, ...totali};
        if (giornoVisualizzato === getTodayString()) {
            localStorage.setItem('trackerGiornoCorrente', JSON.stringify({ data: giornoVisualizzato, dati: datiGiornalieri }));
        }
    }

    function caricaGiorno(data) {
        giornoVisualizzato = data;
        dataCaricamentoInput.value = data;
        let datiTrovati = null;
        if (data === getTodayString()) {
            const giornoCorrenteSalvataggio = JSON.parse(localStorage.getItem('trackerGiornoCorrente'));
            if (giornoCorrenteSalvataggio) datiTrovati = giornoCorrenteSalvataggio.dati;
        }
        datiGiornalieri = datiTrovati || { log: [] };
        aggiornaUI();
    }
    
    function gestisciAvvioApp() {
        caricaGiorno(getTodayString());
        const dbSalvato = localStorage.getItem('trackerFoodDatabase');
        if (dbSalvato) foodDatabase = JSON.parse(dbSalvato);
        aggiornaDatalist();

        const pastoSalvato = localStorage.getItem('trackerPastoInCostruzione');
        if (pastoSalvato) pastoInCostruzione = JSON.parse(pastoSalvato);
        renderMealBuilder();
    }

    // --- FUNZIONI DI AGGIORNAMENTO UI ---
    function aggiornaUI() {
        const dataVisualizzata = new Date(giornoVisualizzato);
        titoloGiornataEl.textContent = `Diario del ${dataVisualizzata.toLocaleDateString('it-IT', {day: 'numeric', month: 'long', year: 'numeric'})}`;
        
        logBody.innerHTML = ''; 
        (datiGiornalieri.log || []).forEach((entry, index) => {
            const riga = logBody.insertRow();
            let actionButtonsHTML = `<button class="edit-btn" data-index="${index}" title="Modifica Voce">✏️</button> <button class="delete-btn" data-index="${index}" title="Elimina Voce">&times;</button>`;
            
            if (entry.type === 'meal') {
                riga.className = 'meal-group-row';
                const arrow = entry.isExpanded ? '&#9650;' : '&#9660;';
                riga.innerHTML = `<td><span class="expand-arrow" data-index="${index}">${arrow}</span> ${entry.desc}</td><td>${entry.items.reduce((sum, i) => sum + i.qta, 0)}g</td><td>${(entry.prot||0).toFixed(1)}</td><td>${(entry.cal||0).toFixed(0)}</td><td class="action-buttons">${actionButtonsHTML}</td>`;

                if (entry.isExpanded) {
                    entry.items.forEach(item => {
                        const subRiga = logBody.insertRow();
                        subRiga.className = 'sub-item-row';
                        subRiga.innerHTML = `<td>${item.desc}</td><td>${item.qta}g</td><td>${(item.prot||0).toFixed(1)}</td><td>${(item.cal||0).toFixed(0)}</td><td></td>`;
                    });
                }
            } else {
                riga.innerHTML = `<td>${entry.desc}</td><td>${entry.qta}g</td><td>${(entry.prot||0).toFixed(1)}</td><td>${(entry.cal||0).toFixed(0)}</td><td class="action-buttons">${actionButtonsHTML}</td>`;
            }
        });
    }
    
    function renderMealBuilder() { 
        mealBuilderSezione.dataset.visible = pastoInCostruzione.length > 0;
        logPastoBuilderBody.innerHTML = ''; 
        pastoInCostruzione.forEach((item, index) => { 
            const riga = logPastoBuilderBody.insertRow(); 
            const checkedAttr = item.selezionato !== false ? 'checked' : ''; 
            riga.innerHTML = `<td><input type="checkbox" class="builder-item-checkbox" data-index="${index}" ${checkedAttr}></td><td>${item.desc}</td><td>${item.qta}g</td><td>${item.prot.toFixed(1)}</td><td>${item.cal.toFixed(0)}</td><td class="action-buttons"><button class="delete-btn" data-type="builder" data-index="${index}">&times;</button></td>`; 
        }); 
    }

    function aggiornaDatalist() { foodDatalist.innerHTML = ''; for (const foodName in foodDatabase) { const option = document.createElement('option'); option.value = foodName.charAt(0).toUpperCase() + foodName.slice(1); foodDatalist.appendChild(option); } }

    function creaAlimentoDaInput(isSingle = false) {
        const desc = builderDesc.value.trim(); const qta = parseFloat(builderQta.value) || 0;
        if (!desc || qta <= 0) { alert('Inserisci nome e quantità.'); return null; }
        const p100 = parseFloat(builderProt.value) || 0, k100 = parseFloat(builderKcal.value) || 0;
        
        if (p100 > 0 || k100 > 0) { foodDatabase[desc.toLowerCase()] = { prot: p100, kcal: k100 }; salvaFoodDatabase(); aggiornaDatalist(); }
        
        const foodItem = { desc, qta, prot: (p100 / 100) * qta, cal: (k100 / 100) * qta };
        if (!isSingle) foodItem.selezionato = true; else foodItem.type = 'single';
        return foodItem;
    }

    function resetInputAlimento() { [builderDesc, builderQta, builderProt, builderKcal].forEach(el => el.value = ''); builderDesc.focus(); }

    // --- EVENT LISTENERS ---
    document.body.addEventListener('click', (e) => {
        const target = e.target;
        if (target.closest('.edit-btn')) {
            const index = parseInt(target.closest('.edit-btn').dataset.index, 10);
            const itemToEdit = datiGiornalieri.log[index];
            if (!itemToEdit || !confirm("Vuoi modificare questa voce? Verrà spostata nel 'Costruttore Pasto'.")) return;
            
            pastoInCostruzione.push(...(itemToEdit.type === 'meal' ? itemToEdit.items : [itemToEdit]));
            datiGiornalieri.log.splice(index, 1);
            
            salvaGiornoAttuale();
            salvaPastoInCostruzione();
            aggiornaUI();
            renderMealBuilder();
            mealBuilderSezione.scrollIntoView({ behavior: 'smooth' });
        }
        else if (target.closest('.delete-btn')) {
            const button = target.closest('.delete-btn');
            const index = parseInt(button.dataset.index, 10);
            if (!confirm('Cancellare la voce?')) return;
            
            if (button.dataset.type === 'builder') {
                pastoInCostruzione.splice(index, 1);
                salvaPastoInCostruzione();
                renderMealBuilder();
            } else {
                datiGiornalieri.log.splice(index, 1);
                salvaGiornoAttuale();
                aggiornaUI();
            }
        }
        else if (target.closest('.expand-arrow')) {
            const index = parseInt(target.closest('.expand-arrow').dataset.index, 10);
            const entry = datiGiornalieri.log[index];
            if (entry && entry.type === 'meal') {
                entry.isExpanded = !entry.isExpanded;
                salvaGiornoAttuale();
                aggiornaUI();
            }
        }
    });

    logPastoBuilderBody.addEventListener('change', (e) => {
        if (e.target.classList.contains('builder-item-checkbox')) {
            const index = parseInt(e.target.dataset.index, 10);
            if (pastoInCostruzione[index]) pastoInCostruzione[index].selezionato = e.target.checked;
            salvaPastoInCostruzione();
        }
    });

    btnCaricaGiorno.addEventListener('click', () => { if (dataCaricamentoInput.value) caricaGiorno(dataCaricamentoInput.value); });
    
    btnAggiungiSingolo.addEventListener('click', () => {
        const item = creaAlimentoDaInput(true);
        if (item) {
            datiGiornalieri.log.push(item);
            salvaGiornoAttuale();
            aggiornaUI();
            resetInputAlimento();
        }
    });

    btnCostruisciPasto.addEventListener('click', () => {
        const item = creaAlimentoDaInput(false);
        if (item) {
            pastoInCostruzione.push(item);
            salvaPastoInCostruzione();
            renderMealBuilder();
            resetInputAlimento();
        }
    });

    // ** LISTENER DI SALVA PASTO - LOGICA COMPLETA **
    btnSalvaPasto.addEventListener('click', () => {
        const alimentiSelezionati = pastoInCostruzione.filter(item => item.selezionato);
        if (alimentiSelezionati.length === 0) return alert("Nessun alimento selezionato.");
        
        const mealName = mealTypeSelector.options[mealTypeSelector.selectedIndex].text;
        const totaliPasto = alimentiSelezionati.reduce((acc, item) => {
            acc.prot += item.prot || 0; acc.calorie += item.cal || 0;
            return acc;
        }, {prot: 0, calorie: 0});

        const newMeal = {
            type: 'meal', desc: mealName, isExpanded: false, items: alimentiSelezionati,
            prot: totaliPasto.prot, cal: totaliPasto.calorie
        };
        
        datiGiornalieri.log.push(newMeal);
        pastoInCostruzione = [];
        salvaPastoInCostruzione();
        salvaGiornoAttuale();
        aggiornaUI();
        renderMealBuilder();
    });

    builderDesc.addEventListener('input', (e) => {
        const foodData = foodDatabase[e.target.value.toLowerCase()];
        if (foodData) {
            builderProt.value = foodData.prot || ''; builderKcal.value = foodData.kcal || '';
        }
    });

    // AVVIO APPLICAZIONE
    gestisciAvvioApp();
});
</script>
</body>
</html>
