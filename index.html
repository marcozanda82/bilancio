<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Definitivo - Con Caricamento Manuale</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; }
        .sezione { margin-bottom: 25px; padding: 20px; background-color: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; border-left-width: 5px; }
        .sync-button-container { text-align: right; margin-bottom: 15px; }
        .sync-button { display: inline-block; background-color: #ff8f00; color: white; padding: 10px 15px; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 0.9em; }
        /* Aggiungo stili per la nuova sezione */
        #caricamento-manuale { border-left-color: #673ab7; }
        #caricamento-manuale div { display: flex; gap: 10px; align-items: center; }
        #caricamento-manuale input { flex-grow: 1; margin-bottom: 0; }
        #caricamento-manuale button { flex-grow: 0; width: auto; margin-bottom: 0; background-color: #673ab7; }
        #caricamento-manuale button:hover { background-color: #512da8; }
        /* ...Tutto il resto del tuo CSS originale... */
    </style>
</head>
<body>
    <div class="container">
        <div class="sync-button-container">
            <a href="sync.html" class="sync-button">☁️ Sincronizza con il Cloud</a>
        </div>
        
        <h1>Tracker Nutrizionale</h1>
        <h2 id="titolo-giornata"></h2>
        
        <div class="nav-links">...</div>
        <div id="proiezione" class="sezione">...</div>
        <div id="riepilogo" class="sezione">...</div>
        <div id="food-adder" class="sezione">...</div>
        <div id="meal-builder-sezione" class="sezione" data-visible="false">...</div>
        <div class="sezione"><h2>Registra Allenamento</h2>...</div>

        <div class="sezione">
            <h2>Diario Giornaliero</h2>
            <table id="log-pasti"><thead><tr><th>Descrizione</th><th>(g)</th><th>Prot</th><th>Kcal</th><th>Mg</th><th>K</th><th>Vit.C</th><th>Ca</th><th>Azione</th></tr></thead><tbody id="log-body"></tbody></table>
            
            <div id="caricamento-manuale" style="margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee;">
                <h3>Carica un Giorno Specifico</h3>
                <div>
                    <input type="date" id="data-caricamento">
                    <button id="btn-carica-giorno">Carica</button>
                </div>
            </div>
        </div>

        <div id="backup-sezione" class="sezione">...</div>
        <div id="confronto-sezione" class="sezione">...</div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    //
    // SCRIPT MODIFICATO PER GESTIRE IL CARICAMENTO MANUALE
    //
    
    // VARIABILI E COSTANTI
    const PIANO_SETTIMANALE = { 0: { tipo: '💧 Riposo (Deficit)', cal: 1700, prot: 110 }, 1: { tipo: '🔥 Forza (Mantenimento)', cal: 2400, prot: 140 }, 2: { tipo: '🔥 Forza (Mantenimento)', cal: 2400, prot: 140 }, 3: { tipo: '🔥 HIIT/Core (Mantenimento)', cal: 2400, prot: 140 }, 4: { tipo: '🔥 Forza (Mantenimento)', cal: 2400, prot: 140 }, 5: { tipo: '🔥 Forza (Mantenimento)', cal: 2400, prot: 140 }, 6: { tipo: '💧 Cardio LISS (Deficit)', cal: 1700, prot: 110 } };
    const TDEE_BASE = 2311;
    
    // STATO DELL'APPLICAZIONE
    let giornoVisualizzato = getTodayString('ymd'); // Traccia quale giorno è attualmente visualizzato
    let datiGiornalieri = {};
    let foodDatabase = {};
    let pastoInCostruzione = [];

    // ELEMENTI DOM
    const btnCaricaGiorno = document.getElementById('btn-carica-giorno');
    const dataCaricamentoInput = document.getElementById('data-caricamento');
    // ... tutti gli altri elementi del DOM come prima ...
    const titoloGiornataEl = document.getElementById('titolo-giornata');
    const logBody = document.getElementById('log-body');
    // (Ometto la lista completa per brevità, ma lo script li usa tutti)
    
    // --- FUNZIONI PRINCIPALI ---

    function getTodayString(format = 'ymd') {
        const today = new Date();
        if (format === 'ymd') return today.toISOString().split('T')[0];
        const day = String(today.getDate()).padStart(2, '0');
        const month = String(today.getMonth() + 1).padStart(2, '0');
        return `${day}/${month}`;
    }

    // Carica i dati per una data specifica e aggiorna la UI
    function caricaGiorno(data) {
        giornoVisualizzato = data;
        dataCaricamentoInput.value = data; // Aggiorna l'input date
        
        const oggi = getTodayString('ymd');
        let datiTrovati = null;

        if (data === oggi) {
            const giornoCorrenteSalvataggio = JSON.parse(localStorage.getItem('trackerGiornoCorrente'));
            if (giornoCorrenteSalvataggio && giornoCorrenteSalvataggio.data === oggi) {
                datiTrovati = giornoCorrenteSalvataggio.dati;
            }
        } else {
            const storico = JSON.parse(localStorage.getItem('trackerStorico')) || [];
            const recordStorico = storico.find(item => item.data === data);
            if (recordStorico) {
                // Ricostruisce l'oggetto `datiGiornalieri` dal record storico
                datiTrovati = {
                    proteine: recordStorico.totali.proteine,
                    calorie: recordStorico.totali.calorie,
                    mg: recordStorico.totali.mg,
                    k: recordStorico.totali.k,
                    vitc: recordStorico.totali.vitc,
                    ca: recordStorico.totali.ca,
                    log: recordStorico.log,
                    workoutCalorie: recordStorico.totali.workoutCalorie,
                    workoutLog: recordStorico.allenamenti
                };
            }
        }

        if (datiTrovati) {
            datiGiornalieri = datiTrovati;
        } else {
            // Se non trovo dati, resetto per la data selezionata
            alert("Nessun dato trovato per questa data. Verrà visualizzato un diario vuoto.");
            datiGiornalieri = { proteine: 0, calorie: 0, mg: 0, k: 0, vitc: 0, ca: 0, log: [], workoutCalorie: 0, workoutLog: [] };
        }
        
        aggiornaUI();
        renderMealBuilder();
    }

    // Funzione di salvataggio modificata
    function salvaGiornoAttuale() {
        const oggi = getTodayString('ymd');

        if (giornoVisualizzato === oggi) {
            // Salva come giorno corrente
            localStorage.setItem('trackerGiornoCorrente', JSON.stringify({ data: giornoVisualizzato, dati: datiGiornalieri }));
        } else {
            // Aggiorna un giorno passato nello storico
            const storico = JSON.parse(localStorage.getItem('trackerStorico')) || [];
            const index = storico.findIndex(item => item.data === giornoVisualizzato);
            
            const dataArchiviazione = new Date(giornoVisualizzato);
            const pianoArchiviazione = PIANO_SETTIMANALE[dataArchiviazione.getDay()];

            // Ricostruisce l'oggetto storico con i dati aggiornati
            const recordAggiornato = {
                data: giornoVisualizzato,
                tipoGiornata: pianoArchiviazione.tipo,
                log: datiGiornalieri.log,
                isLogExpanded: index !== -1 ? storico[index].isLogExpanded : false,
                totali: {
                    proteine: datiGiornalieri.proteine,
                    calorie: datiGiornalieri.calorie,
                    workoutCalorie: datiGiornalieri.workoutCalorie,
                    mg: datiGiornalieri.mg,
                    k: datiGiornalieri.k,
                    vitc: datiGiornalieri.vitc,
                    ca: datiGiornalieri.ca
                },
                obiettivi: { prot: pianoArchiviazione.prot, cal: pianoArchiviazione.cal },
                allenamenti: datiGiornalieri.workoutLog,
                deficit: 0, // Puoi ricalcolarlo se necessario
                trend: 'ok' // Puoi ricalcolarlo se necessario
            };
            
            if (index !== -1) {
                storico[index] = recordAggiornato;
            } else {
                storico.push(recordAggiornato);
            }
            
            localStorage.setItem('trackerStorico', JSON.stringify(storico));
            alert(`Diario del ${giornoVisualizzato} aggiornato nello storico.`);
        }
    }
    
    function gestisciAvvioApp() {
        // Logica di archiviazione per il giorno *precedente* all'avvio
        const oggi = getTodayString('ymd');
        const giornoCorrenteSalvataggio = JSON.parse(localStorage.getItem('trackerGiornoCorrente'));
        if (giornoCorrenteSalvataggio && giornoCorrenteSalvataggio.data !== oggi && (giornoCorrenteSalvataggio.dati.calorie > 0 || giornoCorrenteSalvataggio.dati.workoutCalorie > 0)) {
            archiviaGiornoPrecedente(giornoCorrenteSalvataggio);
            localStorage.removeItem('trackerGiornoCorrente');
        }

        // Carica i dati del giorno corrente all'avvio
        caricaGiorno(oggi);
        
        // Carica gli altri dati non giornalieri
        const dbCibi = localStorage.getItem('trackerFoodDatabase');
        if (dbCibi) foodDatabase = JSON.parse(dbCibi);
        aggiornaDatalist();

        const pastoSalvato = localStorage.getItem('trackerPastoInCostruzione');
        if (pastoSalvato) pastoInCostruzione = JSON.parse(pastoSalvato);
        renderMealBuilder();
    }
    
    function aggiornaUI() {
        // Questa funzione ora aggiorna la UI basandosi sullo stato di `datiGiornalieri`
        // e `giornoVisualizzato`
        const dataVisualizzata = new Date(giornoVisualizzato);
        const pianoDelGiorno = PIANO_SETTIMANALE[dataVisualizzata.getDay()];
        titoloGiornataEl.textContent = `${pianoDelGiorno.tipo} - ${dataVisualizzata.toLocaleDateString('it-IT')}`;
        
        // Ricalcola i totali per sicurezza
        let totali = (datiGiornalieri.log || []).reduce((acc, entry) => {
            acc.proteine += entry.prot; acc.calorie += entry.cal;
            return acc;
        }, { proteine: 0, calorie: 0 });
        datiGiornalieri.proteine = totali.proteine;
        datiGiornalieri.calorie = totali.calorie;

        // ...tutto il resto della funzione `aggiornaUI` originale va qui...
        // Essa popolerà i campi con i valori di `datiGiornalieri`
    }

    // --- EVENT LISTENERS ---
    
    // Nuovo listener per il pulsante di caricamento
    btnCaricaGiorno.addEventListener('click', () => {
        const dataSelezionata = dataCaricamentoInput.value;
        if (dataSelezionata) {
            caricaGiorno(dataSelezionata);
        } else {
            alert("Per favore, seleziona una data.");
        }
    });

    // I listener esistenti ora chiamano `salvaGiornoAttuale`
    const btnAggiungiSingolo = document.getElementById('btn-aggiungi-singolo');
    btnAggiungiSingolo.addEventListener('click', () => {
        const item = creaAlimentoDaInput(true); 
        if (!item) return; 
        datiGiornalieri.log.push(item);
        salvaGiornoAttuale(); // <-- MODIFICA CHIAVE
        aggiornaUI();
        resetInputAlimento();
    });

    // (Applica la stessa modifica a tutti gli altri listener che modificano i dati)
    // Esempio: formAllenamento, btnSalvaPasto, ecc.

    // Il resto del tuo codice JS originale va qui
    // (creaAlimentoDaInput, renderMealBuilder, etc.)

    // Avvio iniziale
    gestisciAvvioApp();
});
</script>
</body>
</html>
