<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Nutrizionale - Cloud Sync</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; }
        .sezione { margin-bottom: 25px; padding: 20px; background-color: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
        button { background-color: #1976d2; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; transition: background-color 0.3s; }
        button:hover { background-color: #1565c0; }
        .nav-links { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-links a { flex-grow: 1; text-align: center; padding: 10px; background-color: #607d8b; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        #btn-archivia { width: 100%; margin-top: 20px; background-color: #c62828; font-weight: bold; }
        #sync-status { text-align:center; font-weight:bold; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tracker Nutrizionale</h1>
        <div class="nav-links"><a href="storico.html">📊 Storico</a></div>
        
        <div id="sync-config-sezione" class="sezione">
            <h2>Configurazione Sincronizzazione Cloud</h2>
            <p>Incolla qui la configurazione del tuo progetto Firebase per abilitare la sincronizzazione. Devi farlo solo una volta.</p>
            <textarea id="firebase-config-input" placeholder="Incolla qui l'intero oggetto firebaseConfig" rows="5"></textarea>
            <button id="btn-save-config">Salva e Attiva Sincronizzazione</button>
            <p id="sync-status"></p>
        </div>

        <div id="riepilogo" class="sezione">
            <h2>Riepilogo di Oggi (<span id="data-corrente-display"></span>)</h2>
            </div>

        <div id="food-adder" class="sezione">
            <h2>Aggiungi Alimento</h2>
            </div>

        <div class="sezione">
            <h2>Diario Giornaliero</h2>
            <table id="log-pasti">
                <thead><tr><th>Descrizione</th><th>Quantità</th><th>Prot</th><th>Kcal</th><th>Azione</th></tr></thead>
                <tbody id="log-body"></tbody>
            </table>
            <button id="btn-archivia">Archivia e Chiudi Giornata</button>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    let datiGiornalieri, foodDatabase, db;
    let dataListener; // Variabile per tenere traccia del listener di Firebase

    const getTodayString = () => new Date().toISOString().split('T')[0];

    // Funzione per salvare lo stato completo (sia in locale che su Firebase)
    function salvaStato() {
        const stato = {
            giornoCorrente: { data: getTodayString(), dati: datiGiornalieri },
            storico: JSON.parse(localStorage.getItem('trackerStorico')) || [],
            databaseAlimenti: foodDatabase
        };
        localStorage.setItem('giornoCorrente', JSON.stringify(stato.giornoCorrente));
        localStorage.setItem('storico', JSON.stringify(stato.storico));
        localStorage.setItem('databaseAlimenti', JSON.stringify(foodDatabase));
        
        if (db) {
            console.log("Salvataggio su Firebase...");
            db.ref('trackerData').set(stato);
        }
    }

    // Funzione per inizializzare Firebase
    function initFirebase() {
        const fbConfigString = localStorage.getItem('firebaseConfig');
        const syncStatusEl = document.getElementById('sync-status');
        
        if (fbConfigString) {
            try {
                const fbConfig = JSON.parse(fbConfigString);
                if (firebase.apps.length === 0) {
                    firebase.initializeApp(fbConfig);
                }
                db = firebase.database();
                syncStatusEl.textContent = "Sincronizzazione Attiva ✅";
                syncStatusEl.style.color = 'green';
                document.getElementById('sync-config-sezione').style.borderLeft = '5px solid green';

                // Rimuove il vecchio listener se esiste, per evitare duplicati
                if(dataListener) db.ref('trackerData').off('value', dataListener);
                
                // Imposta un nuovo listener per i dati dal cloud
                dataListener = db.ref('trackerData').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        console.log("Dati ricevuti da Firebase. Verifico se sono diversi...");
                        // Confronta i dati locali con quelli remoti per evitare ricaricamenti infiniti
                        const datiLocaliString = JSON.stringify({
                            giornoCorrente: JSON.parse(localStorage.getItem('giornoCorrente')),
                            storico: JSON.parse(localStorage.getItem('storico')),
                            databaseAlimenti: JSON.parse(localStorage.getItem('databaseAlimenti'))
                        });

                        if (JSON.stringify(data) !== datiLocaliString) {
                            console.log("Dati diversi, aggiorno e ricarico.");
                            localStorage.setItem('giornoCorrente', JSON.stringify(data.giornoCorrente));
                            localStorage.setItem('storico', JSON.stringify(data.storico));
                            localStorage.setItem('databaseAlimenti', JSON.stringify(data.databaseAlimenti));
                            location.reload();
                        }
                    }
                }, (error) => {
                    syncStatusEl.textContent = "Errore di connessione.";
                    syncStatusEl.style.color = 'red';
                });

            } catch(e) {
                syncStatusEl.textContent = "Configurazione non valida.";
                syncStatusEl.style.color = 'red';
            }
        } else {
            syncStatusEl.textContent = "Sincronizzazione non configurata.";
            syncStatusEl.style.color = 'orange';
        }
    }

    function initApp() {
        foodDatabase = JSON.parse(localStorage.getItem('databaseAlimenti')) || {};
        const giornoCorrenteData = JSON.parse(localStorage.getItem('giornoCorrente'));
        
        if (giornoCorrenteData && giornoCorrenteData.data === getTodayString()) {
            datiGiornalieri = giornoCorrenteData.dati;
        } else {
            // Se la data è cambiata, il giorno vecchio DEVE essere archiviato manualmente.
            // Si parte con un nuovo giorno pulito.
            datiGiornalieri = { log: [], workoutLog: [] };
        }
        aggiornaUI();
    }
    
    // ... (Inserisci qui tutte le altre funzioni come aggiornaUI, etc., che non cambiano)

    document.getElementById('btn-save-config').addEventListener('click', () => {
        const configText = document.getElementById('firebase-config-input').value;
        if (!configText) return alert("Incolla la configurazione.");
        try {
            const configObject = JSON.parse(configText.substring(configText.indexOf('{'), configText.lastIndexOf('}') + 1));
            localStorage.setItem('firebaseConfig', JSON.stringify(configObject));
            alert("Configurazione salvata! La pagina si ricaricherà.");
            location.reload();
        } catch (e) {
            alert("Errore nel formato della configurazione.");
        }
    });

    document.getElementById('btn-archivia').addEventListener('click', () => {
        const giornoCorrente = JSON.parse(localStorage.getItem('giornoCorrente'));
        if (!giornoCorrente || giornoCorrente.dati.log.length === 0) return alert("Nessun dato da archiviare.");
        
        if (confirm(`Sei sicuro di voler chiudere la giornata del ${giornoCorrente.data} e archiviarla?`)) {
            const storico = JSON.parse(localStorage.getItem('storico')) || [];
            
            // Logica per calcolare totali e deficit
            const totali = giornoCorrente.dati.log.reduce((acc, i) => { acc.p += i.prot; acc.c += i.cal; return acc; }, {p:0, c:0});
            // ... (altri calcoli)

            const nuovoRecord = {
                data: giornoCorrente.data,
                log: giornoCorrente.dati.log,
                totali: { proteine: totali.p, calorie: totali.c, /* ... */ },
                // ... (altri dati dello storico)
            };
            
            const nuovoStorico = storico.filter(item => item.data !== giornoCorrente.data);
            nuovoStorico.push(nuovoRecord);
            localStorage.setItem('storico', JSON.stringify(nuovoStorico));

            // Reset del giorno corrente
            datiGiornalieri = { log: [], workoutLog: [] };
            salvaStato();
            alert("Giornata archiviata con successo!");
            aggiornaUI();
        }
    });

    // Avvio
    initFirebase();
    initApp();
});
</script>
</body>
</html>
