<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Nutrizionale - v12 Definitivo</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; }
        h2 { font-size: 1.4em; margin-top: 30px; }
        h3 { font-size: 1.1em; color: #333; border-bottom: 1px solid #eee; margin-top: 20px; }
        #titolo-giornata { text-align: center; color: #d84315; font-weight: 600; margin-bottom: 20px; padding: 10px; background-color: #fff3e0; border-radius: 8px; border: 1px solid #ffe0b2;}
        .sezione { margin-bottom: 25px; padding: 20px; background-color: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; border-left-width: 5px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="text"], input[type="number"], input[type="date"], select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
        button { background-color: #1976d2; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: 600; transition: background-color 0.3s; }
        button:hover { background-color: #1565c0; }
        .btn-secondary { background-color: #546e7a; }
        .btn-secondary:hover { background-color: #37474f; }
        .nav-links { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-links a { flex-grow: 1; text-align: center; padding: 10px; background-color: #607d8b; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
        #riepilogo p { font-size: 1.1em; margin: 8px 0; }
        #riepilogo .valore-consumato { font-weight: 600; color: #1976d2; }
        progress { width: 100%; height: 15px; border-radius: 6px; margin-top: 2px; }
        progress.macro-progress { height: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; vertical-align: middle; }
        th { background-color: #f2f2f2; font-weight: 600; }
        .delete-btn { background: none; border: none; color: #c62828; font-size: 1.2em; cursor: pointer; padding: 5px; }
        .proiezione-ok { border-left-color: #4caf50; } .proiezione-attenzione { border-left-color: #ff9800; } .proiezione-pericolo { border-left-color: #f44336; } .proiezione-neutra { border-left-color: #9e9e9e; }
        .builder-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
        .adder-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        #meal-builder-panel { display: none; border: 2px solid #1976d2; padding: 20px; margin-top: 20px; border-radius: 8px; }
        #builder-residui { background-color: #e3f2fd; padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-weight: 500; }
        #builder-table { font-size: 0.9em; }
        #builder-table tfoot td { font-weight: bold; border-top: 2px solid #333; }
        #btn-registra-pasto { background-color: #d84315; margin-top:15px; width: 100%; }
        #btn-registra-pasto:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tracker Nutrizionale</h1>
        <h2 id="titolo-giornata"></h2>
        <div class="nav-links">
            <a href="storico.html">📊 Storico Giornaliero</a>
            <a href="confronto.html">📈 Confronto Mensile</a>
        </div>
        <div id="proiezione" class="sezione proiezione-neutra"><h2>Proiezione del Trend</h2><p id="testo-proiezione">Inizia a registrare i dati.</p></div>
        <div id="riepilogo" class="sezione"></div>
        
        <div id="food-adder" class="sezione">
            <h2>Aggiungi Alimento</h2>
            <div class="builder-grid">
                <div><label>Alimento</label><input type="text" id="builder-desc" list="food-database-list"></div>
                <div><label>Quantità (g)</label><input type="number" id="builder-qta" min="0"></div>
                <div><label>Proteine/100g</label><input type="number" id="builder-prot" min="0" step="0.1"></div>
                <div><label>Kcal/100g</label><input type="number" id="builder-kcal" min="0"></div>
            </div>
            <datalist id="food-database-list"></datalist>
            <div class="adder-actions">
                <button id="btn-costruisci-pasto" class="btn-secondary">Costruisci Pasto</button>
                <button id="btn-aggiungi-alimento">Aggiungi al Diario</button>
            </div>

            <div id="meal-builder-panel">
                <hr><h3>Costruttore Pasto</h3>
                <div id="builder-residui">
                    <span>Residui Giornata: </span>
                    <span id="builder-residui-cal"></span> kcal | 
                    <span id="builder-residui-prot"></span> g prot.
                </div>
                <label for="pasto-select">Nome del Pasto:</label>
                <input type="text" id="pasto-nome-builder" placeholder="es. Pranzo Completo">
                <table id="builder-table">
                    <thead><tr><th>Azione</th><th>Alimento</th><th>(g)</th><th>Prot</th><th>Kcal</th></tr></thead>
                    <tbody id="builder-log-body"></tbody>
                    <tfoot><tr><td colspan="2"><strong>TOTALE PASTO</strong></td><td></td><td><strong id="builder-total-prot">0</strong></td><td><strong id="builder-total-cal">0</strong></td></tr></tfoot>
                </table>
                <button id="btn-registra-pasto" disabled>Registra Pasto nel Diario</button>
            </div>
        </div>

        <div class="sezione"><h2>Registra Allenamento</h2></div>
        <div class="sezione"><h2>Diario Giornaliero</h2></div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // === SETUP HTML (per stabilità) ===
    document.getElementById('riepilogo').innerHTML = `<h2>Riepilogo di Oggi</h2><p>Proteine: <span id="totale-proteine" class="valore-consumato">0</span> / <span id="obiettivo-proteine"></span> g</p><progress id="progress-proteine" class="macro-progress" value="0"></progress><p>Calorie: <span id="totale-calorie" class="valore-consumato">0</span> / <span id="obiettivo-calorie"></span> kcal</p><progress id="progress-calorie" class="macro-progress" value="0"></progress><p>Workout: <span id="workout-calories-totali" class="valore-bruciato">0</span> kcal</p>`;
    document.querySelector('.sezione:nth-of-type(5)').innerHTML = `<h2>Registra Allenamento</h2><form id="form-allenamento"><input type="text" id="descrizione-allenamento" placeholder="Descrizione Allenamento"><input type="number" id="calorie-bruciate" min="0" required placeholder="Calorie Bruciate (kcal)"><button type="submit">Aggiungi Allenamento</button></form><table id="log-allenamenti"><thead><tr><th>Data</th><th>Descrizione</th><th>Calorie Bruciate</th><th>Azione</th></tr></thead><tbody id="log-allenamenti-body"></tbody></table>`;
    document.querySelector('.sezione:nth-of-type(6)').innerHTML = `<h2>Diario Giornaliero</h2><table id="log-pasti"><thead><tr><th>Descrizione</th><th>(g)</th><th>Prot</th><th>Kcal</th><th>Azione</th></tr></thead><tbody id="log-body"></tbody></table>`;
    
    // === PIANO E STATO GLOBALE ===
    const PIANO_SETTIMANALE = { 0: { tipo: '💧 Riposo (Deficit)', cal: 1700, prot: 110 }, 1: { tipo: '🔥 Forza', cal: 2400, prot: 140 }, 2: { tipo: '🔥 Forza', cal: 2400, prot: 140 }, 3: { tipo: '🔥 HIIT/Core', cal: 2400, prot: 140 }, 4: { tipo: '🔥 Forza', cal: 2400, prot: 140 }, 5: { tipo: '🔥 Forza', cal: 2400, prot: 140 }, 6: { tipo: '💧 Cardio LISS', cal: 1700, prot: 110 } };
    const pianoOggi = PIANO_SETTIMANALE[new Date().getDay()];
    const OBIETTIVI = { prot: pianoOggi.prot, cal: pianoOggi.cal };
    let datiGiornalieri = { proteine: 0, calorie: 0, log: [], workoutCalorie: 0, workoutLog: [] };
    let foodDatabase = {};
    let pastoInCostruzione = [];

    // === RIFERIMENTI DOM ===
    const titoloGiornataEl = document.getElementById('titolo-giornata');
    const proiezioneDiv = document.getElementById('proiezione'), testoProiezione = document.getElementById('testo-proiezione');
    const logBody = document.getElementById('log-body');
    const builderDesc = document.getElementById('builder-desc'), builderQta = document.getElementById('builder-qta');
    const builderProt = document.getElementById('builder-prot'), builderKcal = document.getElementById('builder-kcal');
    const btnAggiungiAlimento = document.getElementById('btn-aggiungi-alimento');
    const btnCostruisciPasto = document.getElementById('btn-costruisci-pasto');
    const mealBuilderPanel = document.getElementById('meal-builder-panel');
    const pastoNomeBuilder = document.getElementById('pasto-nome-builder');
    const builderLogBody = document.getElementById('builder-log-body');
    const btnRegistraPasto = document.getElementById('btn-registra-pasto');
    const builderResiduiCalEl = document.getElementById('builder-residui-cal');
    const builderResiduiProtEl = document.getElementById('builder-residui-prot');
    const builderTotalProtEl = document.getElementById('builder-total-prot');
    const builderTotalCalEl = document.getElementById('builder-total-cal');
    
    // === FUNZIONI ===
    function getTodayString(format = 'ymd') { /*...*/ }
    function salvaGiornoCorrente() { /*...*/ }
    function caricaFoodDatabase() { /*...*/ }
    function gestisciAvvioApp() { /*...*/ }
    function aggiornaUI() { /*...*/ }
    function aggiornaProiezione() { /*...*/ }
    
    // BUILDER FUNCTIONS
    function toggleMealBuilder() { const isVisible = mealBuilderPanel.style.display === 'block'; mealBuilderPanel.style.display = isVisible ? 'none' : 'block'; if (!isVisible) aggiornaIndicatoriBuilder(); }
    function aggiornaIndicatoriBuilder() { const residuoCal = OBIETTIVI.cal - datiGiornalieri.calorie; const residuoProt = OBIETTIVI.prot - datiGiornalieri.proteine; builderResiduiCalEl.textContent = residuoCal.toFixed(0); builderResiduiProtEl.textContent = residuoProt.toFixed(1); }
    function aggiungiIngrediente(isQuickAdd) {
        const desc = builderDesc.value.trim(); const qta = parseFloat(builderQta.value) || 0;
        if (!desc || qta <= 0) { alert('Inserisci nome e quantità.'); return; }
        const p100 = parseFloat(builderProt.value) || 0; const k100 = parseFloat(builderKcal.value) || 0;
        if (p100 > 0 || k100 > 0) { foodDatabase[desc.toLowerCase()] = { prot: p100, kcal: k100 }; localStorage.setItem('trackerFoodDatabase', JSON.stringify(foodDatabase)); document.getElementById('food-database-list').innerHTML = Object.keys(foodDatabase).map(name => `<option value="${name.charAt(0).toUpperCase() + name.slice(1)}"></option>`).join(''); }
        
        const alimento = { id: Date.now(), desc, qta, prot: (p100 / 100) * qta, cal: (k100 / 100) * qta };

        if (isQuickAdd) {
            datiGiornalieri.log.push(alimento);
            datiGiornalieri.proteine += alimento.prot;
            datiGiornalieri.calorie += alimento.cal;
            salvaGiornoCorrente();
            aggiornaUI();
        } else {
            pastoInCostruzione.push(alimento);
            aggiornaTabellaBuilder();
        }
        [builderDesc, builderQta, builderProt, builderKcal].forEach(el => el.value = '');
        builderDesc.focus();
    }
    function aggiornaTabellaBuilder() { let totalProt = 0, totalCal = 0; builderLogBody.innerHTML = ''; pastoInCostruzione.forEach(ing => { totalProt += ing.prot; totalCal += ing.cal; const riga = builderLogBody.insertRow(); riga.innerHTML = `<td><button class="delete-btn" data-builder-id="${ing.id}">&times;</button></td><td>${ing.desc}</td><td>${ing.qta}g</td><td>${ing.prot.toFixed(1)}</td><td>${ing.cal.toFixed(0)}</td>`; }); builderTotalProtEl.textContent = totalProt.toFixed(1); builderTotalCalEl.textContent = totalCal.toFixed(0); btnRegistraPasto.disabled = pastoInCostruzione.length === 0; }
    function rimuoviIngredienteBuilder(id) { pastoInCostruzione = pastoInCostruzione.filter(ing => ing.id !== id); aggiornaTabellaBuilder(); }
    function registraPastoCompleto() { if (pastoInCostruzione.length === 0) return; const nomePasto = pastoNomeBuilder.value.trim() || 'Pasto Composto'; const totaliPasto = pastoInCostruzione.reduce((acc, curr) => { acc.prot += curr.prot; acc.cal += curr.cal; acc.qta += curr.qta; return acc; }, { prot: 0, cal: 0, qta: 0 }); const itemLog = { desc: nomePasto, qta: totaliPasto.qta, prot: totaliPasto.prot, cal: totaliPasto.cal }; datiGiornalieri.log.push(itemLog); datiGiornalieri.proteine += totaliPasto.prot; datiGiornalieri.calorie += totaliPasto.cal; salvaGiornoCorrente(); aggiornaUI(); pastoInCostruzione = []; aggiornaTabellaBuilder(); toggleMealBuilder(); }

    // === EVENT LISTENERS ===
    btnCostruisciPasto.addEventListener('click', toggleMealBuilder);
    btnAggiungiAlimento.addEventListener('click', () => aggiungiIngrediente(true));
    document.getElementById('builder-table').addEventListener('click', (e) => { if (e.target.hasAttribute('data-builder-id')) rimuoviIngredienteBuilder(parseInt(e.target.dataset.builderId, 10)); });
    btnRegistraPasto.addEventListener('click', registraPastoCompleto);
    document.getElementById('food-adder').addEventListener('click', (e) => { if (e.target.id === 'btn-aggiungi-ingrediente' && mealBuilderPanel.style.display === 'block') aggiungiIngrediente(false); });
    
    // === INIZIALIZZAZIONE ===
    caricaFoodDatabase();
    gestisciAvvioApp();
});
</script>
</body>
</html>
