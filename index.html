<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    // --- STATO GLOBALE E COSTANTI ---
    let db;
    let isFirebaseReady = false;
    let listeners = {};
    const PIANO_SETTIMANALE = { 0: { tipo: '💧 Riposo (Deficit)', cal: 1700, prot: 110 }, 1: { tipo: '🔥 Forza (Mantenimento)', cal: 2400, prot: 140 }, 2: { tipo: '🔥 Forza (Mantenimento)', cal: 2400, prot: 140 }, 3: { tipo: '🔥 HIIT/Core (Mantenimento)', cal: 2400, prot: 140 }, 4: { tipo: '🔥 Forza (Mantenimento)', cal: 2400, prot: 140 }, 5: { tipo: '🔥 Forza (Mantenimento)', cal: 2400, prot: 140 }, 6: { tipo: '💧 Cardio LISS (Deficit)', cal: 1700, prot: 110 } };
    const pianoOggi = PIANO_SETTIMANALE[new Date().getDay()];
    const OBIETTIVI = { prot: pianoOggi.prot, cal: pianoOggi.cal, mg: 420, k: 3400, vitc: 90, ca: 1000 };
    const TDEE_BASE = 2311;
    const mealSequence = ['merenda1', 'pranzo', 'merenda2', 'cena'];
    
    // Variabili di stato che verranno popolate da Firebase
    let datiGiornalieri = { proteine: 0, calorie: 0, mg: 0, k: 0, vitc: 0, ca: 0, log: [], workoutCalorie: 0, workoutLog: [] };
    let foodDatabase = {};
    let pastoInCostruzione = [];

    // --- ELEMENTI DEL DOM ---
    const firebaseConfigTextarea = document.getElementById('firebase-config-json');
    const btnSaveConfig = document.getElementById('btn-save-config');
    const firebaseStatusDiv = document.getElementById('firebase-status');
    const appContentDiv = document.getElementById('app-content');
    const titoloGiornataEl = document.getElementById('titolo-giornata');
    const proiezioneDiv = document.getElementById('proiezione'), testoProiezione = document.getElementById('testo-proiezione');
    const formAllenamento = document.getElementById('form-allenamento');
    const spanTotaleProteine = document.getElementById('totale-proteine'), spanTotaleCalorie = document.getElementById('totale-calorie');
    const spanObiettivoProteine = document.getElementById('obiettivo-proteine'), spanObiettivoCalorie = document.getElementById('obiettivo-calorie');
    const spanTotaleMg = document.getElementById('totale-mg'), spanTotaleK = document.getElementById('totale-k'), spanTotaleVitC = document.getElementById('totale-vitc'), spanTotaleCa = document.getElementById('totale-ca');
    const progressProteine = document.getElementById('progress-proteine'), progressCalorie = document.getElementById('progress-calorie');
    const progressMg = document.getElementById('progress-mg'), progressK = document.getElementById('progress-k'), progressVitC = document.getElementById('progress-vitc'), progressCa = document.getElementById('progress-ca');
    const spanWorkoutCalories = document.getElementById('workout-calories-totali');
    const logBody = document.getElementById('log-body');
    const tabellaAllenamenti = document.getElementById('log-allenamenti'), logAllenamentiBody = document.getElementById('log-allenamenti-body');
    const builderDesc = document.getElementById('builder-desc'), builderQta = document.getElementById('builder-qta');
    const builderProt = document.getElementById('builder-prot'), builderKcal = document.getElementById('builder-kcal');
    const builderMg = document.getElementById('builder-mg'), builderK = document.getElementById('builder-k'), builderVitC = document.getElementById('builder-vitc'), builderCa = document.getElementById('builder-ca');
    const foodDatalist = document.getElementById('food-database-list');
    const btnCostruisciPasto = document.getElementById('btn-costruisci-pasto');
    const btnAggiungiSingolo = document.getElementById('btn-aggiungi-singolo');
    const mealBuilderSezione = document.getElementById('meal-builder-sezione');
    const mealTypeSelector = document.getElementById('meal-type-selector');
    const builderProtRestanti = document.getElementById('builder-prot-restanti'), builderCalRestanti = document.getElementById('builder-cal-restanti');
    const builderProgressProt = document.getElementById('builder-progress-prot'), builderProgressCal = document.getElementById('builder-progress-cal');
    const logPastoBuilderBody = document.getElementById('log-pasto-builder-body');
    const btnSalvaPasto = document.getElementById('btn-salva-pasto');
    const spanDeficitAttuale = document.getElementById('deficit-attuale');
    const divFeedbackDeficit = document.getElementById('feedback-deficit');

    // --- LOGICA DI INIZIALIZZAZIONE ---
    document.addEventListener('DOMContentLoaded', () => {
        const savedConfig = localStorage.getItem('firebaseConfig');
        if (savedConfig) {
            try {
                const config = JSON.parse(savedConfig);
                firebaseConfigTextarea.value = JSON.stringify(config, null, 2);
                initFirebase(config);
            } catch (e) { localStorage.removeItem('firebaseConfig'); }
        }
        btnSaveConfig.addEventListener('click', handleConnectClick);
    });

    function handleConnectClick() {
        const configString = firebaseConfigTextarea.value;
        if (!configString) { alert("Incolla la configurazione di Firebase."); return; }
        try {
            const config = JSON.parse(configString);
            initFirebase(config);
            localStorage.setItem('firebaseConfig', JSON.stringify(config));
        } catch (e) { updateFirebaseStatus(false, "Configurazione non valida."); }
    }

    function initFirebase(config) {
        try {
            const app = initializeApp(config);
            db = getDatabase(app);
            isFirebaseReady = true;
            updateFirebaseStatus(true, "Connesso a Firebase.");
            loadAllData();
            wireUpEventListeners();
        } catch (error) {
            isFirebaseReady = false;
            updateFirebaseStatus(false, `Errore: ${error.code}`);
        }
    }
    
    function updateFirebaseStatus(isConnected, message) {
        firebaseStatusDiv.textContent = message;
        firebaseStatusDiv.className = isConnected ? 'status-connected' : 'status-disconnected';
        appContentDiv.classList.toggle('disabled', !isConnected);
    }

    // --- GESTIONE DATI FIREBASE ---
    function loadAllData() {
        if (!isFirebaseReady) return;
        listenToData('foodDatabase', data => { foodDatabase = data || {}; aggiornaDatalist(); });
        listenToData('pastoInCostruzione', data => { pastoInCostruzione = data || []; renderMealBuilder(); });
        const oggi = getTodayString('ymd');
        listenToData(`giorni/${oggi}`, data => {
            datiGiornalieri = data || { proteine: 0, calorie: 0, mg: 0, k: 0, vitc: 0, ca: 0, log: [], workoutCalorie: 0, workoutLog: [] };
            aggiornaUI();
        });
    }

    function listenToData(path, callback) {
        if (!isFirebaseReady) return;
        if (listeners[path]) listeners[path]();
        listeners[path] = onValue(ref(db, path), snapshot => callback(snapshot.val()));
    }

    function saveData(path, data) {
        if (!isFirebaseReady) { alert("Connessione a Firebase non attiva."); return Promise.reject("Not connected"); }
        return set(ref(db, path), data).catch(error => console.error(`Errore salvataggio su ${path}:`, error));
    }

    // --- EVENT LISTENERS DELL'APP ---
    function wireUpEventListeners() {
        btnAggiungiSingolo.addEventListener('click', handleAggiungiSingolo);
        btnCostruisciPasto.addEventListener('click', handleCostruisciPasto);
        btnSalvaPasto.addEventListener('click', handleSalvaPasto);
        formAllenamento.addEventListener('submit', handleAllenamento);
        builderDesc.addEventListener('input', handleBuilderDescInput);
        document.body.addEventListener('click', handleBodyClick);
        logPastoBuilderBody.addEventListener('change', handleBuilderCheckboxChange);
    }

    // --- GESTORI DEGLI EVENTI (ACTIONS) ---
    function handleAggiungiSingolo() {
        const item = creaAlimentoDaInput(true);
        if (!item) return;
        const oggi = getTodayString('ymd');
        const percorso = `giorni/${oggi}`;
        get(ref(db, percorso)).then(snapshot => {
            const dati = snapshot.val() || JSON.parse(JSON.stringify(datiGiornalieri)); // Deep copy default
            if (!dati.log) dati.log = [];
            dati.log.push(item);
            saveData(percorso, dati);
        });
        resetInputAlimento();
    }
    
    function handleCostruisciPasto() {
        const item = creaAlimentoDaInput(false);
        if (!item) return;
        pastoInCostruzione.push(item);
        saveData('pastoInCostruzione', pastoInCostruzione);
        resetInputAlimento();
    }

    function handleSalvaPasto() {
        const alimentiSelezionati = pastoInCostruzione.filter(item => item.selezionato);
        if (alimentiSelezionati.length === 0) return alert("Nessun alimento selezionato.");
        
        const mealName = mealTypeSelector.options[mealTypeSelector.selectedIndex].text;
        const totaliPasto = alimentiSelezionati.reduce((acc, item) => {
            acc.prot += item.prot || 0; acc.cal += item.cal || 0; acc.mg += item.mg || 0;
            acc.k += item.k || 0; acc.vitc += item.vitc || 0; acc.ca += item.ca || 0;
            return acc;
        }, {prot: 0, cal: 0, mg: 0, k: 0, vitc: 0, ca: 0});

        const newMeal = { type: 'meal', desc: mealName, isExpanded: false, items: alimentiSelezionati, ...totaliPasto };
        
        const oggi = getTodayString('ymd');
        const percorso = `giorni/${oggi}`;
        get(ref(db, percorso)).then(snapshot => {
            const dati = snapshot.val() || JSON.parse(JSON.stringify(datiGiornalieri));
            if (!dati.log) dati.log = [];
            dati.log.push(newMeal);
            saveData(percorso, dati).then(() => {
                // Svuota il costruttore solo dopo aver salvato il pasto
                saveData('pastoInCostruzione', []);
            });
        });
    }

    function handleAllenamento(e) {
        e.preventDefault();
        const desc = document.getElementById('descrizione-allenamento').value || 'Allenamento';
        const cal = parseInt(document.getElementById('calorie-bruciate').value, 10);
        if (isNaN(cal) || cal <= 0) return;
        const oggi = getTodayString('ymd');
        const percorso = `giorni/${oggi}`;
        get(ref(db, percorso)).then(snapshot => {
            const dati = snapshot.val() || JSON.parse(JSON.stringify(datiGiornalieri));
            dati.workoutCalorie = (dati.workoutCalorie || 0) + cal;
            if (!dati.workoutLog) dati.workoutLog = [];
            dati.workoutLog.push({ data: oggi, desc, cal });
            saveData(percorso, dati);
        });
        e.target.reset();
    }

    function handleBuilderDescInput(e) {
        const foodName = e.target.value.toLowerCase();
        if (foodDatabase[foodName]) {
            const foodData = foodDatabase[foodName];
            builderProt.value = foodData.prot || ''; builderKcal.value = foodData.kcal || '';
            builderMg.value = foodData.mg || ''; builderK.value = foodData.k || '';
            builderVitC.value = foodData.vitc || ''; builderCa.value = foodData.ca || '';
        }
    }

    function handleBodyClick(e) {
        const target = e.target;
        if (target.classList.contains('delete-btn') && target.dataset.type) {
            handleDelete(target.dataset.type, parseInt(target.dataset.index, 10));
        }
        if (target.classList.contains('expand-arrow')) {
            handleExpand(parseInt(target.dataset.index, 10));
        }
    }

    function handleDelete(type, index) {
        if (!confirm('Cancellare la voce selezionata?')) return;
        if (type === 'builder') {
            pastoInCostruzione.splice(index, 1);
            saveData('pastoInCostruzione', pastoInCostruzione);
        } else if (type === 'pasto') {
            const oggi = getTodayString('ymd');
            datiGiornalieri.log.splice(index, 1);
            saveData(`giorni/${oggi}`, datiGiornalieri);
        } else if (type === 'allenamento') {
            const oggi = getTodayString('ymd');
            datiGiornalieri.workoutLog.splice(index, 1);
            saveData(`giorni/${oggi}`, datiGiornalieri);
        }
    }

    function handleExpand(index) {
        const entry = datiGiornalieri.log[index];
        if (entry && entry.type === 'meal') {
            entry.isExpanded = !entry.isExpanded;
            const oggi = getTodayString('ymd');
            saveData(`giorni/${oggi}`, datiGiornalieri);
        }
    }
    
    function handleBuilderCheckboxChange(e) {
        if (e.target.classList.contains('builder-item-checkbox')) {
            const index = parseInt(e.target.dataset.index, 10);
            if (pastoInCostruzione[index]) {
                pastoInCostruzione[index].selezionato = e.target.checked;
                saveData('pastoInCostruzione', pastoInCostruzione);
            }
        }
    }
    
    // --- FUNZIONI DI UTILITY E RENDERING (dallo script originale) ---
    function creaAlimentoDaInput(isSingle = false) {
        const desc = builderDesc.value.trim();
        const qta = parseFloat(builderQta.value) || 0;
        if (!desc || qta <= 0) { alert('Inserisci nome e quantità.'); return null; }

        const p100 = parseFloat(builderProt.value) || 0, k100 = parseFloat(builderKcal.value) || 0;
        const mg100 = parseFloat(builderMg.value) || 0, k100_mg = parseFloat(builderK.value) || 0;
        const vitc100 = parseFloat(builderVitC.value) || 0, ca100 = parseFloat(builderCa.value) || 0;

        // Salva/aggiorna nel database dei cibi se ci sono valori nutrizionali
        if (p100 > 0 || k100 > 0) {
            foodDatabase[desc.toLowerCase()] = { prot: p100, kcal: k100, mg: mg100, k: k100_mg, vitc: vitc100, ca: ca100 };
            saveData('foodDatabase', foodDatabase);
        }

        const foodItem = {
            desc, qta,
            prot: (p100 / 100) * qta,
            cal: Math.round((k100 / 100) * qta),
            mg: (mg100 / 100) * qta,
            k: (k100_mg / 100) * qta,
            vitc: (vitc100 / 100) * qta,
            ca: (ca100 / 100) * qta
        };
        if (!isSingle) foodItem.selezionato = true;
        else foodItem.type = 'single';
        return foodItem;
    }

    function resetInputAlimento() {
        [builderDesc, builderQta, builderProt, builderKcal, builderMg, builderK, builderVitC, builderCa].forEach(el => el.value = '');
        builderDesc.focus();
    }

    function getTodayString(format = 'ymd') {
        const today = new Date();
        if (format === 'ymd') return today.toISOString().split('T')[0];
        const day = String(today.getDate()).padStart(2, '0');
        const month = String(today.getMonth() + 1).padStart(2, '0');
        return `${day}/${month}`;
    }

    function aggiornaDatalist() {
        foodDatalist.innerHTML = '';
        for (const foodName in foodDatabase) {
            const option = document.createElement('option');
            option.value = foodName.charAt(0).toUpperCase() + foodName.slice(1);
            foodDatalist.appendChild(option);
        }
    }
    
    function aggiornaUI() {
        if (!isFirebaseReady) return; // Non fare nulla se non siamo connessi
        
        titoloGiornataEl.textContent = pianoOggi.tipo;
        // Ricostruisci i totali dai log per coerenza
        let totali = (datiGiornalieri.log || []).reduce((acc, entry) => {
            acc.proteine += entry.prot; acc.calorie += entry.cal;
            acc.mg += entry.mg || 0; acc.k += entry.k || 0;
            acc.vitc += entry.vitc || 0; acc.ca += entry.ca || 0;
            return acc;
        }, {proteine: 0, calorie: 0, mg: 0, k: 0, vitc: 0, ca: 0});
        
        datiGiornalieri.proteine = totali.proteine;
        datiGiornalieri.calorie = totali.calorie;
        // ...e così via per gli altri nutrienti

        // Aggiorna Riepilogo
        spanTotaleProteine.textContent = datiGiornalieri.proteine.toFixed(1);
        spanTotaleCalorie.textContent = datiGiornalieri.calorie.toFixed(0);
        spanWorkoutCalories.textContent = datiGiornalieri.workoutCalorie || 0;

        // Aggiorna Diario
        logBody.innerHTML = '';
        (datiGiornalieri.log || []).forEach((entry, index) => {
            const riga = logBody.insertRow();
            riga.innerHTML = `<td>${entry.desc}</td><td>${entry.qta}g</td><td>${entry.prot.toFixed(1)}</td><td>${entry.cal.toFixed(0)}</td><td>${(entry.mg || 0).toFixed(1)}</td><td>${(entry.k || 0).toFixed(0)}</td><td>${(entry.vitc || 0).toFixed(1)}</td><td>${(entry.ca || 0).toFixed(1)}</td><td><button class="delete-btn" data-type="pasto" data-index="${index}">&times;</button></td>`;
        });
        
        // ... Inserisci qui il resto completo della tua funzione `aggiornaUI` originale
    }

    function renderMealBuilder() {
        if (pastoInCostruzione.length === 0) {
            mealBuilderSezione.dataset.visible = 'false';
            return;
        }
        mealBuilderSezione.dataset.visible = 'true';
        
        // ... Inserisci qui il resto completo della tua funzione `renderMealBuilder` originale
        logPastoBuilderBody.innerHTML = '';
        pastoInCostruzione.forEach((item, index) => {
            const riga = logPastoBuilderBody.insertRow();
            const checkedAttr = item.selezionato ? 'checked' : '';
            riga.innerHTML = `<td><input type="checkbox" class="builder-item-checkbox" data-index="${index}" ${checkedAttr}></td><td>${item.desc}</td><td>${item.qta}g</td><td>${item.prot.toFixed(1)}</td><td>${item.cal.toFixed(0)}</td><td><button class="delete-btn" data-type="builder" data-index="${index}">&times;</button></td>`;
        });
    }
</script>
