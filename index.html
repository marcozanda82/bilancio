<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Nutrizionale Definitivo</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; }
        h2 { font-size: 1.4em; margin-top: 30px; }
        h3 { font-size: 1.1em; color: #333; border-bottom: 1px solid #eee; margin-top: 20px; }
        #titolo-giornata { text-align: center; color: #d84315; font-weight: 600; margin-bottom: 20px; padding: 10px; background-color: #fff3e0; border-radius: 8px; border: 1px solid #ffe0b2;}
        .sezione { margin-bottom: 25px; padding: 20px; background-color: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; border-left-width: 5px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="text"], input[type="number"], input[type="date"], select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
        button { background-color: #1976d2; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: 600; transition: background-color 0.3s; }
        button:hover { background-color: #1565c0; }
        .sync-button-container { text-align: right; margin-bottom: 15px; }
        .sync-button { display: inline-block; background-color: #ff8f00; color: white; padding: 10px 15px; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 0.9em; }
        progress { width: 100%; height: 15px; border-radius: 6px; margin-top: 2px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.8em; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; vertical-align: middle; }
        th { background-color: #f2f2f2; font-weight: 600; }
        .builder-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
        .button-group { display: flex; gap: 10px; margin-top: 15px; }
        #meal-builder-sezione[data-visible="false"] { display: none; }
        #btn-salva-pasto { background-color: #2e7d32; width: 100%; margin-top: 15px; }
        #caricamento-manuale { margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee; border-left-color: #673ab7;}
        #caricamento-manuale div { display: flex; gap: 10px; align-items: center; }
        #caricamento-manuale input { flex-grow: 1; margin-bottom: 0; }
        #caricamento-manuale button { flex-grow: 0; width: auto; margin-bottom: 0; background-color: #673ab7; }
        .action-buttons { display: flex; justify-content: center; align-items: center; gap: 8px; }
        .action-buttons button { background: none; border: none; padding: 4px; font-size: 1.3em; line-height: 1; cursor: pointer; }
        .edit-btn { color: #1976d2; }
        .delete-btn { color: #d32f2f; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sync-button-container">
            <a href="sync.html" class="sync-button">☁️ Sincronizza con il Cloud</a>
        </div>
        <h1>Tracker Nutrizionale</h1>
        <h2 id="titolo-giornata"></h2>
        
        <div id="riepilogo" class="sezione">
            <h2>Riepilogo del Giorno Selezionato</h2>
            <p>Proteine: <span id="totale-proteine">0</span> / <span id="obiettivo-proteine"></span> g</p>
            <progress id="progress-proteine" value="0"></progress>
            <p>Calorie: <span id="totale-calorie">0</span> / <span id="obiettivo-calorie"></span> kcal</p>
            <progress id="progress-calorie" value="0"></progress>
        </div>

        <div id="food-adder" class="sezione">
            <h2>Aggiungi Alimento</h2>
            <div class="builder-grid" style="grid-template-columns: 2fr 1fr; gap: 15px;">
                 <div><label>Alimento</label><input type="text" id="builder-desc" list="food-database-list"></div>
                 <div><label>Quantità (g)</label><input type="number" id="builder-qta" min="0"></div>
            </div>
             <details>
                <summary style="cursor:pointer; color: #555; margin-bottom:15px;">Valori Nutrizionali (per 100g)</summary>
                <div class="builder-grid" style="grid-template-columns: 1fr 1fr;">
                    <div><label>Proteine</label><input type="number" id="builder-prot" step="0.1"></div>
                    <div><label>Kcal</label><input type="number" id="builder-kcal" min="0"></div>
                </div>
            </details>
            <datalist id="food-database-list"></datalist>
            <button id="btn-aggiungi-singolo" style="width:100%; margin-top: 15px;">Aggiungi / Aggiorna Voce nel Diario</button>
        </div>

        <div class="sezione">
            <h2>Diario del Giorno Selezionato</h2>
            <table id="log-pasti">
                <thead><tr><th>Descrizione</th><th>(g)</th><th>Prot</th><th>Kcal</th><th>Azione</th></tr></thead>
                <tbody id="log-body"></tbody>
            </table>
            <div id="caricamento-manuale" class="sezione" style="padding:15px; margin-top:20px; border-width:1px;">
                <h3 style="margin:0 0 10px 0; font-size:1em;">Carica un Giorno dallo Storico</h3>
                <div>
                    <input type="date" id="data-caricamento">
                    <button id="btn-carica-giorno">Carica</button>
                </div>
            </div>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- STATO E COSTANTI ---
    let giornoVisualizzato = getTodayString();
    let datiGiornalieri = {};
    let foodDatabase = {};
    const PIANO_SETTIMANALE = { 0: { prot: 110, cal: 1700 }, 1: { prot: 140, cal: 2400 }, 2: { prot: 140, cal: 2400 }, 3: { prot: 140, cal: 2400 }, 4: { prot: 140, cal: 2400 }, 5: { prot: 140, cal: 2400 }, 6: { prot: 110, cal: 1700 }};

    // --- ELEMENTI DEL DOM ---
    const titoloGiornataEl = document.getElementById('titolo-giornata');
    const logBody = document.getElementById('log-body');
    const builderDesc = document.getElementById('builder-desc'), builderQta = document.getElementById('builder-qta');
    const builderProt = document.getElementById('builder-prot'), builderKcal = document.getElementById('builder-kcal');
    const foodDatalist = document.getElementById('food-database-list');
    const btnAggiungiSingolo = document.getElementById('btn-aggiungi-singolo');
    const btnCaricaGiorno = document.getElementById('btn-carica-giorno');
    const dataCaricamentoInput = document.getElementById('data-caricamento');
    const spanTotaleProteine = document.getElementById('totale-proteine'), spanTotaleCalorie = document.getElementById('totale-calorie');
    const spanObiettivoProteine = document.getElementById('obiettivo-proteine'), spanObiettivoCalorie = document.getElementById('obiettivo-calorie');
    const progressProteine = document.getElementById('progress-proteine'), progressCalorie = document.getElementById('progress-calorie');
    
    // --- FUNZIONI DI GESTIONE DATI ---
    function getTodayString() { return new Date().toISOString().split('T')[0]; }

    function salvaGiornoAttuale() {
        const oggi = getTodayString();
        // Aggiorna prima di salvare
        aggiornaUI();

        if (giornoVisualizzato === oggi) {
            localStorage.setItem('trackerGiornoCorrente', JSON.stringify({ data: giornoVisualizzato, dati: datiGiornalieri }));
        } else {
            // ** LOGICA DI SALVATAGGIO NELLO STORICO (COMPLETA) **
            const storico = JSON.parse(localStorage.getItem('trackerStorico')) || [];
            const index = storico.findIndex(item => item.data === giornoVisualizzato);
            const recordPerStorico = {
                data: giornoVisualizzato,
                totali: {
                    proteine: datiGiornalieri.proteine,
                    calorie: datiGiornalieri.calorie
                },
                log: datiGiornalieri.log
            };
            if (index > -1) {
                storico[index] = recordPerStorico; // Aggiorna record esistente
            } else {
                storico.push(recordPerStorico); // Aggiunge nuovo record
            }
            localStorage.setItem('trackerStorico', JSON.stringify(storico));
            alert(`Diario del ${giornoVisualizzato} salvato nello storico.`);
        }
    }

    function caricaGiorno(data) {
        giornoVisualizzato = data;
        dataCaricamentoInput.value = data;
        let datiTrovati = null;
        if (data === getTodayString()) {
            const salvataggio = JSON.parse(localStorage.getItem('trackerGiornoCorrente'));
            if (salvataggio) datiTrovati = salvataggio.dati;
        } else {
            const storico = JSON.parse(localStorage.getItem('trackerStorico')) || [];
            const recordStorico = storico.find(item => item.data === data);
            if (recordStorico) {
                datiTrovati = { ...recordStorico.totali, log: recordStorico.log || [] };
            }
        }
        datiGiornalieri = datiTrovati || { log: [], proteine: 0, calorie: 0 };
        aggiornaUI();
    }
    
    // ** LOGICA DI ARCHIVIAZIONE AUTOMATICA (COMPLETA) **
    function archiviaGiornoPrecedente(datiDaArchiviare) {
        if (!datiDaArchiviare || !datiDaArchiviare.dati || (datiDaArchiviare.dati.calorie === 0 && datiDaArchiviare.dati.proteine === 0)) return;

        const storico = JSON.parse(localStorage.getItem('trackerStorico')) || [];
        const index = storico.findIndex(item => item.data === datiDaArchiviare.data);
        const recordPerStorico = {
            data: datiDaArchiviare.data,
            totali: {
                proteine: datiDaArchiviare.dati.proteine,
                calorie: datiDaArchiviare.dati.calorie
            },
            log: datiDaArchiviare.dati.log
        };

        if (index > -1) {
            storico[index] = recordPerStorico;
        } else {
            storico.push(recordPerStorico);
        }
        localStorage.setItem('trackerStorico', JSON.stringify(storico));
        console.log(`Giorno ${datiDaArchiviare.data} archiviato.`);
    }
    
    function gestisciAvvioApp() {
        const oggi = getTodayString();
        const giornoCorrenteSalvataggio = JSON.parse(localStorage.getItem('trackerGiornoCorrente'));
        
        if (giornoCorrenteSalvataggio && giornoCorrenteSalvataggio.data !== oggi) {
            archiviaGiornoPrecedente(giornoCorrenteSalvataggio);
            localStorage.removeItem('trackerGiornoCorrente');
        }

        caricaGiorno(oggi);
        const dbSalvato = JSON.parse(localStorage.getItem('trackerFoodDatabase'));
        if (dbSalvato) foodDatabase = dbSalvato;
        aggiornaDatalist();
    }

    // --- FUNZIONE DI AGGIORNAMENTO UI ---
    function aggiornaUI() {
        const dataVisualizzata = new Date(giornoVisualizzato);
        const pianoDelGiorno = PIANO_SETTIMANALE[dataVisualizzata.getDay()] || PIANO_SETTIMANALE[1];
        titoloGiornataEl.textContent = `Diario del ${dataVisualizzata.toLocaleDateString('it-IT', {day: 'numeric', month: 'long', year: 'numeric'})}`;
        
        let totali = { proteine: 0, calorie: 0 };
        (datiGiornalieri.log || []).forEach(entry => {
            totali.proteine += entry.prot || 0;
            totali.calorie += entry.cal || 0;
        });

        datiGiornalieri.proteine = totali.proteine;
        datiGiornalieri.calorie = totali.calorie;

        spanObiettivoProteine.textContent = pianoDelGiorno.prot;
        spanObiettivoCalorie.textContent = pianoDelGiorno.cal;
        spanTotaleProteine.textContent = totali.proteine.toFixed(1);
        spanTotaleCalorie.textContent = totali.calorie.toFixed(0);
        progressProteine.max = pianoDelGiorno.prot;
        progressProteine.value = totali.proteine;
        progressCalorie.max = pianoDelGiorno.cal;
        progressCalorie.value = totali.calorie;

        logBody.innerHTML = ''; 
        (datiGiornalieri.log || []).forEach((entry, index) => {
            const riga = logBody.insertRow();
            riga.innerHTML = `<td>${entry.desc}</td><td>${entry.qta}g</td><td>${(entry.prot||0).toFixed(1)}</td><td>${(entry.cal||0).toFixed(0)}</td><td class="action-buttons"><button class="edit-btn" data-index="${index}">✏️</button><button class="delete-btn" data-index="${index}">&times;</button></td>`;
        });
    }
    
    function aggiornaDatalist() {
        foodDatalist.innerHTML = '';
        for (const foodName in foodDatabase) {
            const option = document.createElement('option');
            option.value = foodName;
            foodDatalist.appendChild(option);
        }
    }

    function creaAlimentoDaInput() {
        const desc = builderDesc.value.trim();
        const qta = parseFloat(builderQta.value);
        if (!desc || isNaN(qta) || qta <= 0) { alert('Inserisci nome e quantità validi.'); return null; }
        
        const p100 = parseFloat(builderProt.value) || 0;
        const k100 = parseFloat(builderKcal.value) || 0;

        if (p100 > 0 || k100 > 0) {
            foodDatabase[desc.toLowerCase()] = { prot: p100, kcal: k100 };
            localStorage.setItem('trackerFoodDatabase', JSON.stringify(foodDatabase));
            aggiornaDatalist();
        }
        return { desc, qta, prot: (p100 / 100) * qta, cal: (k100 / 100) * qta };
    }

    function resetInputAlimento() {
        builderDesc.value = ''; builderQta.value = ''; builderProt.value = ''; builderKcal.value = '';
        builderDesc.focus();
    }

    // --- EVENT LISTENERS ---
    btnAggiungiSingolo.addEventListener('click', () => {
        const item = creaAlimentoDaInput();
        if (item) {
            datiGiornalieri.log.push(item);
            salvaGiornoAttuale();
            resetInputAlimento();
        }
    });
    
    builderDesc.addEventListener('input', (e) => {
        const foodData = foodDatabase[e.target.value.toLowerCase()];
        if (foodData) {
            builderProt.value = foodData.prot || '';
            builderKcal.value = foodData.kcal || '';
        }
    });

    logBody.addEventListener('click', (e) => {
        const target = e.target;
        if (target.closest('.edit-btn')) {
            const index = parseInt(target.closest('.edit-btn').dataset.index, 10);
            const itemToEdit = datiGiornalieri.log[index];
            if (!itemToEdit || !confirm("Vuoi modificare questa voce?")) return;
            
            builderDesc.value = itemToEdit.desc;
            builderQta.value = itemToEdit.qta;
            
            const foodData = foodDatabase[itemToEdit.desc.toLowerCase()];
            if (foodData) {
                builderProt.value = foodData.prot || '';
                builderKcal.value = foodData.kcal || '';
            } else {
                builderProt.value = (itemToEdit.prot / itemToEdit.qta * 100).toFixed(1);
                builderKcal.value = (itemToEdit.cal / itemToEdit.qta * 100).toFixed(0);
            }

            datiGiornalieri.log.splice(index, 1);
            salvaGiornoAttuale();
            document.getElementById('food-adder').scrollIntoView({ behavior: 'smooth' });
        }
        else if (target.closest('.delete-btn')) {
            const index = parseInt(target.closest('.delete-btn').dataset.index, 10);
            if (confirm('Cancellare la voce?')) {
                datiGiornalieri.log.splice(index, 1);
                salvaGiornoAttuale();
            }
        }
    });

    btnCaricaGiorno.addEventListener('click', () => {
        if (dataCaricamentoInput.value) {
            caricaGiorno(dataCaricamentoInput.value);
        }
    });

    // AVVIO APPLICAZIONE
    gestisciAvvioApp();
});
</script>
</body>
</html>
