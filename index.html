<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Nutrizionale Definitivo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; }
        h2 { font-size: 1.4em; margin-top: 30px; }
        h3 { font-size: 1.1em; color: #333; border-bottom: 1px solid #eee; margin-top: 20px; }
        h4 { font-size: 1em; color: #1565c0; margin-top: 20px; margin-bottom: 10px; font-weight: 600; }
        #titolo-giornata { text-align: center; color: #d84315; font-weight: 600; margin-bottom: 20px; padding: 10px; background-color: #fff3e0; border-radius: 8px; border: 1px solid #ffe0b2;}
        .sezione { margin-bottom: 25px; padding: 20px; background-color: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; border-left-width: 5px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="text"], input[type="number"], input[type="date"], select, input[type="email"], input[type="password"], textarea {
            width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em;
        }
        input[readonly] { background-color: #f2f2f2; cursor: not-allowed; }
        button { background-color: #1976d2; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: 600; transition: background-color 0.3s; }
        button:hover { background-color: #1565c0; }
        button:disabled { background-color: #9e9e9e; cursor: not-allowed; }
        #form-allenamento button { background-color: #2e7d32; }
        .nav-links { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-links a { flex-grow: 1; text-align: center; padding: 10px; background-color: #607d8b; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
        #riepilogo p { font-size: 1.1em; margin: 8px 0; }
        progress { width: 100%; height: 15px; border-radius: 6px; margin-top: 2px; cursor: pointer; }
        progress.macro-progress { height: 25px; }
        table { border-collapse: collapse; margin-top: 15px; font-size: 0.9em; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; vertical-align: middle; }
        th { background-color: #f2f2f2; font-weight: 600; }
        .builder-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
        .button-group { display: flex; gap: 10px; margin-top: 15px; }
        .action-buttons { display: flex; justify-content: center; align-items: center; gap: 8px; }
        .action-buttons button { background: none; border: none; padding: 4px; font-size: 1.3em; line-height: 1; cursor: pointer; }
        .meal-group-row { background-color: #f0f4f8; font-weight: bold; }
        .expand-arrow { cursor: pointer; display: inline-block; width: 20px; text-align: center; }
        .sub-item-row td { padding-left: 25px !important; background-color: #fff; font-style: italic; color: #555; border-bottom: 1px dotted #ccc; }
        .sub-item-row td:last-child { visibility: hidden; }
        .nutrients-warning { color: #d32f2f !important; }
        .collapsible-header { cursor: pointer; padding: 10px 0; border-bottom: 1px solid #e0e0e0; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; color: #0d47a1; font-size: 1.4em; }
        .collapsible-header:hover { color: #1976d2; }
        .collapsible-header .arrow { font-size: 0.8em; transition: transform 0.3s ease; }
        .collapsible-content { display: none; overflow: hidden; transition: max-height 0.3s ease-out; max-height: 0; }
        .collapsible-content.expanded { display: block; max-height: 2000px; }
        .collapsible-header.expanded .arrow { transform: rotate(90deg); }
        #log-pasti th:nth-child(1), #log-pasti td:nth-child(1) {
            min-width: 150px; text-align: left; position: -webkit-sticky; position: sticky; left: 0; z-index: 2; border-right: 2px solid #e0e0e0;
        }
        #log-pasti th:first-child { background-color: #f8f9fa; }
        #log-pasti td:first-child { background-color: #ffffff; }
        #log-pasti .meal-group-row td:first-child { background-color: #f0f4f8; }
        #log-pasti .sub-item-row td:first-child { background-color: #ffffff; }
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.6); 
            animation-name: fadeIn; animation-duration: 0.4s;
        }
        .modal-content {
            background-color: #fefefe; margin: 8% auto; padding: 25px; border: 1px solid #888; width: 90%; max-width: 700px;
            border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); animation-name: slideIn; animation-duration: 0.4s;
        }
        .modal-close { color: #aaa; float: right; font-size: 28px; font-weight: bold; line-height: 1; }
        .modal-close:hover, .modal-close:focus { color: black; text-decoration: none; cursor: pointer; }
        @keyframes slideIn { from {margin-top: 5%; opacity: 0} to {margin-top: 8%; opacity: 1} }
        @keyframes fadeIn { from {opacity: 0} to {opacity: 1} }
        .protein-score { font-weight: bold; padding: 2px 6px; border-radius: 4px; color: white; font-size: 0.85em; text-align: center; }
        .protein-score.low { background-color: #d32f2f; }
        .protein-score.medium { background-color: #ff8f00; }
        .protein-score.high { background-color: #2e7d32; }

        /* --- STILI NUOVI E MODIFICATI PER RICETTE --- */
        .food-input-container { position: relative; display: flex; align-items: center; }
        .food-input-container input { padding-right: 40px; }
        #btn-edit-recipe {
            position: absolute; right: 5px; top: 50%; transform: translateY(-60%); background: none; border: none;
            font-size: 1.5em; cursor: pointer; color: #607d8b; padding: 5px; line-height: 1;
        }
        #btn-edit-recipe:hover { color: #1976d2; }
        #btn-edit-recipe.has-recipe { color: #4a148c; }
        .recipe-icon { cursor: pointer; color: #4a148c; margin-left: 8px; }
        #recipe-list-container { max-height: 250px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #eee; padding: 10px; border-radius: 6px; }
        .recipe-item-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .recipe-item-row .ingredient-name { flex-grow: 1; margin-bottom: 0; }
        .recipe-item-row .ingredient-percentage { width: 80px; text-align: center; margin-bottom: 0; }
        .recipe-item-row .remove-ingredient-btn { background-color: #d32f2f; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; line-height: 30px; text-align: center; padding: 0; cursor: pointer; font-weight: bold; }
        #percentage-total-container { text-align: right; font-weight: bold; font-size: 1.1em; margin-top: 10px; }
        #percentage-total.invalid { color: #d32f2f; }
        #percentage-total.valid { color: #2e7d32; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tracker Nutrizionale Marco</h1>
        
        <div id="auth-section" class="sezione">
             </div>

        <div id="main-tracker-content">
            <h2 id="titolo-giornata"></h2>
            <div class="nav-links">
                <a href="storico.html">📊 Storico</a>
                <a href="stima_grassi.html">🫙 Stima Grassi</a>
            </div>
            <div id="riepilogo" class="sezione">
                </div>

            <div id="form-allenamento" class="sezione">
                </div>
            
            <div id="food-adder" class="sezione">
                <div class="food-adder-header">
                    <h2>Aggiungi Alimento</h2>
                    <button id="btn-clear-nutrients" title="Cancella campi nutrienti">🗑️</button>
                </div>
                <div class="builder-grid">
                    <div>
                        <label>Alimento</label>
                        <div class="food-input-container">
                            <input type="text" id="builder-desc" list="food-database-list">
                            <button id="btn-edit-recipe" title="Gestisci ricetta per alimento complesso">
                                <i class="fas fa-receipt"></i>
                            </button>
                        </div>
                    </div>
                    <div><label>Quantità (g)</label><input type="text" id="builder-qta"></div>
                    <div><label>Proteine/100g</label><input type="number" id="builder-prot" step="0.1"></div>
                    <div><label>Kcal/100g</label><input type="number" id="builder-kcal" min="0"></div>
                    </div>
                <h2 class="collapsible-header" id="nutrients-header">
                    Dettagli Nutrizionali (Grassi, Micronutrienti, Amminoacidi) <span class="arrow">▶</span>
                </h2>
                <div class="collapsible-content" id="nutrients-content">
                    </div>
                <datalist id="food-database-list"></datalist>
                <div class="button-group">
                    <button id="btn-costruisci-pasto">Aggiungi a Pasto</button>
                    <button id="btn-aggiungi-singolo">Aggiungi al Diario</button>
                    <button id="btn-compila-ai" style="background-color: #0d47a1;">Compila AI</button>
                    <button id="btn-calculate-from-recipe" style="background-color: #4a148c; display: none;">Calcola da Ricetta</button>
                </div>
            </div>

            <div id="meal-builder-sezione" class="sezione" data-visible="false">
                </div>

            <div class="sezione">
                <h2>Diario Giornaliero</h2>
                <div class="diary-table-container">
                    <table id="log-pasti">
                        </table>
                </div>
                </div>

            </div>
    </div>
    
    <div id="recipe-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" data-modal="recipe-modal">&times;</span>
            <h2>Definisci Ricetta per <span id="recipe-modal-food-name" style="color: #1976d2;"></span></h2>
            <p style="font-size: 0.9em; color: #555;">
                Aggiungi gli ingredienti e le loro percentuali sul peso totale. La somma deve essere 100%.
            </p>
            <div id="recipe-list-container">
                </div>
            <button id="btn-add-ingredient-row" style="width: auto; padding: 8px 15px; font-size: 0.9em; background-color: #607d8b;">+ Aggiungi Ingrediente</button>
            
            <div id="percentage-total-container">
                Totale: <span id="percentage-total">0%</span>
            </div>

            <div class="button-group" style="justify-content: space-between; margin-top: 15px;">
                <button id="btn-suggest-recipe-ai" style="background-color: #0d47a1;">💡 Suggerisci Ricetta (AI)</button>
                <button id="btn-save-recipe" style="background-color: #2e7d32;" disabled>✅ Salva Ricetta</button>
            </div>
        </div>
    </div>
    
    <div id="ingredient-row-template" style="display: none;">
        <div class="recipe-item-row">
            <input type="text" class="ingredient-name" placeholder="Nome ingrediente" list="food-database-list">
            <input type="number" class="ingredient-percentage" min="0" max="100" placeholder="%">
            <button class="remove-ingredient-btn">&times;</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js" type="module"></script> 
    <script type="module">
        // Import Firebase (invariato)
        // ...

        // --- INIZIO SCRIPT MODIFICATO ---
        
        // ... Dichiarazioni costanti e variabili (in gran parte invariate) ...
        let ricettaInCostruzione = []; // NUOVA: Memorizza la ricetta in %

        // ... Costanti per gli elementi del DOM (aggiunte quelle nuove per la modale ricetta) ...
        const recipeModal = document.getElementById('recipe-modal');
        const btnEditRecipe = document.getElementById('btn-edit-recipe');
        const recipeModalFoodName = document.getElementById('recipe-modal-food-name');
        const recipeListContainer = document.getElementById('recipe-list-container');
        const btnAddIngredientRow = document.getElementById('btn-add-ingredient-row');
        const percentageTotalSpan = document.getElementById('percentage-total');
        const btnSuggestRecipeAi = document.getElementById('btn-suggest-recipe-ai');
        const btnSaveRecipe = document.getElementById('btn-save-recipe');
        const btnCalculateFromRecipe = document.getElementById('btn-calculate-from-recipe');

        // ... Funzioni principali (salvaGiorno, caricaGiorno, etc. invariate) ...

        function aggiornaUI() {
            // ... (logica di aggiornamento UI principale invariata) ...
            
            // Logica di rendering del diario modificata per mostrare l'icona della ricetta
            const renderRow = (item, isSubItem = false) => {
                // ... (logica di rendering riga esistente) ...
                
                let descHtml = item.desc;
                // NUOVA LOGICA PER MOSTRARE RICETTA
                if (item.ricetta && item.ricetta.length > 0) {
                    const recipeTooltip = item.ricetta.map(ing => `${ing.ingrediente}: ${ing.percentuale}%`).join('\n');
                    descHtml += ` <i class="fas fa-receipt recipe-icon" title="${recipeTooltip}"></i>`;
                }
                
                // ... (il resto della funzione di rendering riga) ...
            };
            
            // ... (il resto di aggiornaUI) ...
        }

        function creaAlimentoDaInput(isSingle = false) {
            // ... (logica esistente per desc e qta) ...

            const foodData = { lastQta: qta, desc: desc };
            const foodItem = { desc: desc.charAt(0).toUpperCase() + desc.slice(1), qta };
            
            // NUOVO: Aggiungo la ricetta se presente
            if (ricettaInCostruzione.length > 0) {
                foodData.ricetta = ricettaInCostruzione;
                foodItem.ricetta = ricettaInCostruzione;
            }

            // ... (tutta la logica esistente per calcolare i nutrienti dall'input form) ...
            // Questa parte resta, perché i valori sono già stati calcolati e inseriti nei campi
            // dalla nuova funzione `calcolaNutrientiDaRicetta`.

            return foodItem;
        }

        function resetInputAlimento() { 
            [builderDesc, builderQta, ...Object.values(inputFields)].forEach(el => {
                el.value = '';
                el.readOnly = false; // Rendi i campi di nuovo editabili
                el.style.backgroundColor = '#ffffff';
            }); 
            ricettaInCostruzione = [];
            btnEditRecipe.classList.remove('has-recipe');
            btnCalculateFromRecipe.style.display = 'none'; // Nascondi il pulsante di calcolo
            builderDesc.focus(); 
        }

        // --- NUOVE FUNZIONI PER LA GESTIONE DELLE RICETTE ---

        /**
         * Renderizza le righe degli ingredienti nella modale basandosi sull'array `ricettaInCostruzione`.
         */
        function renderRecipeRows() {
            recipeListContainer.innerHTML = '';
            let totalPercentage = 0;

            ricettaInCostruzione.forEach((item, index) => {
                const template = document.getElementById('ingredient-row-template').firstElementChild.cloneNode(true);
                const nameInput = template.querySelector('.ingredient-name');
                const percInput = template.querySelector('.ingredient-percentage');
                const removeBtn = template.querySelector('.remove-ingredient-btn');

                nameInput.value = item.ingrediente;
                percInput.value = item.percentuale > 0 ? item.percentuale : '';
                totalPercentage += parseFloat(item.percentuale) || 0;

                nameInput.dataset.index = index;
                percInput.dataset.index = index;
                removeBtn.dataset.index = index;

                recipeListContainer.appendChild(template);
            });

            percentageTotalSpan.textContent = `${totalPercentage.toFixed(1)}%`;
            percentageTotalSpan.className = totalPercentage === 100 ? 'valid' : 'invalid';
            btnSaveRecipe.disabled = totalPercentage !== 100;
        }

        /**
         * Calcola i nutrienti finali per 100g di un prodotto basandosi sulla sua ricetta.
         * @param {Array} ricetta - L'array con gli oggetti ingrediente/percentuale.
         * @returns {Object} Un oggetto con tutti i nutrienti calcolati.
         * @throws {Error} Se un ingrediente non è presente nel foodDatabase.
         */
        function calcolaNutrientiDaRicetta(ricetta) {
            const tuttiNutrienti = Object.keys(inputFields);
            const nutrientiFinali = {};
            tuttiNutrienti.forEach(key => nutrientiFinali[key] = 0);

            for (const item of ricetta) {
                const sanitizedKey = sanitizeFirebaseKey(item.ingrediente.toLowerCase());
                const ingredienteData = foodDatabase[sanitizedKey];

                if (!ingredienteData) {
                    throw new Error(`Ingrediente "${item.ingrediente}" non trovato nel database. Aggiungilo prima di poterlo usare in una ricetta.`);
                }
                
                const percentuale = parseFloat(item.percentuale);
                if (isNaN(percentuale) || percentuale <= 0) continue;

                for (const key of tuttiNutrienti) {
                    const valorePer100g = parseFloat(ingredienteData[key]) || 0;
                    const contributo = (valorePer100g / 100) * percentuale;
                    nutrientiFinali[key] += contributo;
                }
            }
            return nutrientiFinali;
        }

        document.addEventListener('DOMContentLoaded', () => {
            // ... (tutto il codice esistente in DOMContentLoaded) ...

            // --- NUOVI EVENT LISTENER PER LA MODALE RICETTA ---

            btnEditRecipe.addEventListener('click', () => {
                const foodName = builderDesc.value.trim();
                if (!foodName) {
                    alert("Inserisci prima il nome dell'alimento complesso.");
                    return;
                }
                recipeModalFoodName.textContent = foodName;
                renderRecipeRows();
                recipeModal.style.display = 'block';
            });

            btnAddIngredientRow.addEventListener('click', () => {
                ricettaInCostruzione.push({ ingrediente: '', percentuale: 0 });
                renderRecipeRows();
            });
            
            recipeListContainer.addEventListener('input', (e) => {
                const index = parseInt(e.target.dataset.index, 10);
                if (e.target.classList.contains('ingredient-name')) {
                    ricettaInCostruzione[index].ingrediente = e.target.value;
                }
                if (e.target.classList.contains('ingredient-percentage')) {
                    ricettaInCostruzione[index].percentuale = parseFloat(e.target.value) || 0;
                }
                renderRecipeRows(); // Ricalcola il totale ad ogni input
            });

            recipeListContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('remove-ingredient-btn')) {
                    const index = parseInt(e.target.dataset.index, 10);
                    ricettaInCostruzione.splice(index, 1);
                    renderRecipeRows();
                }
            });

            btnSaveRecipe.addEventListener('click', () => {
                btnEditRecipe.classList.add('has-recipe');
                btnCalculateFromRecipe.style.display = 'inline-block';
                recipeModal.style.display = 'none';
            });

            btnCalculateFromRecipe.addEventListener('click', () => {
                try {
                    const nutrientiCalcolati = calcolaNutrientiDaRicetta(ricettaInCostruzione);
                    Object.keys(nutrientiCalcolati).forEach(key => {
                        if (inputFields[key]) {
                            // Arrotonda i valori in modo appropriato
                            const value = nutrientiCalcolati[key];
                            let formattedValue;
                            if (['kcal', 'k', 'p', 'leu', 'iso', 'val', 'lys', 'met', 'phe', 'thr', 'trp', 'his'].includes(key)) {
                                formattedValue = value.toFixed(0);
                            } else if (['cu', 'b2', 'b6'].includes(key)) {
                                formattedValue = value.toFixed(2);
                            } else {
                                formattedValue = value.toFixed(1);
                            }
                            inputFields[key].value = formattedValue;
                            inputFields[key].readOnly = true;
                            inputFields[key].style.backgroundColor = '#e0e0e0';
                        }
                    });
                    alert("Valori nutrizionali calcolati e compilati con successo!");
                } catch (error) {
                    alert(error.message);
                }
            });
            
            btnSuggestRecipeAi.addEventListener('click', async (e) => {
                const foodName = builderDesc.value.trim();
                const button = e.target;
                button.disabled = true; button.textContent = 'Penso...';
                try {
                    const promptText = `Fornisci una ricetta tipica in percentuali per "${foodName}". Rispondi ESATTAMENTE e SOLO con un array di oggetti JSON nel formato [{"ingrediente": "nome", "percentuale": valore}]. La somma delle percentuali deve fare 100. Non aggiungere altro testo.`;
                    const res = await fetch(GEMINI_ENDPOINT, { /* ...chiamata API... */ });
                    if (!res.ok) throw new Error(`Errore AI: ${res.statusText}`);
                    const data = await res.json();
                    const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                    const recipeArray = JSON.parse(raw.replace(/```json|```/g, '').trim());
                    ricettaInCostruzione = recipeArray;
                    renderRecipeRows();
                } catch(err) {
                    alert("Errore suggerimento ricetta: " + err);
                } finally {
                    button.disabled = false; button.textContent = '💡 Suggerisci Ricetta (AI)';
                }
            });

            // Modifica al listener dell'input 'builder-desc'
            builderDesc.addEventListener('input', (e) => {
                resetInputAlimento(); // Resetta tutto quando si inizia a scrivere
                const sanitizedKey = sanitizeFirebaseKey(e.target.value.trim().toLowerCase());
                const foodData = foodDatabase[sanitizedKey]; 
                if (foodData) {
                    builderQta.value = foodData.lastQta ?? '';
                    // Se l'alimento ha una ricetta, la carichiamo e mostriamo il pulsante
                    if (foodData.ricetta && foodData.ricetta.length > 0) {
                        ricettaInCostruzione = foodData.ricetta;
                        btnEditRecipe.classList.add('has-recipe');
                        btnCalculateFromRecipe.style.display = 'inline-block';
                    } else {
                        // Altrimenti, carichiamo i valori manuali
                         for(const key in inputFields) {
                            if (inputFields[key]) inputFields[key].value = foodData[key] ?? '';
                        }
                    }
                }
                aggiornaColoreNutrienti();
            });

        });
        // --- FINE SCRIPT MODIFICATO ---
    </script>
</body>
</html>
