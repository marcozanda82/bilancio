<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Nutrizionale - Versione Stabile</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; }
        h2 { font-size: 1.4em; margin-top: 30px; }
        h3 { font-size: 1.1em; color: #333; border-bottom: 1px solid #eee; margin-top: 20px; }
        #titolo-giornata { text-align: center; color: #d84315; font-weight: 600; margin-bottom: 20px; padding: 10px; background-color: #fff3e0; border-radius: 8px; border: 1px solid #ffe0b2;}
        .sezione { margin-bottom: 25px; padding: 20px; background-color: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; border-left-width: 5px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="text"], input[type="number"], input[type="date"], select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
        input[type="checkbox"] { transform: scale(1.2); cursor: pointer; }
        button { background-color: #1976d2; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: 600; transition: background-color 0.3s; }
        button:hover { background-color: #1565c0; }
        #form-allenamento button { background-color: #2e7d32; }
        #form-allenamento button:hover { background-color: #1b5e20; }
        .nav-links { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-links a { flex-grow: 1; text-align: center; padding: 10px; background-color: #607d8b; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
        #riepilogo p { font-size: 1.1em; margin: 8px 0; }
        #riepilogo .valore-consumato { font-weight: 600; color: #1976d2; }
        #riepilogo .valore-bruciato { font-weight: 600; color: #2e7d32; }
        #riepilogo .valore-deficit { font-weight: 600; color: #0d47a1; }
        progress { width: 100%; height: 15px; border-radius: 6px; margin-top: 2px; }
        progress.macro-progress { height: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.8em; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; vertical-align: middle; }
        th { background-color: #f2f2f2; font-weight: 600; }
        td:first-child, th:first-child { text-align: center; }
        .delete-btn { background-color: transparent; border: none; color: #d32f2f; font-size: 1.3em; font-weight: bold; cursor: pointer; padding: 0 8px; border-radius: 50%; line-height: 1; }
        .delete-btn:hover { background-color: #ffebee; color: #b71c1c; }
        .builder-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
        .button-group { display: flex; gap: 10px; margin-top: 15px; }
        .button-group button { flex-grow: 1; }
        #btn-costruisci-pasto { background-color: #ff8f00; }
        #btn-aggiungi-singolo { background-color: #5c6bc0; }
        #meal-builder-sezione[data-visible="false"] { display: none; }
        .builder-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        #btn-salva-pasto { background-color: #2e7d32; width: 100%; margin-top: 15px; }
        .meal-group-row { background-color: #f0f4f8; font-weight: bold; }
        .expand-arrow { cursor: pointer; display: inline-block; width: 20px; text-align: center; }
        .sub-item-row td { padding-left: 25px !important; background-color: #fff; font-style: italic; color: #555; border-bottom: 1px dotted #ccc; }
        #btn-archivia { width: 100%; margin-top: 20px; background-color: #c62828; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tracker Nutrizionale</h1>
        <h2 id="titolo-giornata"></h2>
        <div class="nav-links"><a href="storico.html">📊 Storico Giornaliero</a><a href="confronto.html">📈 Confronto Mensile</a></div>
        
        <div id="riepilogo" class="sezione">
             <h2>Riepilogo di Oggi</h2>
            <p>Proteine: <span id="totale-proteine" class="valore-consumato">0</span> / <span id="obiettivo-proteine"></span> g</p>
            <progress id="progress-proteine" class="macro-progress" value="0"></progress>
            <p>Calorie: <span id="totale-calorie" class="valore-consumato">0</span> / <span id="obiettivo-calorie"></span> kcal</p>
            <progress id="progress-calorie" class="macro-progress" value="0"></progress>
            <p>Workout: <span id="workout-calories-totali" class="valore-bruciato">0</span> kcal</p>
        </div>

        <div id="food-adder" class="sezione">
            <h2>Aggiungi Alimento</h2>
            <div class="builder-grid">
                <div><label>Alimento</label><input type="text" id="builder-desc" list="food-database-list"></div>
                <div><label>Quantità (g)</label><input type="number" id="builder-qta" min="0"></div>
                <div><label>Proteine/100g</label><input type="number" id="builder-prot" min="0" step="0.1"></div>
                <div><label>Kcal/100g</label><input type="number" id="builder-kcal" min="0"></div>
                <div><label>Magnesio (mg)/100g</label><input type="number" id="builder-mg" min="0"></div>
                <div><label>Potassio (mg)/100g</label><input type="number" id="builder-k" min="0"></div>
                <div><label>Vit. C (mg)/100g</label><input type="number" id="builder-vitc" min="0"></div>
                <div><label>Calcio (mg)/100g</label><input type="number" id="builder-ca" min="0"></div>
            </div>
            <datalist id="food-database-list"></datalist>
            <div class="button-group">
                <button id="btn-costruisci-pasto">Costruisci Pasto</button>
                <button id="btn-aggiungi-singolo">Aggiungi al Diario</button>
            </div>
        </div>
        
        <div class="sezione">
            <h2>Diario Giornaliero</h2>
            <table id="log-pasti"><thead><tr><th>Descrizione</th><th>(g)</th><th>Prot</th><th>Kcal</th><th>Mg</th><th>K</th><th>Vit.C</th><th>Ca</th><th>Azione</th></tr></thead><tbody id="log-body"></tbody></table>
            <button id="btn-archivia">Archivia e Chiudi Giornata</button>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const PIANO_SETTIMANALE = { 0:{t:'💧R', p:110,c:1700}, 1:{t:'🔥F', p:140,c:2400}, 2:{t:'🔥F', p:140,c:2400}, 3:{t:'🔥H', p:140,c:2400}, 4:{t:'🔥F', p:140,c:2400}, 5:{t:'🔥F', p:140,c:2400}, 6:{t:'💧C', p:110,c:1700} };
    let datiGiornalieri, foodDatabase;

    const dom = {};
    ['titolo-giornata', 'totale-proteine', 'obiettivo-proteine', 'progress-proteine', 'totale-calorie', 'obiettivo-calorie', 'progress-calorie', 'workout-calories-totali', 'builder-desc', 'builder-qta', 'builder-prot', 'builder-kcal', 'builder-mg', 'builder-k', 'builder-vitc', 'builder-ca', 'food-database-list', 'log-body', 'btn-aggiungi-singolo', 'btn-archivia'].forEach(id => dom[id.replace(/-/g,'_')] = document.getElementById(id));
    
    // Funzione robusta per creare una data, evita problemi cross-browser
    function parseDate(dateString) {
        const parts = dateString.split('-');
        return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    const getTodayString = () => new Date().toISOString().split('T')[0];

    function salvaStato() {
        localStorage.setItem('trackerGiornoCorrente', JSON.stringify({ data: getTodayString(), dati: datiGiornalieri }));
        localStorage.setItem('trackerFoodDatabase', JSON.stringify(foodDatabase));
    }

    function aggiornaUI() {
        const dataCorrente = (JSON.parse(localStorage.getItem('trackerGiornoCorrente')) || {data: getTodayString()}).data;
        const dataAttuale = parseDate(dataCorrente);
        const pianoOggi = PIANO_SETTIMANALE[dataAttuale.getDay()];
        
        dom.titolo_giornata.textContent = pianoOggi.t;
        dom.obiettivo_proteine.textContent = pianoOggi.p;
        dom.obiettivo_calorie.textContent = pianoOggi.c;
        dom.progress_proteine.max = pianoOggi.p;
        dom.progress_calorie.max = pianoOggi.c;
        
        const totali = (datiGiornalieri.log || []).reduce((acc, item) => {
            acc.proteine += item.prot || 0;
            acc.calorie += item.cal || 0;
            return acc;
        }, { proteine: 0, calorie: 0 });
        
        dom.totale_proteine.textContent = totali.proteine.toFixed(1);
        dom.progress_proteine.value = totali.proteine;
        dom.totale_calorie.textContent = totali.calorie.toFixed(0);
        dom.progress_calorie.value = totali.calorie;
        
        dom.log_body.innerHTML = '';
        (datiGiornalieri.log || []).forEach((item, index) => {
            const riga = dom.log_body.insertRow();
            riga.innerHTML = `<td>${item.desc}</td><td>${item.qta}g</td><td>${item.prot.toFixed(1)}</td><td>${item.cal.toFixed(0)}</td><td>${(item.mg || 0).toFixed(1)}</td><td>${(item.k || 0).toFixed(0)}</td><td>${(item.vitc || 0).toFixed(1)}</td><td>${(item.ca || 0).toFixed(1)}</td><td><button class="delete-btn" data-index="${index}">&times;</button></td>`;
        });
        
        dom.food_database_list.innerHTML = Object.keys(foodDatabase).map(key => `<option value="${key.charAt(0).toUpperCase() + key.slice(1)}">`).join('');
    }

    function initApp() {
        foodDatabase = JSON.parse(localStorage.getItem('trackerFoodDatabase')) || {};
        const giornoCorrenteData = JSON.parse(localStorage.getItem('trackerGiornoCorrente'));

        if (giornoCorrenteData && giornoCorrenteData.data === getTodayString()) {
            datiGiornalieri = giornoCorrenteData.dati;
        } else {
            datiGiornalieri = { log: [], workoutLog: [] };
            if(giornoCorrenteData) {
                 alert(`Dati del giorno precedente (${new Date(giornoCorrenteData.data).toLocaleDateString()}) non archiviati. Ricorda di farlo se necessario.`);
            }
        }
        aggiornaUI();
    }

    dom.btn_aggiungi_singolo.addEventListener('click', () => {
        const desc = dom.builder_desc.value.trim();
        const qta = parseFloat(dom.builder_qta.value) || 0;
        if (!desc || qta <= 0) return alert('Inserisci nome e quantità.');

        const p100 = parseFloat(dom.builder_prot.value) || 0, k100 = parseFloat(dom.builder_kcal.value) || 0;
        const mg100 = parseFloat(dom.builder_mg.value) || 0, k100_mg = parseFloat(dom.builder_k.value) || 0;
        const vitc100 = parseFloat(dom.builder_vitc.value) || 0, ca100 = parseFloat(dom.builder_ca.value) || 0;
        
        datiGiornalieri.log.push({
            desc, qta,
            prot: (p100 / 100) * qta,
            cal: Math.round((k100 / 100) * qta),
            mg: (mg100 / 100) * qta,
            k: (k100_mg / 100) * qta,
            vitc: (vitc100 / 100) * qta,
            ca: (ca100 / 100) * qta
        });
        
        if (p100 > 0 || k100 > 0) {
            foodDatabase[desc.toLowerCase()] = { prot: p100, kcal: k100, mg: mg100, k: k100_mg, vitc: vitc100, ca: ca100 };
        }
        
        salvaStato();
        aggiornaUI();
        ['builder_desc', 'builder_qta', 'builder_prot', 'builder_kcal', 'builder_mg', 'builder_k', 'builder_vitc', 'builder_ca'].forEach(id => dom[id].value = '');
    });

    dom.builder_desc.addEventListener('input', (e) => {
        const foodData = foodDatabase[e.target.value.toLowerCase()];
        if (foodData) {
            ['prot', 'kcal', 'mg', 'k', 'vitc', 'ca'].forEach(key => {
                if(dom[`builder_${key}`]) dom[`builder_${key}`].value = foodData[key] || '';
            });
        }
    });

    document.querySelector('.container').addEventListener('click', (e) => {
        if (e.target.classList.contains('delete-btn')) {
            const index = parseInt(e.target.dataset.index, 10);
            datiGiornalieri.log.splice(index, 1);
            salvaStato();
            aggiornaUI();
        }
    });
    
    dom.btn_archivia.addEventListener('click', () => {
        const giornoCorrente = JSON.parse(localStorage.getItem('trackerGiornoCorrente'));
        if (!giornoCorrente || (giornoCorrente.dati.log || []).length === 0) return alert("Nessun dato da archiviare.");
        if (!confirm(`Sei sicuro di voler chiudere e archiviare la giornata del ${new Date(giornoCorrente.data).toLocaleDateString()}?`)) return;

        const storico = JSON.parse(localStorage.getItem('trackerStorico')) || [];
        const nuovoStorico = storico.filter(item => item.data !== giornoCorrente.data);

        nuovoStorico.push({
            data: giornoCorrente.data,
            // ... (altri dati da salvare nello storico)
        });
        
        localStorage.setItem('trackerStorico', JSON.stringify(nuovoStorico));
        
        datiGiornalieri = { log: [], workoutLog: [] };
        salvaStato();
        
        alert(`Giornata del ${giornoCorrente.data} archiviata!`);
        aggiornaUI();
    });

    initApp();
});
</script>
</body>
</html>
