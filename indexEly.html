<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi al Tracker di Elisa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #880e4f; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; text-align: left; }
        input[type="email"], input[type="password"] {
            width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em;
        }
        .auth-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .auth-buttons button { background-color: #ec407a; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: 600; transition: background-color 0.3s; }
        .auth-buttons button:hover { background-color: #d81b60; }
        .auth-buttons button:last-child { background-color: #4db6ac; }
        .auth-buttons button:last-child:hover { background-color: #00897b; }
        #auth-status { margin-top: 15px; font-weight: 600; color: #d32f2f; }
        #app-name { color: #ad1457; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Accedi a <span id="app-name">Tracker Elisa</span></h1>
        
        <label for="user-email">Email</label>
        <input type="email" id="user-email">
        <label for="user-password">Password</label>
        <input type="password" id="user-password">
        
        <div class="auth-buttons">
            <button id="btn-login">Accedi</button>
            <button id="btn-register">Registrati</button>
            <button id="btn-google-login">Accedi con Google</button>
        </div>
        
        <p id="auth-status"></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js" type="module"></script> 
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

        // CONFIGURAZIONE FIREBASE
        const firebaseConfig = {
          apiKey: "AIzaSyA5pSzpfq1aGZ1wjNV5-eXnIqWL6brl424",
          authDomain: "mio-tracker.firebaseapp.com",
          databaseURL: "https://mio-tracker-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "mio-tracker",
          storageBucket: "mio-tracker.firebasestorage.app",
          messagingSenderId: "382993217593",
          appId: "1:382993217593:web:f0780aa061c23f9503f5e8"
        };
        
        let db; 
        let auth; 
        let firebaseApp; 

        try {
            if (!getApps().some(app => app.name === "globalTrackerApp")) {
                firebaseApp = initializeApp(firebaseConfig, "globalTrackerApp");
            } else {
                firebaseApp = getApp("globalTrackerApp");
            }
            db = getDatabase(firebaseApp);
            auth = getAuth(firebaseApp);
            console.log("Firebase inizializzato per la pagina di login.");
        } catch (error) {
            console.error("Errore durante l'inizializzazione di Firebase:", error);
            document.getElementById('auth-status').textContent = `Errore Firebase: ${error.message}`;
        }

        const userEmailInput = document.getElementById('user-email');
        const userPasswordInput = document.getElementById('user-password');
        const btnRegister = document.getElementById('btn-register');
        const btnLogin = document.getElementById('btn-login');
        const btnGoogleLogin = document.getElementById('btn-google-login');
        const authStatusP = document.getElementById('auth-status');
        const googleProvider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Se l'utente è autenticato, reindirizzalo alla pagina principale del tracker
                window.location.href = "indexEly.html";
            }
        });

        async function handleRegister() {
            const email = userEmailInput.value.trim();
            const password = userPasswordInput.value.trim();
            if (!email || !password) {
                alert("Inserisci email e password per registrarti.");
                return;
            }
            try {
                authStatusP.textContent = "Registrazione in corso...";
                await createUserWithEmailAndPassword(auth, email, password);
                authStatusP.textContent = "Registrazione completata, reindirizzamento...";
                window.location.href = "indexEly.html";
            } catch (error) {
                authStatusP.textContent = `Errore di registrazione: ${error.message}`;
                console.error("Registration error:", error);
            }
        }

        async function handleLogin() {
            const email = userEmailInput.value.trim();
            const password = userPasswordInput.value.trim();
            if (!email || !password) {
                alert("Inserisci email e password per accedere.");
                return;
            }
            try {
                authStatusP.textContent = "Accesso in corso...";
                await signInWithEmailAndPassword(auth, email, password);
                authStatusP.textContent = "Accesso effettuato, reindirizzamento...";
                window.location.href = "indexEly.html";
            } catch (error) {
                authStatusP.textContent = `Errore di accesso: ${error.message}`;
                console.error("Login error:", error);
            }
        }

        async function handleGoogleLogin() {
            try {
                authStatusP.textContent = "Accesso con Google in corso...";
                await signInWithPopup(auth, googleProvider);
                authStatusP.textContent = "Accesso con Google effettuato, reindirizzamento...";
                window.location.href = "indexEly.html";
            } catch (error) {
                authStatusP.textContent = `Errore di accesso con Google: ${error.message}`;
                console.error("Google login error:", error);
            }
        }

        btnRegister.addEventListener('click', handleRegister);
        btnLogin.addEventListener('click', handleLogin);
        btnGoogleLogin.addEventListener('click', handleGoogleLogin);
    </script>
</body>
</html>
