<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisi Nutrizionale AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        /* Copia qui gli stili CSS rilevanti dal tuo file index.html */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #0d47a1; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-top: 0; }
        .nav-links { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-links a { flex-grow: 1; text-align: center; padding: 10px; background-color: #607d8b; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
        .sezione { margin-bottom: 25px; padding: 20px; background-color: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; border-left-width: 5px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="date"] {
            width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em;
        }
        button { background-color: #1976d2; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: 600; transition: background-color 0.3s; }
        button:hover { background-color: #1565c0; }
        #report-output {
            margin-top: 20px;
            padding: 20px;
            background-color: #e8f5e9;
            border: 1px solid #c8e6c9;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Analisi Nutrizionale AI</h1>
        <div class="nav-links">
            <a href="index.html">⬅️ Torna al Tracker</a>
            <a href="builder.html">➕ Costruttore Pasti AI</a>
            <a href="storico.html">📊 Storico</a>
        </div>
        
        <div id="analisi-sezione" class="sezione">
            <h2>Seleziona la data da analizzare</h2>
            <label for="data-analisi">Data:</label>
            <input type="date" id="data-analisi">
            <button id="btn-esegui-analisi">Esegui Analisi AI</button>
        </div>
        
        <div id="report-sezione" class="sezione" style="display:none;">
            <h2>Report Nutrizionale</h2>
            <div id="report-output">Caricamento...</div>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

        // ************************************************************
        // INSERISCI QUI I TUOI PARAMETRI DI CONFIGURAZIONE FIREBASE
        // ************************************************************
        const firebaseConfig = {
            apiKey: "AIzaSyA5pSzpfq1aGZ1wjNV5-eXnIqWL6brl424",
            authDomain: "mio-tracker.firebaseapp.com",
            databaseURL: "https://mio-tracker-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "mio-tracker",
            storageBucket: "mio-tracker.firebasestorage.app",
            messagingSenderId: "382993217593",
            appId: "1:382993217593:web:f0780aa061c23f9503f5e8"
        };
        // ************************************************************
        // FINE CONFIGURAZIONE FIREBASE
        // ************************************************************

        // ************************************************************
        // CONFIGURAZIONE API GEMINI
        // INSERISCI LA TUA CHIAVE API QUI
        // ************************************************************
        const API_KEY_AI = "AIzaSyCZUoiawXYzrqDLh1m0O0Wnt5ZhR3wP9Ac";

        // --- ELEMENTI DEL DOM ---
        const dataAnalisiInput = document.getElementById('data-analisi');
        const btnEseguiAnalisi = document.getElementById('btn-esegui-analisi');
        const reportSezione = document.getElementById('report-sezione');
        const reportOutput = document.getElementById('report-output');

        // --- STATO E COSTANTI ---
        let db;
        let auth;
        let firebaseApp;
        let currentUserUID = null;

        const PIANO_SETTIMANALE = {
            0: { tipo: '💧 Riposo (Deficit)', cal_base: 2300, prot: 140 },
            1: { tipo: '🔥 Forza (Mantenimento)', cal_base: 2300, prot: 140 },
            2: { tipo: '💪 Forza (Mantenimento)', cal_base: 2300, prot: 140 },
            3: { tipo: '🏃 Cardio (Deficit)', cal_base: 2300, prot: 140 },
            4: { tipo: '🏋️ Forza (Mantenimento)', cal_base: 2300, prot: 140 },
            5: { tipo: '🏃 Cardio (Deficit)', cal_base: 2300, prot: 140 },
            6: { tipo: '🥗 Mantenimento (Free)', cal_base: 2300, prot: 140 }
        };

        // Funzione per caricare i dati di un giorno
        function caricaGiorno(data) {
            const rawData = localStorage.getItem(`trackerStorico_${data}`);
            return rawData ? JSON.parse(rawData) : null;
        }

        // Funzione per formattare i dati per l'AI
        function formattaDatiPerAI(dati) {
            if (!dati || !dati.log || dati.log.length === 0) {
                return "Nessun dato registrato per questa data.";
            }

            const dataDelGiorno = new Date(dataAnalisiInput.value);
            const giornoSettimana = dataDelGiorno.getDay();
            const pianoDelGiorno = PIANO_SETTIMANALE[giornoSettimana] || PIANO_SETTIMANALE[1];

            // Calcola i totali giornalieri per macronutrienti e micronutrienti di base
            let totaliGiornalieri = { prot: 0, cal: 0, fat: 0, fiber: 0, mg: 0, k: 0, vitc: 0, ca: 0 };
            dati.log.forEach(entry => {
                if (entry.type === 'meal' && entry.items) {
                    entry.items.forEach(item => {
                        totaliGiornalieri.prot += item.prot || 0;
                        totaliGiornalieri.cal += item.cal || 0;
                        totaliGiornalieri.fat += item.fat || 0;
                        totaliGiornalieri.fiber += item.fiber || 0;
                        totaliGiornalieri.mg += item.mg || 0;
                        totaliGiornalieri.k += item.k || 0;
                        totaliGiornalieri.vitc += item.vitc || 0;
                        totaliGiornalieri.ca += item.ca || 0;
                    });
                } else if (entry.type === 'single') {
                    totaliGiornalieri.prot += entry.prot || 0;
                    totaliGiornalieri.cal += entry.cal || 0;
                    totaliGiornalieri.fat += entry.fat || 0;
                    totaliGiornalieri.fiber += entry.fiber || 0;
                    totaliGiornalieri.mg += entry.mg || 0;
                    totaliGiornalieri.k += entry.k || 0;
                    totaliGiornalieri.vitc += entry.vitc || 0;
                    totaliGiornalieri.ca += entry.ca || 0;
                }
            });

            // Aggiungiamo i totali al prompt in modo conciso
            let testo = `Analizza la seguente giornata nutrizionale.
Obiettivi giornalieri:
- Calorie: circa ${pianoDelGiorno.cal_base + (dati.workoutCalorie || 0) + (dati.calorieAdjustment || 0)} kcal
- Proteine: circa ${pianoDelGiorno.prot} g
- Macronutrienti e Micronutrienti: equilibrati.

Totali consumati in questa giornata:
- Kcal: ${totaliGiornalieri.cal.toFixed(0)}
- Proteine: ${totaliGiornalieri.prot.toFixed(1)} g
- Grassi: ${totaliGiornalieri.fat.toFixed(1)} g
- Fibre: ${totaliGiornalieri.fiber.toFixed(1)} g
- Magnesio: ${totaliGiornalieri.mg.toFixed(1)} mg
- Potassio: ${totaliGiornalieri.k.toFixed(0)} mg
- Vitamina C: ${totaliGiornalieri.vitc.toFixed(1)} mg
- Calcio: ${totaliGiornalieri.ca.toFixed(1)} mg

Sulla base di questi totali e della tua conoscenza nutrizionale, forniscimi un report dettagliato e completo che includa:
1.  **Analisi Globale:** Un riassunto di come i totali macronutrienti e micronutrienti si confrontano con gli obiettivi.
2.  **Dettaglio Grassi:** Un'analisi approfondita sulla tipologia di grassi (saturi, insaturi, polinsaturi come gli omega-3) che potrebbero essere stati assunti, e un commento sulla loro qualità e quantità.
3.  **Dettaglio Vitamine:** Un'analisi dettagliata di vitamine importanti non elencate (es. Vitamine del gruppo B come B12, B2, Vitamina D, etc.). Commenta le possibili carenze e suggerisci alimenti per colmarle.
4.  **Carenze e Suggerimenti:** Un elenco puntato di cosa è mancato o è in eccesso e dei suggerimenti specifici su quali alimenti aggiungere o sostituire per migliorare l'equilibrio complessivo, con focus anche su alimenti che contengono fibre e micronutrienti non tracciati esplicitamente.

Usa un tono chiaro e professionale. Non restituire codice, ma solo testo formattato in modo leggibile.
`;

            return testo;
        }

        // Funzione per inviare la richiesta all'API di Gemini
        async function fetchAnalisiAI(prompt) {
            const geminiEndpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY_AI}`;

            try {
                const response = await fetch(geminiEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        "contents": [{
                            "parts": [{ "text": prompt }]
                        }]
                    })
                });

                if (!response.ok) {
                    throw new Error(`Errore di rete: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                return data.candidates[0].content.parts[0].text;

            } catch (error) {
                console.error("Errore durante l'analisi AI:", error);
                return `Si è verificato un errore durante l'analisi: ${error.message}. Controlla la console per i dettagli.`;
            }
        }

        // Gestore del pulsante di analisi
        btnEseguiAnalisi.addEventListener('click', async () => {
            const dataSelezionata = dataAnalisiInput.value;
            if (!dataSelezionata) {
                alert("Seleziona una data per l'analisi.");
                return;
            }

            const datiGiornalieri = caricaGiorno(dataSelezionata);
            if (!datiGiornalieri || !datiGiornalieri.log || datiGiornalieri.log.length === 0) {
                alert("Nessun dato registrato per la data selezionata.");
                return;
            }

            // Abilita la sezione del report e mostra un messaggio di caricamento
            reportSezione.style.display = 'block';
            reportOutput.textContent = "Caricamento dell'analisi in corso... attendi...";
            btnEseguiAnalisi.disabled = true;
            btnEseguiAnalisi.textContent = "Analisi in corso...";

            // Prepara il prompt per l'AI
            const promptPerAI = formattaDatiPerAI(datiGiornalieri);

            // Esegui la richiesta all'AI
            const reportAI = await fetchAnalisiAI(promptPerAI);

            // Mostra il report
            reportOutput.textContent = reportAI;

            // Riattiva il pulsante
            btnEseguiAnalisi.disabled = false;
            btnEseguiAnalisi.textContent = "Esegui Analisi AI";
        });

        // Imposta la data di default su quella odierna
        function getTodayString() {
            return new Date().toISOString().split('T')[0];
        }
        dataAnalisiInput.value = getTodayString();

        // Inizializza Firebase per la connettività
        try {
            if (!getApps().some(app => app.name === "analisiApp")) {
                firebaseApp = initializeApp(firebaseConfig, "analisiApp");
            } else {
                firebaseApp = getApp("analisiApp");
            }
            db = getDatabase(firebaseApp);
            auth = getAuth(firebaseApp);
            console.log("Firebase inizializzato per l'analisi.");
        } catch (error) {
            console.error("Errore durante l'inizializzazione di Firebase:", error);
        }
    </script>
</body>
</html>
